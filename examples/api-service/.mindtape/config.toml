#:schema ../../../schema/config.schema.json
# A backend team's backlog. Each block below solves one problem.

# Require a task shape: Problem, TO-BE, Changes and Out of scope in every task.
# docs:slice api-service/require-a-task-shape
extends = ["mindtape-tasks"]
# docs:end

# One task at a time, in order: one task in wip, started after its dependencies.
# docs:slice api-service/one-task-at-a-time
tasks.status = [
  { value = "proposed" },
  { value = "wip", unblocked = true },
  { value = "done", terminal = true, unblocked = true },
]

[[tasks.rules]]
name = "one-wip"
when = 'status == "wip"'
assert = 'count(status == "wip") <= 1'
message = "finish the task in progress before you start another"
severity = "error"
# docs:end

# Split oversized tasks: a task estimated over 5 source files is refused.
# docs:slice api-service/split-oversized-tasks
[[tasks.rules]]
name = "split-big-work"
when = "!terminal"
assert = "estimate.src-files <= 5"
message = "split it into tasks of 5 source files or fewer"
severity = "error"

[tasks.estimate]
units = ["src-files"]
required = "!terminal"
# docs:end

# Rank the work: an ICE score on a 0..9 scale, and a band that names each score.
[tasks.priority]
kind = "int"
min = 0
max = 9
framework = "ice"
allow-manual = false

[[tasks.priority.bands]]
label = "green"
min = 0
max = 2
glyph = "🟢"
color = "green"

[[tasks.priority.bands]]
label = "amber"
min = 3
max = 6
glyph = "🟡"
color = "yellow"

[[tasks.priority.bands]]
label = "red"
min = 7
max = 9
glyph = "🔴"
color = "red"

# Tag by service: a tag is a service name or one of a few areas. `@services`
# expands to the dictionary below when the config loads.
[tasks.tags]
allowed = ["@services", "security", "docs"]

# Gate done on your checks: `mt done` refuses while `scripts/test` fails.
# docs:slice api-service/gate-done-on-checks
[[on.flip]]
when = 'into("done")'
actions = [{ run = "scripts/test", gate = true }]
# docs:end

# Trace commits to tasks: each commit names its task in a `Refs:` trailer.
# docs:slice api-service/trace-commits-to-tasks
[commits]
trailer = "Refs"
# docs:end

# Name the services once. A task tag and a rule can both read the set. It joins
# inline `values` with a `path` file (one entry per line), and `case` sets how
# lookups compare.
[dicts.services]
values = ["auth", "billing"]
path = "dicts/services.txt"
case = "fold"

# Name the verbs a title may start with. The pack declares this same set under
# this name, and a project dictionary replaces a pack's by name.
[dicts.verbs]
include = ["mindtape-verbs", "mindtape-dev-verbs"]

# List what is open and due to start. A bare `mt ls` applies the default view.
[views.default]
filter = "!terminal && (miss(start) || start <= now())"

# Find the work nobody has looked at in two weeks.
[views.stuck]
filter = "!terminal && stale(14)"
sort = ["priority:desc", "due:asc"]
columns = ["#", "status", "ready", "priority", "due", "title"]
description = "Open and not reviewed in 14 days"

# Plan the week: what is due Monday to Sunday, soonest first.
[views.this-week]
filter = '!terminal && has(due) && due >= "2026-09-28" && due <= "2026-10-04"'
sort = ["due:asc"]
columns = ["#", "status", "priority", "due", "title"]
description = "Work due this week"

# Check the tasks against this checkout's prelude in lib/.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"
