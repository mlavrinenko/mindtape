#:schema ../../../schema/config.schema.json
# A sample backend project's backlog. Each block below is one recipe.

# Require a task shape: Problem, TO-BE, Changes and Out of scope in every task.
# docs:slice api-service/require-a-task-shape
extends = ["mindtape:tasks"]
# docs:end

# Limit work in progress: one milestone and one task in wip, each started
# after its dependencies.
# docs:slice api-service/limit-work-in-progress
tasks.status = [
  { value = "proposed" },
  { value = "wip", unblocked = true },
  { value = "done", terminal = true, unblocked = true },
]

[[tasks.rules]]
name = "one-milestone"
when = 'status == "wip" && kind == "milestone"'
assert = 'count(status == "wip" && kind == "milestone") <= 1'
message = "close the open milestone before you open another"
severity = "error"

[[tasks.rules]]
name = "one-task"
when = 'status == "wip" && kind != "milestone"'
assert = 'count(status == "wip" && kind != "milestone") <= 1'
message = "finish the task in progress before you start another"
severity = "error"
# docs:end

# Tie work to your goals: an open milestone rates each goal in goals.typ.
# docs:slice api-service/tie-work-to-goals
[[tasks.rules]]
name = "goals"
when = '!terminal && kind == "milestone"'
check = { typst = "goals.typ", function = "check-goals", field = "x-goals" }
severity = "error"
# docs:end

# Split oversized tasks: a task that takes judgment, difficulty 3 and up, is
# refused over 5 source files. Mechanical work has no cap.
# docs:slice api-service/split-oversized-tasks
[[tasks.rules]]
name = "judgment-stays-small"
when = "!terminal && difficulty >= 3"
assert = "estimate.src-files <= 5"
message = "split the decision from the mechanical edits, so each task touches 5 source files or fewer"
severity = "error"

[tasks.estimate]
units = ["src-files"]
required = "!terminal"
# docs:end

# Rank the work: an ICE score on a 0..9 scale, and a band that names each score.
[tasks.priority]
kind = "int"
min = 0
max = 9
framework = "ice"
allow-manual = false

[[tasks.priority.bands]]
label = "green"
min = 0
max = 2
glyph = "🟢"
color = "green"

[[tasks.priority.bands]]
label = "amber"
min = 3
max = 6
glyph = "🟡"
color = "yellow"

[[tasks.priority.bands]]
label = "red"
min = 7
max = 9
glyph = "🔴"
color = "red"

# Tag by service: a tag is a service name or one of a few areas. `@services`
# expands to the dictionary below when the config loads.
[tasks.tags]
allowed = ["@services", "security", "docs"]

# Wait on upstream: a task waits until Cargo.lock pins the release it needs.
# docs:slice api-service/wait-on-upstream
[[tasks.waits]]
name = "locked"
run = "scripts/locked {id}"
# docs:end

# The tasks hold `docs:` slice markers as comments, which the pack bans.
[tasks.comments]
allow-pattern = "^docs:"

# The templates have no `kind` slot, which the pack requires of an open task.
[tasks.fields.kind]
required = false

# Run the tests before a task closes. `mt done` refuses while `scripts/test`
# fails.
[[on.flip]]
when = 'into("done")'
actions = [{ run = "scripts/test", gate = true }]

# Trace commits to tasks: each commit names its task in a `Refs:` trailer.
# docs:slice api-service/trace-commits-to-tasks
[commits]
trailer = "Refs"
# docs:end

# Name the services once. A task tag and a rule can both read the set. It joins
# inline `values` with a `path` file (one entry per line), and `case` sets how
# lookups compare.
[dicts.services]
values = ["auth", "billing"]
path = "dicts/services.txt"
case = "fold"

# Start titles with a verb: the pack's imperative-title rule looks up a title's
# first word in [dicts.verbs]. This dictionary replaces the pack's by name, so
# it includes both shipped word lists and adds the project's own words.
# docs:slice api-service/start-titles-with-a-verb
[dicts.verbs]
include = ["mindtape-verbs", "mindtape-dev-verbs"]
values = ["backport", "dockerize"]
# docs:end

# List what is open and due to start. A bare `mt ls` applies the default view.
[views.default]
filter = "!terminal && (miss(start) || start <= now())"

# Find the work nobody has looked at in two weeks.
[views.stuck]
filter = "!terminal && stale(14)"
sort = ["priority:desc", "due:asc"]
columns = ["slug#", "status", "ready", "priority", "due", "title"]
description = "Open and not reviewed in 14 days"

# Plan the week: what is due Monday to Sunday, soonest first.
[views.this-week]
filter = '!terminal && has(due) && due >= "2026-09-28" && due <= "2026-10-04"'
sort = ["due:asc"]
columns = ["slug#", "status", "priority", "due", "title"]
description = "Work due this week"

# Check the tasks against this checkout's prelude in lib/.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"
