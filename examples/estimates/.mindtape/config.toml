#:schema ../../../schema/config.schema.json
# examples/estimates/.mindtape/config.toml — the checked project /estimates/
# reads back as data.
#
# Its one job is estimates: a `files` unit, then the caps and the working-tree
# budget as plain `[[tasks.rules]]` entries — a ceiling gated on `difficulty`,
# an unconditional one, a floor, and a `changed()` budget. The page slices
# those two groups out of this file instead of retyping them, so a cap
# `mt check` would refuse can no longer be printed as a cap to copy.
#
# `files` rather than a duration because a file count is the one estimate a
# rule can hold against git — `changed()` counts files, never hours.
#
# No task here sits in `wip`, so the budget rule never evaluates `changed()`:
# it reads the working tree of whatever repo it runs inside, and this fixture
# lives inside MindTape's own, where `just check-examples` would then report a
# warning that tracks the checkout's diff rather than anything about the
# fixture. What IS exercised on every run is the load: a `when` or `assert`
# that does not parse, an unknown git state, a malformed glob or a unit outside
# `units` each fail `mt check` here.
#
# Deliberately thin otherwise: roots and a four-value legend. The `difficulty`
# scale the ceiling's `when` reads is the embedded floor's 0..9, undeclared
# here on purpose — a project needs no scale of its own to gate a rule on it.

# Resolve @local/mindtape from lib/ two levels up — the prelude under test —
# rather than the machine-global symlink; same entry and reasoning as the other
# checked examples.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"

[tasks]
roots = ["tasks"]

# docs:slice estimates/caps
[tasks.estimate]
units = ["files"]

[[tasks.rules]]
name = "judgment-stays-small"
when = "!terminal && difficulty >= 3"
assert = "estimate.files <= 5"
message = "judgment work stays small; split it rather than widen the cap"
severity = "error"

[[tasks.rules]]
name = "mechanical-cap"
when = "!terminal && !(difficulty >= 3)"
assert = "estimate.files <= 15"
severity = "error"

[[tasks.rules]]
name = "at-least-one-file"
when = "!terminal"
assert = "estimate.files >= 1"
severity = "error"
# docs:end

# docs:slice estimates/budget
[[tasks.rules]]
name = "budget"
when = 'status == "wip" && has(estimate.files)'
assert = 'changed("staged+worktree", "!docs/generated/**", "!*.lock") <= estimate.files'
message = "rescope before going further"
severity = "warn"
# docs:end

[[tasks.status]]
value = "todo"
glyph = "📋"
color = "cyan"

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true
