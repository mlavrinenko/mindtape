#:schema ../../../schema/config.schema.json
# A project whose tasks carry a field it made up, `x-goals`, and check it
# with its own Typst function in lib.typ on every `mt check` and every write.
#
# tasks/export-report-as-csv.typ skips a goal on purpose, so `mt check` here
# always fails. /self-validating-tasks/ shows that refusal, and
# `just check-examples` leaves this project out for the same reason.

# Resolve @local/mindtape from this checkout's lib/.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"

[tasks]
roots = ["tasks"]

[[tasks.status]]
value = "todo"

[[tasks.status]]
value = "wip"

[[tasks.status]]
value = "done"
terminal = true

[tasks.priority]
kind = "int"
min = 0
max = 9
required = false

# docs:slice self-validating/goals-rule
[[tasks.rules]]
name = "goals"
check = { typst = "lib.typ", function = "check-goals", field = "x-goals" }
severity = "error"
# docs:end
