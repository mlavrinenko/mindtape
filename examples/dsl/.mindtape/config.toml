#:schema ../../../schema/config.schema.json
# examples/dsl/.mindtape/config.toml — the checked project AGENTS.md and the
# /dsl/ page slice their task DSL sketch out of.
#
# Its one job is a task file that sets every field the sketch shows, so a field
# or helper that changes shape fails `just check-examples` before either page
# can show it wrong. The dependency it links to is done, so the task is ready.
#
# Deliberately thin: roots, a four-value legend and the ICE framework.
# Everything else comes from the embedded floor.

# Resolve @local/mindtape from lib/ two levels up — the prelude under test —
# rather than the machine-global symlink; same entry and reasoning as the other
# checked examples.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"

[tasks]
roots = ["tasks"]

[tasks.priority]
kind = "int"
min = 0
max = 9
framework = "ice"

[[tasks.status]]
value = "todo"
glyph = "📋"
color = "cyan"

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true
