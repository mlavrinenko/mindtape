# examples/learn-piano/.mindtape/config.toml — a self-contained piano-practice
# tracker. Real fixture (not a toy): showcases the full config surface and
# doubles as the input the docs generator runs `mt` against. Modeled on the
# repo's own .mindtape/config.toml.

# Resolve `@local/mindtape` from the `lib/` two levels up — this checkout's
# prelude — instead of the machine-global local-package directory, which is one
# symlink pointing at whichever checkout last ran `just install-lib`. Without
# this line every worktree and every second clone validates these tasks against
# the MAIN tree's prelude, silently: `just check-examples` in a fork editing the
# DSL would gate the fixture against a prelude the fork did not change, and the
# harvest cache — whose build key folds each override's file contents — would
# not even re-evaluate, since with no override there is nothing about the
# prelude in the key. The repo's own root needs no such entry: the loader
# auto-registers `<root>/lib` when its typst.toml names `mindtape`, and nothing
# named `lib` sits beside a fixture.
#
# It is also the one part of the config surface this fixture would otherwise
# not showcase. `path` is relative to the project root and may leave it.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"

[tasks]
[[tasks.roots]]
path = "tasks"
name = "piano"
derive-tags = true

# Folder-derived tags: technique/repertoire/theory fold in as both flat
# segment tags (`technique`) and breadcrumbs (same string at this one-level
# depth, deduped) — see derive-tags.
[tasks.derive-tags]
collect = ["segments", "breadcrumbs"]

# Status legend: legal values in lifecycle order. `to` declares the allowed
# next statuses, so `mt flip` gates every move to a listed edge (`--force`
# overrides) and `mt check` flags a status unreachable from `proposed`.
[[tasks.status]]
value = "proposed"
glyph = "💡"
color = "blue"
to = ["accepted", "wip", "cancelled"]

[[tasks.status]]
value = "accepted"
glyph = "📋"
color = "cyan"
to = ["wip", "cancelled"]

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"
to = ["done", "blocked", "failed", "cancelled"]

[[tasks.status]]
value = "blocked"
glyph = "⛔"
color = "red"
to = ["wip", "cancelled"]

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true
to = ["wip"]

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true

[[tasks.status]]
value = "failed"
glyph = "❌"
color = "red"
terminal = true
to = ["wip"]

# Priority: an ICE score on a 0..9 scale. `impact` = how much a drill advances
# your playing, `confidence` = how reliable the method is, `ease` = how little
# effort it takes to drill. `allow-manual = false` is strict — every task
# scores through the framework, no hand-set ints.
[tasks.priority]
kind = "int"
min = 0
max = 9
required = "!terminal"
framework = "ice"
allow-manual = false

[[tasks.priority.bands]]
label = "green"
min = 0
max = 2
glyph = "🟢"
color = "green"

[[tasks.priority.bands]]
label = "amber"
min = 3
max = 6
glyph = "🟡"
color = "yellow"

[[tasks.priority.bands]]
label = "red"
min = 7
max = 9
glyph = "🔴"
color = "red"

[tasks.estimate]
units = ["minutes", "hours", "days", "weeks"]

[tasks.tags]
# Authored practice-area tags plus every derived root/folder tag
# (piano/technique/repertoire/theory) — strict allow-list. `"@composers"` is a
# reference to `[dicts.composers]` below, expanded to that dictionary's entries
# at config load: a name a rule and an allow-list can both point at.
allowed = [
  "@composers",
  "warmup",
  "daily",
  "scales",
  "arpeggios",
  "sight-reading",
  "classical",
  "recital",
  "jazz",
  "theory-drill",
  "ear-training",
  "piano",
  "technique",
  "repertoire",
  "theory",
]

# `severity = "warn"`, not `error`: this fixture stands in for a project
# ADOPTING the convention mid-backlog rather than starting clean — most of
# its open titles predate the rule and a hand retitle is exactly the kind of
# unstarted work `mt add`/`mt flip` should never refuse mid-session. `warn`
# reports the gap on every write and `mt check` without blocking any of them,
# which is what a project catching up actually wants; nothing stops
# tightening to `error` once the backlog conforms. `fur-elise-polish` is left
# as filed for that reason — its title predates the rule, so it is the one
# task here that still warns, proving the write goes through and `mt check`
# still passes. `when = "!terminal"` is the other half: closed history
# (`abandoned-rondo-alla-turca`, `major-scales-two-octaves`,
# `circle-of-fifths-drill`, `sight-singing-solfege`) is not backfilled either.
[[tasks.rules]]
name = "imperative-title"
assert = 'in_dict("verbs", word(title, 1))'
when = "!terminal"
message = "start the title with an imperative verb"
severity = "warn"

# The same imperative-title convention the main repo holds itself to (see
# .mindtape/config.toml) — `verbs` unions both shipped dicts, and the rule
# below asks whether a title's first word is in it.
[dicts.verbs]
include = ["mindtape-verbs", "mindtape-dev-verbs"]

# The other two sources, and the lookup rule, in one entry: inline `values`, a
# `path` file read one entry per line, and `case`. Referenced as `@composers`
# from the tags allow-list above, so `mt check` resolves it on every run rather
# than leaving a dictionary nothing reads.
[dicts.composers]
values = ["beethoven", "debussy"]
path = "dicts/composers.txt"
case = "fold"

# The default `mt ls` listing (used when the caller passes no filter): a view,
# so it can carry sort and columns too, not just a filter. `[ls] default-view`
# points the default at another view by name.
[views.default]
filter = "!terminal && (miss(start) || start <= now())"

# Named views: `mt views` lists them, `mt ls @name` applies filter+sort+columns.
[views.stuck]
filter = "blocked && stale(30)"
sort = ["priority:desc", "due:asc"]
columns = ["#", "status", "ready", "priority", "due", "title"]
description = "Blocked and not reviewed in 30 days"

[views.this-week]
filter = '!terminal && has(due) && due >= "2026-07-06" && due <= "2026-07-13"'
sort = ["due:asc"]
columns = ["#", "status", "priority", "due", "title"]
description = "Practice queue due this week"

# Auto-activation for bare `mt ls`: on a practice weekday, lead with this
# week's due queue (sort + columns imported from `this-week`) but relax its
# filter to every open task, not just this week's due ones. On a weekend (no
# rule's condition holds) bare `mt ls` falls through to `[views.default]`
# unchanged. `condition` also reaches `on_branch("release/*")` / `env("CI")`
# for a git-branch- or CI-driven listing — see the docs site.
[[ls.rules]]
name = "weekday-session"
condition = "weekday() <= 5"
import-views = ["this-week(sort, columns)"]
filter = "!terminal"
