#:schema ../../../schema/config.schema.json
# examples/minimal/.mindtape/config.toml — the floor.
#
# This declares the least a project can and still be useful: a
# four-value legend with no transition graph, an optional raw-int priority, no
# template, no required fields, no header rules, no derived tags. Everything
# else is inherited from the embedded defaults.
#
# It also backs the mindtape skill's trap evals, and the two things it does NOT
# have are the point:
#
#   - No `blocked` in the legend. Blockage here is what it is everywhere — a
#     `links: depends-on` edge (write-docs waits on add-dark-mode) — so an agent
#     that reaches for `mt flip blocked` has invented a status.
#   - No `[templates]`, so `mt add` falls back to the built-in task template
#     whose only slot is `title`. `mt add … --set priority=8` is therefore
#     refused by name: non-zero exit, `error: unknown slot:
#     'priority'`. A skill that does not warn about that ships agents
#     into a dead end they read as a tool bug rather than a missing slot.
#
# Keep both absences. Fixing them here would quietly delete the eval coverage
# they exist to provide.

# The one section here that is NOT part of the floor, and not a line to copy. A
# real minimal project installs the prelude once per machine (`mt install`) and
# declares nothing; this fixture lives INSIDE the MindTape checkout, so it must
# resolve `@local/mindtape` from the `lib/` two levels up — the prelude under
# test — rather than through the machine-global local-package symlink, which
# points at whichever checkout last ran `just install-lib`. Without it
# `just check-examples` gates a fork's fixture against the main tree's prelude.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"

[tasks]
roots = ["tasks"]

[[tasks.status]]
value = "todo"
glyph = "📋"
color = "cyan"

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true

# Bands come from the embedded floor (0-2 / 3-6 / 7-9), so `max` must be 9.
[tasks.priority]
kind = "int"
min = 0
max = 9
required = false

[views.default]
filter = "!terminal"
