#:schema ../../../schema/config.schema.json
# examples/lsp/.mindtape/config.toml — the project the Overview's language
# server blocks come from.
#
# www/lsp-capture.py opens two files in tinymist. It asks for completions at
# the `// docs:cursor` line of tasks/fix-the-login-redirect.typ, and it reads
# the diagnostics tinymist publishes for invalid/misspelled-field.typ.
# invalid/ sits outside the roots, so `mt` never reads the misspelled file,
# and `just check-examples` checks tasks/ alone.

# Resolve @local/mindtape from lib/ two levels up, the prelude under test,
# as the other checked examples do. tinymist reads the copy `mt install` puts
# in a data home of the capture's own.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"

[tasks]
roots = ["tasks"]
