#:schema ../../../schema/config.schema.json
# examples/links/.mindtape/config.toml — the checked project /links/ reads
# back as data.
#
# Its one job is the `links:` field: eight tasks exercise the built-in helpers
# (depends-on, parent, related, supersedes, duplicates) and one
# project-declared kind validated as a URL. The page slices those real
# expressions out of the task files, and the kind declarations out of this
# file, so a helper or a key that changes shape fails `just check-examples`
# instead of leaving a code block that no longer parses.
#
# Deliberately thin: roots, a four-value legend, the custom kinds. Everything
# else is inherited from the embedded floor, so nothing here can drift from
# the defaults the page describes.

# Resolve @local/mindtape from lib/ two levels up — the prelude under test —
# rather than the machine-global symlink; same entry and reasoning as
# examples/learn-piano and examples/minimal.
[[typst.local-packages]]
name = "mindtape"
path = "../../lib"

[tasks]
roots = ["tasks"]

# Project-declared kinds. `discharged-by` is the one a task here uses; the
# other three are loaded and validated on every `mt check`, so a key the
# loader refuses, such as a `regex` kind with no pattern, fails the gate.
# docs:slice links/kinds
[[tasks.links.kinds]]
name = "discharged-by"
validate = "url"
note = "optional"

[[tasks.links.kinds]]
name = "landed-as"
validate = "git-sha"

[[tasks.links.kinds]]
name = "ticket"
validate = "regex"
regex = "^ACME-[0-9]+$"

[[tasks.links.kinds]]
name = "split-from"
max = 1
note = "forbidden"
# docs:end

[[tasks.status]]
value = "todo"
glyph = "📋"
color = "cyan"

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true
