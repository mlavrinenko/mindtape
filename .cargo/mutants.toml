# cargo-mutants config. Mutation testing is a manual/scoped dev aid driven by
# `just mutants::sweep` (see CONTRIBUTING.md "Testing"), never a `just check` gate.

# Classes are named in docs/contributing/mutation-testing.md (Triage).
#
# main.rs: entry-point — a thin entry point, excluded like the CRAP gate
# (`just crap::check`) excludes it.
exclude_globs = ["**/main.rs"]
# Provably-equivalent mutants: unkillable by construction, excluded so a swept
# file can reach a clean (zero-survivor) result and stop re-appearing in the
# loop. Keep each line paired with its class and the reason it cannot be killed;
# the class leads the comment, so a recurring class is a grep away.
exclude_re = [
  # same-call: graph/ready.rs empty() is literally `Self::default()`, so replacing the
  # body with Default::default() is the same call — no test can tell them apart.
  #
  # Deleting `empty()` in favour of `Default::default()` would remove this entry
  # outright, and that was considered and rejected: it is a documented public
  # constructor ("every query returns false, every task is settled") used at 35
  # call sites across both crates, and `mindtape` is a library other tools
  # depend on, so dropping it is a breaking change for a consumer. Trading a
  # named constructor and a consumer's API for one honest exclusion is a bad
  # deal — a provably-equivalent mutant with a written reason is exactly what
  # this list is for.
  "replace Readiness::empty -> Self with Default::default()",
  # pure-memoisation: config/views.rs dfs DONE arm, the black-node check. A
  # node only reaches DONE once its whole subtree came back cycle-free, so
  # re-walking it can only return None again — deleting the arm changes the
  # running time (exponential), never the answer.
  "delete match arm DONE in dfs",
  # discarded-effect: parse_batch's loop runs while `blobs.len() < count`;
  # the one extra iteration a `<=` admits parses one more object the final
  # `blobs.resize(count, None)` then discards, so the returned Vec is
  # identical for every input.
  "replace < with <= in parse_batch",
  # no-public-constructor: evalexpr's `!` node is always unary (one child),
  # so the arm above claims every reachable `Not`; only a hand-built
  # two-child node could reach the wrong-arity arm, and evalexpr's `Node`
  # has no public constructor for one.
  "delete match arm .Operator::Not, _. in connective",
  # aliased-input: an empty `path.parent()` and `Path::new(".")` both name
  # the process's current directory, and `Path::new("").join(name)` and
  # `Path::new(".").join(name)` resolve to the same file, so the mutated
  # guard picks the same temp-file location.
  "replace match guard !dir.*is_empty.* with true in write_atomic",
  # type-tautology: `skip` is a `usize`, so `>= 0` is always true; at
  # `skip == 0` the branch runs `drain(..skip.min(len))`, which is
  # `drain(..0)` — a no-op identical to skipping it.
  "replace > with >= in resolve_and_select",
  # platform-specific: on Unix `MAIN_SEPARATOR` is `/`, so this clause
  # duplicates the next one and the whole expression is `A || (A || ext)`
  # under either operator. The difference is Windows-only; the sweep runs on
  # Unix.
  "replace .. with && in looks_like_path",
]
# nextest, not cargo test — the suite is written for one process per test.
# `cargo test` runs every test in a binary in one process, so process-global
# `OnceLock`s (`file_path::CONTEXT`, `util::WORKTREE`) leak between tests and
# tests that assert the unset state fail in the unmutated baseline before any
# mutant runs. `just test` and `just cover` already use nextest for exactly
# this reason; a mutation verdict measured under a different execution model
# is not about the suite the gate runs.
test_tool = "nextest"
# Every mutant faces the whole workspace suite, not only its own package's
# tests. The default package scope under-counts catches: a `mindtape` lib
# mutant is also exercised by the cli's end-to-end tests, and the 2026-09-29
# refresh measured 35 lib mutants that the package-local sweep named as
# survivors and the workspace suite caught. The scope is part of the measured
# claim — a survivor list from the narrower run does not survive this one.
test_workspace = true
# Parallel load slows a mutant's suite long before it hangs it: at jobs=8 the
# workspace suite was observed at ~58 s against a ~9 s baseline, and the auto
# 60 s timeout recorded TIMEOUT for mutants that were merely slow — measured
# 2026-09-29 on cmd/rm/gitless/unlink.rs:136:28, TIMEOUT at jobs=8 and MISSED in 8 s at
# jobs=1. A verdict meant to be believed runs at CARGO_MUTANTS_JOBS=2 anyway
# (see docs/contributing/mutation-testing.md); this floor leaves that ~4x
# headroom while still bounding a genuine hang.
minimum_test_timeout = 120
# Build every mutant under the debuginfo-free `mutants` profile (Cargo.toml).
# Benchmarked ~20% faster per mutant; picked up by every `cargo mutants` call.
profile = "mutants"
# Copy .git into every mutant's scratch tree. `dogfood_check` loads this repo's
# own config over truth/tasks, and the `src-budget` rule's `changed()` reads git;
# without a repository the baseline fails before any mutant runs. ~13 MB added
# to the ~17 MB tree copy cargo-mutants makes per mutant.
copy_vcs = true
