# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/outdatty/main/schema/outdatty.schema.json

# Declares which dependents must be re-confirmed when a source changes. After
# editing a source, review the dependents and run `just outdatty-update <group>`
# to record the new state. `just outdatty-update-all` re-records every group, so
# use it only after reviewing every group's dependents. `just outdatty-check`
# (part of `just check`) fails until you do.

# `require_tracked` opts out of outdatty's audit that every non-gitignored file
# belongs to some group (default `["**"]`). The audit does not fit this repo.
# Most files are crate sources and task artifacts, and no drift group should
# claim either. A group means "review these dependents when this source
# changes", and answering the audit by inventing groups would turn it into
# "this file is known", which is not worth gating. Even the doc surfaces the
# audit suits (a new page that no group tracks) have real exclusions inside
# them (generated `.md` outputs, CSS, the jq programs), so no narrow scope is
# free either. The opt-out is explicit so that a tool bump does not absorb it
# silently.
require_tracked: ["!**"]

# What a dependent-only edit owes this lock: record that dependent alone, in the
# commit that made the edit, with `just outdatty-update <group> <path>`.
#
# Only a source change triggers the gate. That asymmetry is intended. A
# dependent edited on its own moves no source hash, so the gate stays green, and
# the dependent's recorded hash sits stale until an unrelated source edit
# re-records the group and carries the dependent's hash along. The lock then
# shows the review on the wrong commit.
#
# Measured on outdatty 0.4.0 with one hand-edited dependent:
#
#   - `outdatty check` and plain `outdatty status` print `[ ok ]` for the group
#     and exit 0.
#   - `outdatty status --format json` names the file in the group's
#     `changed_dependents` array while its `status` stays `"ok"`.
#   - `outdatty update --group <g>` rewrites only that dependent's hash while no
#     other dependent in the group is pending. With another one pending, the
#     group re-record stamps it too, onto a commit that never reviewed it.
#
# So the record is per file. outdatty 0.5's `--dependent <path>` (the recipe's
# optional trailing paths) records the named dependent's hash and leaves the
# group's sources and every other pending dependent as locked. That makes the
# watermark CONTRIBUTING.md claims ("a recorded hash is a review watermark")
# hold for dependents as well as sources. A source edit still re-records the
# whole group, because that edit obliges a review of every dependent.
#
# This is a convention with a query and no gate. A dependent changing alone is
# ordinary work, and a check that failed on it would turn every doc edit red and
# reverse the source/dependent asymmetry above. Pending re-records are listed by
#
#   outdatty status --format json | jq -r '.groups[] | select(.changed_dependents != []) | .id'
#
# A forgotten one misattributes the watermark and never breaks a build.

groups:
  # The CLI surface (commands, flags, behaviour) is documented by hand in the
  # docs-site reference pages. README.md carries only a thin, illustrative
  # command teaser, tracked by the coarser cli-name group below.
  #
  # `cli/mod.rs` only wires the `Command` enum onto each module's `*Args` struct.
  # It names the types and does not declare their fields. Every flag lives in
  # its own command module (`AddArgs` in `cmd/add/mod.rs`, `LsArgs` in `cmd/ls/mod.rs`, …), so a
  # flag change there leaves `cli/mod.rs` byte-identical and busts no group unless
  # the module is a source. The modules below are listed explicitly and not as a
  # glob (e.g. `crates/mindtape-cli/src/*.rs`), because the command directory
  # interleaves each command's `*Args` module with its own helper, rendering
  # and test siblings (`cmd/add/dedup.rs`, `cmd/add/interactive.rs`, `cmd/ls/rules.rs`,
  # `cmd/init/wizard/mod.rs`, `*_tests*.rs`, …) under no naming convention that
  # separates the two (`add*.rs` alone matches five unrelated files). A
  # directory-wide glob would fire this group on internal refactors that touch
  # no documented flag. An explicit list needs a manual add for a brand-new
  # command module, but `just check-doc-coverage` covers that half of the gap
  # (it fails naming any visible `mt` subcommand missing from
  # `www/utils/cli-notes.typ`), so this list only has to catch the other half:
  # a flag changing on a command the docs already know. `cli/tree_json.rs`
  # (`mt _cli`) is not one of these sources. It is hidden tooling that reflects
  # `Cli::command()` back out for the docs generator, so it can only remove
  # drift (see its own module doc).
  #
  # hooks.typ, estimates.typ, named-sets.typ, statuses.typ and rules.typ are
  # dependents for config.typ's reason: each is a deep dive split off that page,
  # and each restates by hand the config surface it covers (`[[on.flip]]`,
  # `[tasks.estimate]`, `[views]`/`[dicts]`, the status legend, the rule
  # arrays). A section moved to a page of its own stays under the drift gate.
  - name: cli-docs
    source:
      - crates/mindtape-cli/src/cli/mod.rs
      - crates/mindtape-cli/src/cmd/add/mod.rs
      - crates/mindtape-cli/src/cmd/check/mod.rs
      # Not an `*Args` module: it declares which argument completes from which
      # project value. The dependents restate that set in prose (cli-notes.typ's
      # `install` entry names the sources a tab press offers), and nothing in
      # www/generated/*.json carries it as a fact a page could render instead.
      # `cli.json` reflects the per-argument entry and not the roster.
      - crates/mindtape-cli/src/cli/completion/mod.rs
      - crates/mindtape-cli/src/cmd/config.rs
      - crates/mindtape-cli/src/cmd/eval.rs
      - crates/mindtape-cli/src/cmd/find.rs
      - crates/mindtape-cli/src/cmd/flip/mod.rs
      - crates/mindtape-cli/src/cmd/go.rs
      - crates/mindtape-cli/src/cmd/graph/mod.rs
      - crates/mindtape-cli/src/cmd/import/mod.rs
      - crates/mindtape-cli/src/cmd/init/mod.rs
      - crates/mindtape-cli/src/cmd/install/mod.rs
      # `mt link`'s flags live in `cmd/link/mod.rs` (`LinkArgs`). Its input format,
      # the adjacency map the docs restate by hand on the DSL page and in
      # SKILL.md, lives in `cmd/link/input.rs`, so both are sources. The other two
      # halves are not: `cmd/link/edit.rs` and `cmd/link/plan.rs` decide what gets
      # written and what is refused, and no dependent restates either beyond
      # what those two files already declare.
      - crates/mindtape-cli/src/cmd/link/mod.rs
      - crates/mindtape-cli/src/cmd/link/input.rs
      - crates/mindtape-cli/src/cmd/ls/mod.rs
      - crates/mindtape-cli/src/cmd/mv.rs
      # `--format`'s per-surface contract: which columns each machine format
      # carries and what each cell means. `cmd/ls/mod.rs` decides nothing about this, as
      # it hands a resolved list to `render()`. So the CSV mapping decision
      # (`#` -> `id`, and `file` as the root-relative record path rather than
      # the table's cwd-relative display) lives here and nowhere else, while
      # www/content/cli/ls.typ and schema.typ each restate it by hand.
      - crates/mindtape-cli/src/render/output.rs
      - crates/mindtape-cli/src/cmd/preset.rs
      - crates/mindtape-cli/src/cmd/recur/mod.rs
      - crates/mindtape-cli/src/cmd/review.rs
      - crates/mindtape-cli/src/cmd/rm/mod.rs
      - crates/mindtape-cli/src/cmd/set.rs
      - crates/mindtape-cli/src/cmd/views.rs
      - crates/mindtape-cli/src/cmd/worktrees.rs
      - crates/mindtape/src/lib.rs
      # The filter/`--sort` field vocabulary. Every dependent that lists the
      # comparable fields (filters.typ, skills/mindtape/references/filters.md)
      # hand-types them, and nothing in www/generated/*.json carries this
      # registry. Renaming `file` to `path` would change a documented surface
      # while every source above stayed byte-identical. `sort.rs` is not a
      # second source: its accepted vocabulary is derived from this registry
      # (`is_sort_field`), so a field cannot enter or leave one without the
      # other, and the rest of that file is comparator internals no dependent
      # restates.
      - crates/mindtape/src/model/fields.rs
      - crates/mindtape/src/config/defaults.toml
      - crates/mindtape-cli/src/cmd/init/presets/todone/config.toml
      - crates/mindtape-cli/src/cmd/init/presets/flow/config.toml
      - crates/mindtape-cli/src/cmd/init/presets/personal/config.toml
      - crates/mindtape-cli/src/cmd/init/presets/gated/config.toml
    dependents:
      - www/content/cli.typ
      # One page per command. Each may carry hand-written prose beside the
      # reference cli-ref.typ renders, as cli/ls.typ does for columns and
      # `[[ls.rules]]`.
      - www/content/cli/*.typ
      - www/content/links.typ
      - www/content/recurring.typ
      - www/content/filters.typ
      - www/content/config.typ
      - www/content/statuses.typ
      - www/content/rules.typ
      - www/content/hooks.typ
      - www/content/estimates.typ
      - www/content/named-sets.typ
      - www/content/commit-rules.typ
      - www/content/quickstart.typ
      - www/content/agents.typ
      - www/content/concepts.typ
      - www/content/derived-tags.typ
      - www/content/import-export.typ
      - www/content/priority.typ
      - www/content/schema.typ
      - www/content/templates.typ
      - www/utils/cli-notes.typ
      - docs/src/skill.typ
      # SKILL.md (generated from docs/src/skill.typ by `just docs::md`) keeps
      # `mt add` slot detail in this reference (progressive disclosure, per the
      # .linecop.yaml note). The content is still CLI surface, so the file stays
      # a tracked dependent.
      - skills/mindtape/references/add-slots.md
      # The skill's filter reference lists the field vocabulary by hand, as
      # filters.typ does.
      - skills/mindtape/references/filters.md
      - skills/mindtape/evals/README.md
      - skills/mindtape/evals/evals.json

  # The filter language's functions (`has`, `miss`, `contains`, `touches`,
  # `stale`, `changed`, `count`, `links`, `in_view`, ...) are matched by name
  # in the modules below. www/content/filters.typ and
  # skills/mindtape/references/filters.md list them by hand, and
  # www/generated/*.json carries nothing about what each one means, so a
  # function that is added, renamed or redefined has no fact file to flag the
  # two pages. Each module is listed rather than globbed, because a source
  # glob cannot exclude: `filter/**` would make every test edit and the
  # `[[ls.rules]]` condition language re-confirm these pages. The field
  # vocabulary the same pages list is tracked by cli-docs.
  - name: filter-docs
    source:
      - crates/mindtape/src/filter/mod.rs
      - crates/mindtape/src/filter/aggregate.rs
      - crates/mindtape/src/filter/compare.rs
      - crates/mindtape/src/filter/eval.rs
      - crates/mindtape/src/filter/links.rs
      - crates/mindtape/src/filter/predicates.rs
      - crates/mindtape/src/filter/strings.rs
      - crates/mindtape/src/filter/views.rs
    dependents:
      - www/content/filters.typ
      - skills/mindtape/references/filters.md

  # What `ready` and `blocked` mean once a `waits-on` checker can block a task.
  - name: waits-docs
    source:
      - crates/mindtape/src/waits.rs
      - crates/mindtape/src/graph/ready.rs
    dependents:
      - www/content/wait-on-upstream.typ
      - www/content/filters.typ
      - skills/mindtape/references/filters.md
      - docs/src/skill.typ

  # A package change (version, dependencies, metadata) should land in the changelog.
  - name: release-notes
    source:
      - Cargo.toml
    dependents:
      - CHANGELOG.md

  # The Typst task DSL is mirrored in the docs and the CLI's embedded copy.
  # concepts.typ, priority.typ, and templates.typ each carry their own
  # `task.with(...)`/`ice(...)`/`slot(...)` snippet taken from this file's
  # signatures. They are also in cli-docs, for their CLI and config facts (dual
  # membership, as with SKILL.md below). dsl.typ stays the detailed reference
  # the others defer to.
  #
  # index.typ's "Why Typst" list restates what the `task` signature checks.
  #
  # AGENTS.md and skills/mindtape/SKILL.md are generated (typlite;
  # `just docs::md`), so the sources are the dependents to reconcile. Their DSL
  # snippets and field-shape prose are hand-restated, not derived.
  # `www/generated/dsl-fields.json` carries the field names, but this group is
  # about the full task DSL shape (field types, framework packagers, the
  # validation-layer split), which no fact file captures.
  - name: prelude-docs
    source:
      - lib/prelude.typ
    dependents:
      - docs/src/agents.typ
      - www/content/index.typ
      - www/content/dsl.typ
      - www/content/links.typ
      - www/content/recurring.typ
      - www/content/concepts.typ
      - www/content/priority.typ
      - www/content/templates.typ
      - docs/src/skill.typ
      # Dual membership, for SKILL.md's reason: the slot detail it keeps here
      # also restates DSL shape (a framework priority's leaves are its slots).
      - skills/mindtape/references/add-slots.md

  # The built-in priority frameworks. /priority/ restates none of them: the
  # names, inputs, bounds, formulas, categories and both scales are derived into
  # www/generated/frameworks.json, so this group does not list that page. It
  # lists the one thing derivation cannot carry: www/utils/framework-notes.typ
  # says what each formula means, and re-formulating `ice` or re-purposing an
  # input leaves that prose compiling and wrong. Two failure modes a hash cannot
  # see are already covered without it: a framework that leaves frameworks.toml
  # fails the page render by name, and one that arrives fails `just
  # check-doc-facts` until it has an entry. So a one-dependent group is the
  # whole wiring.
  - name: priority-frameworks
    source:
      - crates/mindtape/src/framework/frameworks.toml
    dependents:
      - www/utils/framework-notes.typ

  # The Typst library version appears in every #import example and the CLI's
  # embedded constant. Bump lib/typst.toml and these must follow.
  #
  # docs/src/agents.typ (AGENTS.md's source), docs/src/readme.typ (README.md's
  # source), docs/src/skill.typ (SKILL.md's source) and www/utils/site.typ (the
  # docs site's `PKG_VERSION`, and through it every `#import` example on the
  # site) are not dependents: each reads its `@local/mindtape:...` version from
  # `www/generated/crate-map.json`'s `typst-lib.version` (itself derived from
  # this same lib/typst.toml), so a bump propagates through `just docs::md`
  # with no human reconciliation. A derived fact needs no drift gate.
  # docs/src/contributing.typ (CONTRIBUTING.md's source) never hand-types this
  # version and only names the group by reference, so it is not a dependent
  # either.
  - name: typst-pkg-version
    source:
      - lib/typst.toml
    dependents:
      - crates/mindtape-cli/src/cmd/init/mod.rs
      - crates/mindtape-cli/src/cmd/init/presets/gated/templates/task.typ
      - examples/minimal/tasks/fix-login-bug.typ
      - examples/minimal/tasks/add-dark-mode.typ
      - examples/minimal/tasks/refactor-auth.typ
      - examples/minimal/tasks/setup-ci.typ
      - examples/minimal/tasks/write-docs.typ
      - examples/self-validating/tasks/ship-onboarding-checklist.typ
      - examples/self-validating/tasks/export-report-as-csv.typ
      - examples/links/tasks/pick-a-provider.typ
      - examples/links/tasks/auth-epic.typ
      - examples/links/tasks/write-docs.typ
      - examples/links/tasks/wire-oauth.typ
      - examples/links/tasks/legacy-cli.typ
      - examples/links/tasks/drop-legacy-cli.typ
      - examples/links/tasks/search-too-slow.typ
      - examples/links/tasks/speed-up-search.typ
      - examples/recurring/tasks/nightly-dependency-audit.typ
      - examples/recurring/tasks/weekly-backlog-grooming.typ
      - examples/recurring/tasks/quarterly-access-audit.typ
      - examples/recurring/tasks/annual-certificate-rotation.typ
      - examples/recurring/tasks/monthly-cost-report.typ
      - examples/recurring/tasks/standup-notes-2026-09-14.typ
      - examples/recurring/tasks/standup-notes-2026-09-15.typ
      - examples/estimates/tasks/rewrite-loader.typ
      - examples/estimates/tasks/rename-the-status-glyphs.typ
      - examples/dsl/tasks/add-a-session-store.typ
      - examples/dsl/tasks/fix-the-login-redirect.typ
      - examples/task-files/tasks/fix-the-login-redirect.typ
      - examples/task-files/tasks/add-a-session-store.typ
      - examples/task-files/tasks/log-failed-logins.typ
      - examples/task-files/invalid/missing-comma.typ
      - examples/task-files/invalid/dictionary-in-braces.typ
      - examples/task-files/invalid/one-tag-without-a-comma.typ
      - examples/task-files/invalid/note-as-a-string.typ
      - examples/task-files/invalid/links-joined-with-a-comma.typ
      - examples/task-files/invalid/hash-in-the-body.typ
      - examples/statuses/tasks/add-a-dry-run-flag.typ
      - examples/statuses/tasks/import-xlsx-files.typ
      - examples/statuses/tasks/map-csv-columns.typ
      - examples/statuses/tasks/parse-csv-rows.typ
      - examples/statuses/tasks/ship-the-csv-importer.typ
      - examples/statuses/tasks/stream-large-files.typ
      - examples/statuses/tasks/vendor-the-csv-parser.typ
      - examples/rules/tasks/add-csv-export.typ
      - examples/rules/tasks/drop-the-v1-api.typ
      - examples/rules/tasks/fix-the-session-timeout.typ
      - examples/named-sets/tasks/rotate-the-signing-keys.typ
      - examples/named-sets/tasks/retry-failed-invoice-payments.typ
      - examples/named-sets/tasks/fix-the-refund-rounding.typ
      - examples/priority/tasks/add-rate-limits-to-the-public-api.typ
      - examples/priority/tasks/rename-the-billing-tables.typ
      - examples/priority/tasks/fix-the-signup-email-typo.typ

  # The binary / invocation name is documented and emitted by these sources.
  # Any rename (or new subcommand example) must land in every dependent. The
  # dependents include docs/src/agents.typ, docs/src/readme.typ,
  # docs/src/contributing.typ and docs/src/skill.typ, and omit the generated
  # AGENTS.md, README.md, CONTRIBUTING.md and SKILL.md. Their bare `mt`,
  # `mt ls` and `mt check` mentions are hand-typed in the sources and not
  # derived: nothing in www/generated/*.json carries the CLI binary's
  # invocation name.
  - name: cli-name
    source:
      - crates/mindtape-cli/Cargo.toml
      - crates/mindtape-cli/src/cli/mod.rs
    dependents:
      - docs/src/readme.typ
      - www/content/index.typ
      - www/content/quickstart.typ
      - www/content/cli.typ
      - docs/src/contributing.typ
      # The Command Semantics page hand-types `mt _cli`, `mt done` and
      # `mt flip done` mentions, so a binary or invocation rename must reach it.
      - docs/src/contributing/command-semantics.typ
      - docs/src/agents.typ
      - CHANGELOG.md
      - docs/src/skill.typ

  # Dev tooling and the contributor docs that describe it. A source is a file
  # whose behaviour a dependent restates by hand. No file in www/generated/
  # carries those facts, so editing a source means reviewing every dependent.
  #
  # The dependents are docs/src sources, never their rendered Markdown,
  # because a fix is made in the source. No doc lists the gates, so adding or
  # removing one needs no review here. Every deep dive describes recipes and
  # scripts by hand.
  #
  # The scripts under .just/scripts/ are listed one by one, each in the group of
  # the doc that restates it, so a script fix asks for that doc and no other. A
  # script no doc restates sits in the source-only group at the end. Tracking a
  # new script is a decision: `just script-scope-check` fails on a script that
  # is a source of no group.
  - name: dev-shell-docs
    source:
      - flake.nix
      - Justfile
      - .config/nextest.toml
      - .config/wt.toml
      - .just/docs.just
      - .just/scripts/wt-carry-lcov.sh
    dependents:
      - docs/src/contributing.typ
      - docs/src/agents.typ
      - docs/src/contributing/gates.typ
      - docs/src/contributing/example-projects.typ
      - docs/src/contributing/windows.typ
      - docs/src/contributing/coverage-crap.typ
      - docs/src/contributing/crap-baseline.typ
      - docs/src/contributing/mutation-testing.typ
      - docs/src/contributing/signal-sweep.typ
      - docs/src/contributing/docs-site-build.typ
      - docs/src/contributing/documentation.typ

  # The script that writes the site's Markdown copies and llms.txt, which
  # docs-site-build.typ describes and the agents page and the skill point
  # readers at.
  - name: site-markdown-docs
    source:
      - www/generate-md.sh
    dependents:
      - docs/src/contributing/docs-site-build.typ
      - www/content/agents.typ
      - docs/src/skill.typ

  # The coverage and CRAP scripts, which coverage-crap.typ and crap-baseline.typ
  # describe step by step.
  - name: crap-scripts-docs
    source:
      - .just/scripts/cover.sh
      - .just/scripts/crap.sh
      - .just/scripts/_crap-ratchet-lib.sh
      - .just/scripts/_crap-ratchet-control.sh
      - .just/scripts/crap-baseline.sh
      - .just/scripts/crap-baseline-check.sh
      - .just/scripts/_lcov-stale-reason.sh
    dependents:
      - docs/src/contributing/coverage-crap.typ
      - docs/src/contributing/crap-baseline.typ

  # The mutation scripts, which mutation-testing.typ describes and
  # signal-sweep.typ and contributing.typ refer to.
  - name: mutation-scripts-docs
    source:
      - .just/scripts/mutants.sh
      - .just/scripts/mutants-diff.sh
      - .just/scripts/_mutants-env.sh
    dependents:
      - docs/src/contributing/mutation-testing.typ
      - docs/src/contributing/signal-sweep.typ
      - docs/src/contributing.typ

  # The release recipe, which contributing.typ describes.
  - name: release-docs
    source:
      - .just/scripts/release-hook.sh
      - release.toml
    dependents:
      - docs/src/contributing.typ

  # The outdatty.lock merge driver and the attribute that assigns it, which
  # contributing.typ names under Dependency Drift.
  - name: lock-merge-docs
    source:
      - .just/scripts/outdatty-lock-merge.sh
      - .gitattributes
    dependents:
      - docs/src/contributing.typ

  # The doc gates, whose rules documentation.typ states, and the render check
  # generated-docs.typ describes.
  - name: doc-gate-scripts-docs
    source:
      - .just/scripts/check-doc-coverage.sh
      - .just/scripts/check-doc-facts.sh
      - .just/scripts/check-doc-recipes.sh
      - .just/scripts/check-doc-prose.sh
      - .just/scripts/check-doc-prose.awk
      - .just/scripts/check-doc-blocks.sh
      - .just/scripts/_doc-blocks-lib.sh
      - .just/scripts/check-doc-spans.sh
      - .just/scripts/check-doc-spans.jq
      - .just/scripts/docs-md-check.sh
    dependents:
      - docs/src/contributing/documentation.typ
      - docs/src/contributing/generated-docs.typ

  # The gates that police the other gates, and the secret scan. gates.typ
  # explains how each runs.
  - name: gate-scripts-docs
    source:
      - .just/scripts/check.sh
      - .just/scripts/mmz-arm.sh
      - .just/scripts/check-secrets.sh
      - .just/scripts/check-secrets-manifest.sh
      - .just/scripts/check-gate-drift.sh
      - .just/scripts/_gate-drift-lib.sh
      - .just/scripts/script-scope-check.sh
      - .just/scripts/_script-graph.sh
      - .just/scripts/_script-graph-lib.sh
      - .just/scripts/_script-reach.sh
      - .just/scripts/fmt-fixture-check.sh
      - .just/scripts/arg-pattern-check.sh
      - .just/scripts/positional-args-check.sh
      - .just/scripts/script-attr-check.sh
      - .just/scripts/path-attr-check.sh
      - .just/scripts/size-fixture-check.sh
      - .just/scripts/site-pages-fixture-check.sh
    dependents:
      - docs/src/contributing/gates.typ

  # The git hooks: gates.typ says what pre-commit asserts, commit-messages.typ
  # what commit-msg checks.
  - name: githooks-docs
    source:
      - .githooks/pre-commit
      - .githooks/commit-msg
      - .githooks/local-paths
    dependents:
      - docs/src/contributing/gates.typ
      - docs/src/contributing/commit-messages.typ

  # The scripts no doc restates: editing one flags nothing. Each entry says why.
  - name: scripts-no-doc
    source:
      # A machine install is read off `just --list` and run, and no doc
      # describes what it puts on a machine.
      - .just/scripts/install.sh
      - .just/scripts/install-bin.sh
      - .just/scripts/install-lib.sh
      - .just/scripts/uninstall-lib.sh
      # A sourced preamble with no behavior of its own.
      - .just/scripts/_typst-package.sh
      # A set difference over two route lists, which no doc restates.
      - .just/scripts/_nav-diff.sh
      # The controls hold fixtures that no doc names. The readers they drive are
      # sources of the groups above.
      - .just/scripts/_script-graph-control.sh
      - .just/scripts/_gate-drift-control.sh
      - .just/scripts/_doc-blocks-control.sh

  # The four `just ask-refactoring` templates share one shape: the same
  # task.with header, the same "filed from a signal, nothing recorded that it
  # did" paragraph, and the same remedy-is-your-call Scope. A Typst `#import`
  # would share it, but the import survives into every task the sweep writes
  # and binds a tracked artifact to a path outside the tasks root, so a task
  # file stops being self-contained. This group shares the shape as a drift gate
  # instead.
  #
  # sweep-size.typ is the source because it is the arm that exists and is
  # exercised, and the other three are its dependents. The arm scripts under
  # contrib/ask-refactoring/ are dependents too. Each fills its template's slots
  # by name, so a renamed or retyped slot breaks the sweep silently. They are
  # tracked per arm and not through the entry script, because
  # contrib/ask-refactoring.sh holds the driver and fills no slot, so tracking
  # it would watch a file that cannot break this way while missing the four that
  # can.
  #
  # One shape difference is intended and is not drift: sweep-size.typ carries
  # the first two Scope bullets in a `remedy` slot, and the siblings write theirs
  # literally. linecop caps several languages, so what a remedy is differs per
  # finding there: carve a Rust module, rewrite prose. cargo-mutants
  # and llvm-cov only ever report Rust, so a slot in those templates would have
  # exactly one filler and would hide the prose from the reader for nothing.
  - name: sweep-templates
    source:
      - .mindtape/templates/sweep-size.typ
    dependents:
      - .mindtape/templates/sweep-mutants.typ
      - .mindtape/templates/sweep-coverage.typ
      - .mindtape/templates/sweep-undertested.typ
      - contrib/ask-refactoring/size.sh
      - contrib/ask-refactoring/coverage.sh
      - contrib/ask-refactoring/mutants.sh
      - contrib/ask-refactoring/undertested.sh

  # The per-kind task templates copy task.typ and add one section each (fix,
  # feat, docs, dev), so a change to the common sections lands in all five.
  - name: task-templates
    source:
      - .mindtape/templates/task.typ
    dependents:
      - .mindtape/templates/fix.typ
      - .mindtape/templates/feat.typ
      - .mindtape/templates/docs.typ
      - .mindtape/templates/dev.typ

  # The one arm-to-arm dependency, and the only silent one in the sweep. The
  # undertested arm defers to the coverage arm (it skips a function whose file
  # the file-shaped arm reports), and to keep that sound it calls three of
  # coverage.sh's definitions instead of copying them: `ensure_lcov_fresh`,
  # `coverage_arm_files`, and the COVERAGE_TEST_RE / COVERAGE_STUB pair. The
  # sweep-templates group above watches slot names and sees none of that.
  # Renaming `coverage_arm_files`, or changing which column of `score_coverage`'s
  # TSV holds the path, would leave the dedup filing duplicates with no error
  # anywhere. So coverage.sh is a source here, in the direction the deferral
  # runs.
  - name: sweep-dedup
    source:
      - contrib/ask-refactoring/coverage.sh
    dependents:
      - contrib/ask-refactoring/undertested.sh

  # Each page in the docs site's Recipes group explains, in prose, one block
  # of examples/api-service's config, the session generate-api-service.sh
  # records for it, and the mindtape-tasks rules that block adopts. The config
  # and the session render from generated facts, so only that prose can drift.
  # The skill's evals state the fixture's task counts and ready order by hand,
  # so any file under the fixture is a source; crates/mindtape-cli/tests/it/
  # eval_fixture_e2e.rs fails on the counts, and this group flags the prose.
  - name: api-service-recipes
    source:
      - examples/api-service/**
      - www/generate-api-service.sh
      - crates/mindtape/src/packs/mindtape-tasks.toml
    dependents:
      - www/content/split-oversized-tasks.typ
      - www/content/require-a-task-shape.typ
      - www/content/tie-work-to-goals.typ
      - www/content/limit-work-in-progress.typ
      - www/content/wait-on-upstream.typ
      - www/content/trace-commits-to-tasks.typ
      - skills/mindtape/evals/evals.json
      - skills/mindtape/evals/README.md
