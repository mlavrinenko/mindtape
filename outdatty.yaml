# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/outdatty/main/schema/outdatty.schema.json

# Declares which dependents must be re-confirmed when a source changes. After
# editing a source, review the dependents and run `just outdatty-update <group>`
# to record the new state; `just outdatty-update-all` re-records every group,
# the deliberate choice, never the default. `just outdatty-check` (part of
# `just check`) fails until you do.

# outdatty 0.4 added an audit that every non-gitignored file belong to some
# group (`require_tracked`, default `["**"]`) and it does not fit this repo as
# it stands: 581 files are uncovered, 276 of them crate sources and 235 task
# artifacts, none of which a drift group should ever claim. A group means
# "review these dependents when this source changes", and answering a coverage
# audit by inventing groups would turn it into "this file is known", which is
# not a fact worth gating. Even the doc surfaces the audit would genuinely
# suit — the case it exists for is a new page no group tracks — have real
# exclusions inside them (generated `.md` outputs, CSS, the jq programs), so
# no narrow scope is free today either. Opted out explicitly rather than
# absorbed silently on a tool bump; scoped adoption is
# truth/tasks/evaluate-outdattys-require-tracked-audit.typ.
require_tracked: ["!**"]

# WHAT A DEPENDENT-ONLY EDIT OWES THIS LOCK: record that dependent alone, in the
# commit that made the edit — `just outdatty-update <group> <path>`
# (truth/tasks/decide-what-a-dependent-only-edit-owes-outdatty-lock.typ,
# truth/tasks/record-one-dependents-watermark-without-claiming-the-groups.typ).
# Only a SOURCE change is a trigger — that asymmetry is the
# whole point of the split and is not up for revision — so a dependent edited
# on its own moves no source hash and the gate stays green, correctly. But its
# recorded hash then sits stale until some unrelated source edit re-records the
# group and carries the doc's hash along, which is how `0c96610` (one attribute
# on the `mmz` recipe) came to record a `docs/src/contributing.typ` hash the
# commit never touched, five commits after `d1f9ede` actually edited that file.
# Read from the lock alone, the review landed on the wrong commit.
#
# Measured on outdatty 0.4.0 against a worktree with one hand-edited dependent,
# before choosing:
#
#   - `outdatty check` AND plain `outdatty status` both print `[ ok ]` for the
#     group and exit 0. Nothing surfaces it.
#   - `outdatty status --format json` already does: the group's
#     `changed_dependents` array names the file while its `status` stays `"ok"`.
#     The drift is computed and exposed today — only the plain renderer omits
#     it — so there is nothing to take upstream for visibility.
#   - `outdatty update --group <g>` after a dependent-only edit rewrites exactly
#     one line, that dependent's hash — but only while no OTHER dependent in the
#     group is pending. With one pending, the group re-record stamps it too, onto
#     a commit that never reviewed it: two delegated agents did exactly that to
#     `cli-docs`, `prelude-docs`, `dev-docs` and `docs/src/contributing.typ`.
#
# So the record is per file, not per group: outdatty 0.5's `--dependent <path>`
# (the recipe's optional trailing paths) records the named dependent's hash
# and leaves the group's sources and every other pending dependent as locked.
# It costs a command, and it makes the watermark CONTRIBUTING.md claims ("a
# recorded hash is a review watermark") true on both sides of the split
# instead of only the source side. A SOURCE edit still re-records the whole
# group — that edit obliges a review of every dependent.
#
# Deliberately NOT a gate, and never will be. A dependent changing alone is
# ordinary work, not drift; a check that failed on it would turn every doc edit
# red and would be reversing the source/dependent asymmetry above. It is a
# convention with a query, not an enforcement — pending re-records are listed by
#
#   outdatty status --format json | jq -r '.groups[] | select(.changed_dependents != []) | .id'
#
# and a forgotten one costs the same misattributed watermark it always did,
# never a broken build.

groups:
  # The CLI surface (commands, flags, behaviour) is documented by hand, in the
  # docs-site reference pages. README.md only carries a thin, illustrative
  # command teaser (tracked by the coarser cli-name group below), not this
  # group's depth — the reference material that made it a dependent here moved
  # to these pages (readme-to-www).
  #
  # `cli.rs` only wires the `Command` enum onto each module's `*Args` struct —
  # it names the types, it does not declare their fields. Every flag lives in
  # its own command module (`AddArgs` in `add.rs`, `LsArgs` in `ls.rs`, …), so a
  # flag added or changed there previously busted no group: `cli.rs` stayed
  # byte-identical and the docs went stale unnoticed (found when `--dedup` and
  # `--format` landed on `mt add` and nothing here reacted). The modules below
  # are listed explicitly rather than as a glob (e.g. `crates/mindtape-cli/src/*.rs`):
  # the command directory interleaves each command's `*Args` module with its own
  # helper/rendering/test siblings (`add_dedup.rs`, `add_interactive.rs`,
  # `ls_rules.rs`, `init_wizard.rs`, `*_tests*.rs`, …) under no naming convention
  # that separates the two (`add*.rs` alone matches five unrelated files), so a
  # directory-wide glob would fire this group on routine internal refactors that
  # touch no documented flag. An explicit list rots instead — a brand-new command
  # module needs a manual add here — but `just check-doc-coverage` already closes
  # that half of the gap (it fails naming any visible `mt` subcommand missing from
  # `www/utils/cli-notes.typ`), so this list only has to catch the other half:
  # a flag changing on a command already known to the docs. `cli_dump.rs`
  # (`mt _cli`) is deliberately not one of these sources: it is hidden tooling
  # that reflects `Cli::command()` back out for the docs generator, so it can
  # only remove drift, never introduce it — see its own module doc.
  #
  # hooks.typ, estimates.typ and named-sets.typ are dependents for exactly
  # config.typ's reason: each is a deep dive MOVED off that page
  # (truth/tasks/move-the-config-page-deep-dives-onto-pages-of-their-own.typ),
  # carrying the same hand-restated `[[on.flip]]`, `[tasks.estimate]` and
  # `[views]`/`[dicts]` surface it used to carry inline. A section moving to a
  # page of its own must not move out of the drift gate with it.
  - name: cli-docs
    source:
      - crates/mindtape-cli/src/cli.rs
      - crates/mindtape-cli/src/add.rs
      - crates/mindtape-cli/src/check.rs
      # Not an `*Args` module: it declares which ARGUMENT completes from which
      # project value. The dependents restate that set in prose (cli-notes.typ's
      # `install` entry names the sources a tab press offers), and nothing in
      # www/generated/*.json carries it as a fact a page could render instead —
      # `cli.json` reflects the per-argument entry, never the roster.
      - crates/mindtape-cli/src/completion.rs
      - crates/mindtape-cli/src/config_cmd.rs
      - crates/mindtape-cli/src/eval.rs
      - crates/mindtape-cli/src/find.rs
      - crates/mindtape-cli/src/flip.rs
      - crates/mindtape-cli/src/go.rs
      - crates/mindtape-cli/src/graph.rs
      - crates/mindtape-cli/src/import.rs
      - crates/mindtape-cli/src/init.rs
      - crates/mindtape-cli/src/install.rs
      # `mt link`'s flags live in `link_cmd.rs` (`LinkArgs`); its INPUT format —
      # the adjacency map the docs restate by hand on the DSL page and in
      # SKILL.md — lives in `link_input.rs`, so both are sources. The other two
      # halves are not: `link_edit.rs` and `link_plan.rs` decide what gets
      # written and what is refused, and no dependent restates either beyond
      # what those two files already declare.
      - crates/mindtape-cli/src/link_cmd.rs
      - crates/mindtape-cli/src/link_input.rs
      - crates/mindtape-cli/src/ls.rs
      - crates/mindtape-cli/src/mv.rs
      # `--format`'s per-surface contract: which columns each machine format
      # carries and what each cell means. `ls.rs` decides nothing about this —
      # it hands a resolved list to `render()` — so the CSV mapping decision
      # (`#` -> `id`, and `file` as the root-relative record path rather than
      # the table's cwd-relative display) lives here and nowhere else, while
      # cli.typ, schema.typ and docs/src/skill.typ each restate it by hand
      # (truth/tasks/csv-and-json-disagree-about-what-the-file-field-means.typ).
      - crates/mindtape-cli/src/output.rs
      - crates/mindtape-cli/src/preset_cmd.rs
      - crates/mindtape-cli/src/recur.rs
      - crates/mindtape-cli/src/review.rs
      - crates/mindtape-cli/src/rm.rs
      - crates/mindtape-cli/src/set.rs
      - crates/mindtape-cli/src/views.rs
      - crates/mindtape-cli/src/worktrees.rs
      - crates/mindtape/src/lib.rs
      # The filter/`--sort` field vocabulary. Every dependent that lists the
      # comparable fields (filters.typ, docs/src/skill.typ) hand-types them —
      # nothing in www/generated/*.json carries this registry — so renaming
      # `file` to `path` moved a documented surface while every source above
      # stayed byte-identical and the gate stayed green
      # (truth/tasks/the-file-filter-field-and-the-file-column-name-different-paths.typ).
      # `sort.rs` is deliberately NOT a second source: its accepted vocabulary
      # is derived from this registry (`is_sort_field`), so a field cannot
      # enter or leave one without the other, and the rest of that file is
      # comparator internals no dependent restates.
      - crates/mindtape/src/fields.rs
      - crates/mindtape/src/defaults.toml
      - crates/mindtape-cli/src/presets/todone/config.toml
      - crates/mindtape-cli/src/presets/flow/config.toml
      - crates/mindtape-cli/src/presets/personal/config.toml
      - crates/mindtape-cli/src/presets/gated/config.toml
    dependents:
      - www/content/cli.typ
      - www/content/links.typ
      - www/content/recurring.typ
      - www/content/filters.typ
      - www/content/config.typ
      - www/content/hooks.typ
      - www/content/estimates.typ
      - www/content/named-sets.typ
      - www/content/quickstart.typ
      - www/content/agents.typ
      - www/content/concepts.typ
      - www/content/derived-tags.typ
      - www/content/import-export.typ
      - www/content/priority.typ
      - www/content/schema.typ
      - www/content/templates.typ
      - www/utils/cli-notes.typ
      - docs/src/skill.typ
      # SKILL.md (generated from docs/src/skill.typ; just docs::md) sheds
      # `mt add` slot detail here (progressive disclosure, per the
      # .linecop.yaml note). The content is still CLI surface, so it has to
      # stay a tracked dependent — shedding it must not shed the drift gate.
      - skills/mindtape/references/add-slots.md
      - skills/mindtape/evals/README.md
      - skills/mindtape/evals/evals.json

  # A package change (version, dependencies, metadata) should land in the changelog.
  - name: release-notes
    source:
      - Cargo.toml
    dependents:
      - CHANGELOG.md

  # The Typst task DSL is mirrored in the docs and the CLI's embedded copy.
  # concepts.typ, priority.typ, and templates.typ each carry their own
  # `task.with(...)`/`ice(...)`/`slot(...)` snippet straight from this file's
  # signatures (the audit that added them to cli-docs for their CLI/config
  # facts found the same pages restate DSL shape too — dual membership, same
  # pattern as SKILL.md below); dsl.typ stays the detailed reference the
  # others defer to.
  # AGENTS.md, README.md, and skills/mindtape/SKILL.md are all generated
  # (typlite; `just docs::md` —
  # truth/tasks/generate-the-root-markdown-from-typst-with-typlite.typ), so the
  # sources, not the rendered files, are the dependents to reconcile. Their DSL
  # snippets and field-shape prose are still hand-restated here, not derived:
  # `www/generated/dsl-fields.json` carries the field NAMES, but this group is
  # about the FULL task DSL shape (field types, framework packagers, the
  # validation-layer split) that no fact file captures.
  - name: prelude-docs
    source:
      - lib/prelude.typ
    dependents:
      - docs/src/agents.typ
      - docs/src/readme.typ
      - www/content/dsl.typ
      - www/content/links.typ
      - www/content/recurring.typ
      - www/content/concepts.typ
      - www/content/priority.typ
      - www/content/templates.typ
      - docs/src/skill.typ
      # Dual membership, same reason as SKILL.md's: the shed slot detail also
      # restates DSL shape (a framework priority's leaves are its slots).
      - skills/mindtape/references/add-slots.md

  # The Typst library version appears in every #import example and the CLI's
  # embedded constant. Bump lib/typst.toml and these must follow.
  #
  # docs/src/agents.typ (AGENTS.md's source), docs/src/readme.typ (README.md's
  # source), docs/src/skill.typ (SKILL.md's source) and www/utils/site.typ (the
  # docs site's `PKG_VERSION`, and through it every `#import` example on the
  # site) are NOT dependents: each reads its `@local/mindtape:...` version from
  # The baked-in priority frameworks. /priority/ no longer restates any of
  # them — the names, inputs, bounds, formulas, categories and both scales are
  # derived into www/generated/frameworks.json
  # (truth/tasks/derive-the-built-in-priority-tables.typ) — so this group does
  # NOT list that page. It lists the one thing derivation cannot carry:
  # www/utils/framework-notes.typ says what each formula MEANS, and
  # re-formulating `ice` or re-purposing an input leaves that prose compiling
  # and wrong. The two failure modes a hash cannot see are already covered
  # without it — a framework that LEAVES frameworks.toml fails the page render
  # by name, and one that ARRIVES fails `just check-doc-facts` until it has an
  # entry — which is why a one-dependent group is the whole of the wiring here
  # rather than an oversight.
  - name: priority-frameworks
    source:
      - crates/mindtape/src/frameworks.toml
    dependents:
      - www/utils/framework-notes.typ

  # `www/generated/crate-map.json`'s `typst-lib.version` (itself derived from
  # this same lib/typst.toml), so a bump propagates through `just docs::md`
  # with no human reconciliation — the point of deriving it in the first
  # place. A derived fact needs no drift gate. docs/src/contributing.typ
  # (CONTRIBUTING.md's source) never hand-typed this version at all — it only
  # names the group by reference — so it was never a dependent either.
  - name: typst-pkg-version
    source:
      - lib/typst.toml
    dependents:
      - crates/mindtape-cli/src/init.rs
      - crates/mindtape-cli/src/presets/gated/templates/task.typ
      - examples/learn-piano/.mindtape/templates/task.typ
      - examples/learn-piano/tasks/technique/hanon-warmup-daily.typ
      - examples/learn-piano/tasks/technique/major-scales-two-octaves.typ
      - examples/learn-piano/tasks/technique/minor-scales-two-octaves.typ
      - examples/learn-piano/tasks/technique/arpeggios-all-inversions.typ
      - examples/learn-piano/tasks/technique/sight-reading-grade-3.typ
      - examples/learn-piano/tasks/repertoire/fur-elise-polish.typ
      - examples/learn-piano/tasks/repertoire/clair-de-lune-practice.typ
      - examples/learn-piano/tasks/repertoire/jazz-standard-autumn-leaves.typ
      - examples/learn-piano/tasks/repertoire/abandoned-rondo-alla-turca.typ
      - examples/learn-piano/tasks/theory/circle-of-fifths-drill.typ
      - examples/learn-piano/tasks/theory/interval-recognition-ear-training.typ
      - examples/learn-piano/tasks/theory/chord-progression-analysis.typ
      - examples/learn-piano/tasks/theory/sight-singing-solfege.typ
      - examples/minimal/tasks/fix-login-bug.typ
      - examples/minimal/tasks/add-dark-mode.typ
      - examples/minimal/tasks/refactor-auth.typ
      - examples/minimal/tasks/setup-ci.typ
      - examples/minimal/tasks/write-docs.typ
      - examples/self-validating/tasks/ship-onboarding-checklist.typ
      - examples/self-validating/tasks/export-report-as-csv.typ
      - examples/links/tasks/pick-a-provider.typ
      - examples/links/tasks/auth-epic.typ
      - examples/links/tasks/write-docs.typ
      - examples/links/tasks/wire-oauth.typ
      - examples/links/tasks/legacy-cli.typ
      - examples/links/tasks/drop-legacy-cli.typ
      - examples/links/tasks/search-too-slow.typ
      - examples/links/tasks/speed-up-search.typ
      - examples/recurring/tasks/nightly-dependency-audit.typ
      - examples/recurring/tasks/weekly-backlog-grooming.typ
      - examples/recurring/tasks/quarterly-access-audit.typ
      - examples/recurring/tasks/annual-certificate-rotation.typ
      - examples/recurring/tasks/monthly-cost-report.typ
      - examples/recurring/tasks/standup-notes-2026-09-14.typ
      - examples/recurring/tasks/standup-notes-2026-09-15.typ
      - examples/estimates/tasks/rewrite-loader.typ
      - examples/estimates/tasks/rename-the-status-glyphs.typ

  # The binary / invocation name is documented and emitted by these sources.
  # Any rename (or new subcommand example) must land in every dependent.
  # docs/src/agents.typ (not AGENTS.md), docs/src/readme.typ (not README.md),
  # docs/src/contributing.typ (not CONTRIBUTING.md), and docs/src/skill.typ
  # (not SKILL.md) — all four generated from their sources — because their
  # bare `mt`/`mt ls`/`mt check` mentions are hand-typed, not derived: nothing
  # in www/generated/*.json carries the CLI binary's invocation name.
  - name: cli-name
    source:
      - crates/mindtape-cli/Cargo.toml
      - crates/mindtape-cli/src/cli.rs
    dependents:
      - docs/src/readme.typ
      - www/content/index.typ
      - www/content/quickstart.typ
      - www/content/cli.typ
      - docs/src/contributing.typ
      - docs/src/agents.typ
      - CHANGELOG.md
      - docs/src/skill.typ

  # Dev tooling and contributor conventions track the files that define them.
  # docs/src/agents.typ (not AGENTS.md — generated from it). Likewise
  # docs/src/contributing.typ (not CONTRIBUTING.md): its Quality Gates table
  # now reads `gates.json` for the sub-gate list and row order, so a gate
  # added to or removed from `just check` no longer needs a dev-docs
  # reconcile — it fails `just docs::md` (missing Tool prose) or drops off the
  # table on its own instead. What still makes docs/src/contributing.typ a
  # dependent here is everything else it restates by hand: `just check-full`,
  # `just cover`/`just crap` and their thresholds, `just nix-build`, `just
  # release`, `just ask-refactoring`, `just outdatty-update`, and the
  # `MINDTAPE_GATE_SCOPE` commit path — none of those are `just check`
  # sub-gates, so none are in `gates.json`.
  #
  # The five contributor deep dives are dependents for the same reason
  # docs/src/contributing.typ is, and were missed when they were ports of
  # hand-written Markdown: each describes recipes defined in the Justfile and
  # tools pinned in flake.nix by hand (`just check-windows` and the mingw
  # cross shell, `just cover`/`just crap` and their thresholds, `just
  # mutants-diff`, `just ask-refactoring`, the `MINDTAPE_GATE_SCOPE` commit
  # path). None of that is derived — `gates.json` carries only the sub-gates
  # `just check` itself declares, and every recipe these five discuss is
  # deliberately NOT one of those — so a renamed or re-flagged recipe
  # silently rots them.
  #
  # .just/docs.just is a source alongside Justfile, not just Justfile alone:
  # the `docs` module (truth/tasks/split-the-justfile-into-modules.typ) moved
  # six recipe bodies out of Justfile into their own file, and a body edit
  # there is exactly the kind of change this group exists to catch — a recipe
  # body moving out of the Justfile into a module file must not escape the
  # drift gate. The scripts below are here for that same reason, one step
  # further out: each is a recipe body that used to sit inline in one of the
  # two justfiles above, and a body extracted into a script escapes the gate
  # exactly the way a body moved into a module file would. The first six are
  # the gate bodies (truth/tasks/extract-the-long-gate-recipe-bodies-into-
  # scripts.typ), plus arg-pattern-check.sh — added the same way, later, under
  # truth/tasks/validate-recipe-arguments-with-the-arg-attribute.typ, whose
  # bad/good values and the eject-default rationale are restated by hand in
  # www/utils/gate-notes.typ; the eight after the gate bodies are the
  # coverage, mutation, install and release bodies (truth/tasks/extract-the-
  # coverage-and-release-recipe-bodies-into-scripts.typ), and that second wave
  # is the one this group most needs —
  # docs/src/contributing/coverage-crap.typ and
  # docs/src/contributing/mutation-testing.typ restate those bodies' flags and
  # thresholds by hand, so a `--fail-under-lines`, `--threshold` or exclude
  # edit inside a script is exactly the drift they would otherwise rot on.
  # Listed one by one rather than as `.just/scripts/*.sh`, so a new script is
  # an explicit decision to track it — the directory is recipe bodies by
  # construction today, but a helper that no doc describes would fire this
  # group for nothing.
  #
  # The last two are the same decision applied one step further out again.
  # positional-args-check.sh is a self-test rather than an extracted body, and
  # is tracked for arg-pattern-check.sh's reason: gate-notes.typ restates by
  # hand what it asserts. _mutants-env.sh is the sharper case — it is not a
  # recipe body at all, it is the `CARGO_MUTANTS_JOBS`/`RUSTFLAGS` preamble
  # factored OUT of mutants.sh and mutants-diff.sh, both tracked above. Those
  # speed knobs are restated by hand in docs/src/contributing/mutation-
  # testing.typ, so leaving the extracted file untracked would mean an edit to
  # the jobs default stopped busting this group on the day it moved, while the
  # identical edit busted it the day before. A body escaping into a script and
  # a script's content escaping into a helper are the same escape.
  #
  # size-fixture-check.sh joins them for positional-args-check.sh's reason: it
  # is a self-test, not an extracted body, and www/utils/gate-notes.typ
  # restates by hand what it asserts — the replica tree, the `include_hidden`
  # arm, why it does not probe the real directory. Change what the script
  # proves and that prose is wrong with nothing else reacting.
  #
  # script-attr-check.sh is the third of those, and the most restated of the
  # three: gate-notes.typ hand-carries both its arms, the just-1.46 measurement
  # that `shebang` cannot discriminate a `[script]` recipe from a `#!` body,
  # and the argument for probing each justfile's setting instead of matching
  # its text. None of that is derived from anything.
  #
  # script-scope-check.sh is the fourth, and it is tracked for a reason none of
  # the other three has: it is the only script whose subject is
  # .mmz/config.yaml's own shape, and both docs/src/contributing/gates.typ and
  # www/utils/gate-notes.typ restate by hand what it asserts — the two arms,
  # why a wildcard can never satisfy the first, the nested-`just` case the
  # second does not derive, and the churn measurement that decided the split
  # (truth/tasks/split-gates-meta-into-per-script-scopes.typ). Change what it
  # proves and that prose is wrong with nothing else reacting.
  #
  # site-pages-fixture-check.sh is the fifth, and joins for size-fixture-
  # check.sh's reason: a self-test, not an extracted body, and
  # www/utils/gate-notes.typ restates by hand what it asserts — the replica
  # tree, why cases one and two drive it and case three drives
  # .just/scripts/_nav-diff.sh directly instead
  # (truth/tasks/pin-the-docs-manifest-gate-failures-with-a-selftest.typ).
  # _nav-diff.sh itself stays untracked here: gate-notes.typ names it but
  # never restates its own two-arm logic, so nothing here would go stale if
  # that logic changed shape.
  #
  # fork.sh is the sixth, and the first that is not a gate body of any kind
  # (truth/tasks/add-a-just-fork-recipe-that-stands-up-a-ready-worktree.typ).
  # It is tracked because docs/src/contributing.typ restates its behaviour by
  # hand — the default base, the sibling `../mindtape-<slug>` path, the dirty-
  # HEAD refusal and the report-without-refusing on a divergent base. Every one
  # of those is a decision inside the script rather than anything derived, so
  # changing the refusal into a warning, or moving where the worktree lands,
  # rots that paragraph with nothing else reacting.
  #
  # integrate.sh joins it for the same reason and the same paragraph: the pair
  # is described together in docs/src/contributing.typ
  # (truth/tasks/assert-a-branchs-gate-before-fast-forwarding-it.typ), so the
  # prose restating one restates the other. What it hand-carries there is what
  # the script decides and nothing derives — that the freshness assertion is
  # read from the branch's worktree rather than this checkout, that a stale arm
  # is named, that the gate is asserted and never re-run, and that there is no
  # waiver flag. Turn the refusal into a warning, or add the flag, and that
  # sentence is wrong with nothing else reacting.
  #
  # check-secrets.sh is the seventh, for size-fixture-check.sh's reason plus
  # one of its own (truth/tasks/scan-the-tree-for-secrets-with-gitleaks.typ).
  # www/utils/gate-notes.typ restates by hand what its control fixture proves
  # and what its third arm demands of .mmz/config.yaml, neither derived from
  # anything. The one of its own: `.gitleaks.toml` is NOT a source here, and
  # deliberately — the prose describes the arms, not the ruleset, so an
  # allowlist edit rots no dependent, while a change to what the fixture
  # asserts rots the paragraph describing it.
  - name: dev-docs
    source:
      - flake.nix
      - Justfile
      - .config/nextest.toml
      - .just/docs.just
      - .just/scripts/check-doc-coverage.sh
      - .just/scripts/check-doc-facts.sh
      - .just/scripts/check-doc-recipes.sh
      - .just/scripts/check-secrets.sh
      - .just/scripts/fmt-fixture-check.sh
      - .just/scripts/arg-pattern-check.sh
      - .just/scripts/check-crap.sh
      - .just/scripts/docs-md-check.sh
      - .just/scripts/cover.sh
      - .just/scripts/crap.sh
      - .just/scripts/crap-baseline.sh
      - .just/scripts/crap-baseline-check.sh
      - .just/scripts/_lcov-stale-reason.sh
      - .just/scripts/mutants.sh
      - .just/scripts/mutants-diff.sh
      - .just/scripts/install-lib.sh
      - .just/scripts/release.sh
      - .just/scripts/positional-args-check.sh
      - .just/scripts/_mutants-env.sh
      - .just/scripts/size-fixture-check.sh
      - .just/scripts/script-attr-check.sh
      - .just/scripts/script-scope-check.sh
      - .just/scripts/_script-graph.sh
      - .just/scripts/site-pages-fixture-check.sh
      - .just/scripts/fork.sh
      - .just/scripts/integrate.sh
    dependents:
      - docs/src/contributing.typ
      - docs/src/agents.typ
      - docs/src/contributing/gates.typ
      - docs/src/contributing/windows.typ
      - docs/src/contributing/coverage-crap.typ
      - docs/src/contributing/mutation-testing.typ
      - docs/src/contributing/signal-sweep.typ

  # The four `just ask-refactoring` templates share one shape: the same
  # task.with header, the same "filed from a signal, nothing recorded that it
  # did" paragraph, and the same remedy-is-your-call Scope. A Typst `#import`
  # would be the obvious way to share it and is the wrong one — the import
  # survives into every task the sweep writes and binds a tracked artifact to a
  # path outside the tasks root, so a task file stops being self-contained.
  # This group is the sharing mechanism instead: a drift gate, not an import.
  #
  # sweep-size.typ is the source because it is the arm that exists and is
  # exercised; the other three are its dependents. The arm scripts under
  # contrib/ask-refactoring/ are dependents too, and the sharper edge — each
  # fills its template's slots by name, so a renamed or retyped slot breaks the
  # sweep silently. They are tracked per arm rather than through the entry
  # script: since the split, contrib/ask-refactoring.sh holds the driver and
  # fills no slot at all, so tracking it would watch a file that cannot break
  # this way while missing the four that can.
  #
  # One shape difference is deliberate and is not drift: sweep-size.typ carries
  # the first two Scope bullets in a `remedy` slot, the siblings write theirs
  # literally. linecop caps two languages, so what a remedy IS differs per
  # finding there — carve a Rust module, shed a Markdown section. cargo-mutants
  # and llvm-cov only ever report Rust, so a slot in those templates would have
  # exactly one filler and would hide the prose from the reader for nothing.
  - name: sweep-templates
    source:
      - .mindtape/templates/sweep-size.typ
    dependents:
      - .mindtape/templates/sweep-mutants.typ
      - .mindtape/templates/sweep-coverage.typ
      - .mindtape/templates/sweep-undertested.typ
      - contrib/ask-refactoring/size.sh
      - contrib/ask-refactoring/coverage.sh
      - contrib/ask-refactoring/mutants.sh
      - contrib/ask-refactoring/undertested.sh

  # The per-kind task templates copy task.typ and add one section each (fix,
  # feat, docs, dev), so a change to the common sections lands in all five.
  - name: task-templates
    source:
      - .mindtape/templates/task.typ
    dependents:
      - .mindtape/templates/fix.typ
      - .mindtape/templates/feat.typ
      - .mindtape/templates/docs.typ
      - .mindtape/templates/dev.typ

  # The one arm-to-arm dependency, and the only silent one in the sweep. The
  # undertested arm defers to the coverage arm — it skips a function whose file
  # the file-shaped arm reports — and to keep that sound it calls three of
  # coverage.sh's definitions instead of copying them: `ensure_lcov_fresh`,
  # `coverage_arm_files`, and the COVERAGE_TEST_RE / COVERAGE_STUB pair. None of
  # that is visible to the sweep-templates group above, which watches slot names.
  # Renaming `coverage_arm_files`, or changing which column of `score_coverage`'s
  # TSV holds the path, would leave the dedup filing duplicates with no error
  # anywhere. So coverage.sh is a source here, in the direction the deferral runs.
  - name: sweep-dedup
    source:
      - contrib/ask-refactoring/coverage.sh
    dependents:
      - contrib/ask-refactoring/undertested.sh
