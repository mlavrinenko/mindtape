cognitive-complexity-threshold = 20
too-many-arguments-threshold = 5
too-many-lines-threshold = 70
single-char-binding-names-threshold = 2
warn-on-all-wildcard-imports = true
upper-case-acronyms-aggressive = true
lint-commented-code = false

# Torn writes: `fs::write` truncates then writes, and `File::create` truncates
# in place with no fsync — a process killed mid-write leaves an empty or
# half-written file behind. `mindtape::write_atomic` (temp file, fsync,
# rename) is the one sanctioned door; `File::create_new` stays open for a
# caller that needs "never overwrite" rather than atomicity (`mt add`).
disallowed-methods = [
  { path = "std::process::exit", reason = "return the error from main; its crate::diag::Kind picks the exit code" },
  { path = "std::fs::write", reason = "torn write on kill/crash; use mindtape::write_atomic" },
  { path = "std::fs::File::create", reason = "truncates with no fsync; use mindtape::write_atomic, or File::create_new to require a fresh path" },
]

# Every stderr line goes through `crates/mindtape-cli/src/diag/`: a typed
# `Diag`, one renderer, an exit code from the error's kind. These macros print
# or build free-text errors that skip it. `diag/` itself needs none of them.
disallowed-macros = [
  { path = "std::eprintln", reason = "build a crate::diag::Diag and emit it" },
  { path = "std::eprint", reason = "build a crate::diag::Diag and emit it" },
  { path = "anyhow::bail", reason = "return a crate::diag::Diag, whose kind picks the exit code" },
  { path = "anyhow::anyhow", reason = "return a crate::diag::Diag, whose kind picks the exit code" },
  { path = "anyhow::ensure", reason = "return a crate::diag::Diag, whose kind picks the exit code" },
]
