# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/linecop/refs/heads/main/linecop-schema.json
limits:
  Rust: 500
  Markdown: 200

  # Shell is capped so a script that outgrows one job gets split. The cap of 300
  # sits above every shell file in the repo.
  #
  # linecop detects language by extension, so the shebang-only `.githooks/`
  # hooks are invisible to it at any limit. They are about 25 lines each.
  # `.just/docs.just` has the same gap: linecop knows no language for the
  # `.just` extension, so the module file is uncapped while every script beside
  # it is capped (`include_hidden` below brings those scripts into the scan and
  # does nothing for an unrecognized extension).
  Shell: 300

  # A base is required for an override's `limit:` to do anything (verified): a
  # `docs/src/**` override with no `Typst` entry here scans zero .typ files,
  # because linecop skips a language entirely when it has no base. Without this
  # line the per-source overrides below would be inert. 1000 is a floor and not
  # a target, picked to clear the largest Typst file in the repo
  # (`lib/prelude.typ`) with headroom. Every cap that matters for a docs/src/*.typ
  # source lives in that source's own override below, at a fraction of this
  # number. Raising this number to fit one file would loosen every other Typst
  # file's ceiling at once.
  Typst: 1000

# The changelog is append-only (all under [Unreleased] pre-1.0) and gets
# archived on release, so a hard cap only fights normal growth.
overrides:
  - pattern: "**/CHANGELOG.md"
    exclude: true

  # README.md, AGENTS.md, CONTRIBUTING.md and skills/mindtape/SKILL.md are
  # rendered from docs/src/*.typ by `just docs::md`, so their caps sit on the
  # sources below, where a fix is made. typlite writes one line per
  # paragraph, so a rendered file's line count measures its paragraphs, list
  # items and table rows.
  #
  # AGENTS.md, CONTRIBUTING.md and SKILL.md are capped as well, because every
  # agent session in this repo loads them whole. The line cap limits how many
  # rules a file holds, and `max_bytes` limits how long they run, because a
  # long paragraph counts as one line. Both leave about 10% room. When one fires, move reasons
  # into a docs/contributing/*.md deep dive rather than raise the number.
  #
  # A pattern is a `.gitignore` line read from this file's directory. A bare
  # `README.md` matches that name at any depth, and `./README.md` or
  # `/README.md` anchors to the root. Each rendered file's pattern is anchored
  # with `./`, because skills/mindtape/evals/README.md is written by hand and
  # keeps the Markdown cap.
  #
  # `linecop --baseline 85` lists the files near their cap. Run it before you
  # add to an existing file.
  - pattern: "./README.md"
    exclude: true
  - pattern: "./AGENTS.md"
    limit: 78
    max_bytes: 5600
  - pattern: "./CONTRIBUTING.md"
    limit: 142
    max_bytes: 11300
  - pattern: "./skills/mindtape/SKILL.md"
    limit: 76
    max_bytes: 6600

  # The sources of the four rendered files. agents.typ (151 lines) and
  # skill.typ (131) are capped at their size after a whole rewrite plus about
  # 10%. An agent loads each whole, so one that outgrows its cap gets rewritten
  # again, not a higher cap. readme.typ and contributing.typ keep the Markdown
  # cap plus room for the Typst that reads generated facts. docs/generate-md.sh
  # takes each source's output path from its `<mindtape-md>` block, and each
  # source is named after the file it renders.
  - pattern: "**/docs/src/agents.typ"
    limit: 166
  - pattern: "**/docs/src/readme.typ"
    limit: 250
  - pattern: "**/docs/src/contributing.typ"
    limit: 260
  - pattern: "**/docs/src/skill.typ"
    limit: 144
  # One cap for every deep-dive source. No deep dive is loaded into every
  # session, so one ceiling serves them all.
  - pattern: "**/docs/src/contributing/**"
    limit: 220
  # The deep dives under docs/contributing/ are rendered from those sources,
  # so the cap above covers them. A directory glob covers a new deep dive as
  # soon as it is rendered.
  - pattern: "./docs/contributing/*.md"
    exclude: true

count_mode: total

exclude_dirs:
  - target
  - archive
  - var

# The walker skips dot-prefixed directories by default, which would leave every
# recipe body in `.just/scripts/` uncapped. Setting `include_hidden` here and
# not passing `--hidden` in the recipe keeps `check-file-size` a single
# `linecop` invocation, so the gate table's Command column renders the real
# command. It also keeps the scan scope a property of the repo: `linecop`,
# `linecop --baseline 85` and `just eject`'s `--format paths` run all see the
# same file set, which they would not if only the gate carried the flag.
#
# It pulls in `.just/scripts/*.sh`, `.mindtape/templates/*.typ` and the
# example fixtures' copies of those templates, all far under the Typst floor.
# VCS metadata stays excluded by linecop itself and gitignored paths are still
# skipped, so `.direnv/` and `.mmz/cache/` never enter the walk.
include_hidden: true
