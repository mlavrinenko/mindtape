# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/linecop/refs/heads/main/linecop-schema.json
limits:
  Rust: 500
  Markdown: 200

  # Shell was uncapped until `contrib/ask-refactoring.sh` reached 750 lines —
  # the script that files tasks about oversized files was the largest source
  # file in the repo and structurally unable to see itself, because these
  # limits named Rust and Markdown only.
  #
  # Why 300: it has to bite on 750 without firing on the split that fixes it.
  # The seam is one file per sweep arm, and the arms land at 222/217/192 with a
  # 154-line entry script; `www/generate.sh`, the only other capped shell file,
  # is 223. At 300 the largest of those sits at 74% — outside the band
  # `linecop --baseline 85` reports, so the cap does not hand the next sweep a
  # finding about the files it just created. At 250 both the largest arm and
  # `www/generate.sh` would be reported on day one, which is a cap arriving as
  # a surprise rather than as a decision.
  #
  # What it does NOT cover: linecop detects language by extension, so the
  # shebang-only `.githooks/` hooks are invisible to it at any limit. They are
  # ~25 lines each and the cap was never the thing keeping them short. Same
  # blind spot, same reason: `.just/docs.just` — a `.just` extension is no
  # language linecop knows, so the module file is uncapped while every script
  # beside it is capped (`include_hidden` below is what brought those scripts
  # into the scan; it does nothing for an unrecognized extension).
  Shell: 300

  # A base is REQUIRED for an override's `limit:` to do anything: verified
  # empirically — a `docs/src/**` override with no `Typst` entry here scans
  # zero .typ files (linecop skips a language entirely when it has no base),
  # so the per-source overrides below would be silently inert without this
  # line. 1000 is not a target, it is a floor picked to clear the largest
  # Typst file in the repo today (`www/content/config.typ`, 747 lines) with
  # headroom — every real cap that matters for a docs/src/*.typ source lives
  # in that source's own override below, at a fraction of this number. A
  # second file crossing 1000 uncapped-by-design (`lib/prelude.typ`, `www/
  # content/*.typ`) is not this task's problem to solve; raising THIS number
  # to accommodate one would silently loosen every other Typst file's ceiling
  # at once.
  Typst: 1000

# The changelog is append-only (all under [Unreleased] pre-1.0) and gets
# archived on release, so a hard cap only fights normal growth.
overrides:
  - pattern: "**/CHANGELOG.md"
    exclude: true

  # These four are the always-loaded surface: README is the first thing a
  # reader sees, and AGENTS.md/CONTRIBUTING.md/SKILL.md are pulled into an
  # agent's context on every session. A line here costs more than a line
  # anywhere else — which is exactly why none of the four is capped directly
  # any more.
  #
  # All four are now GENERATED: `docs/src/{agents,readme,contributing,skill}.typ`
  # render to them (typlite; `just docs::md`). A numeric cap on a rendered file
  # is unactionable — you cannot shorten AGENTS.md directly, only its source,
  # and a generated file cannot be "fixed" by editing it (the next `just
  # docs::md` run overwrites any such edit) — so the cap lives on the source
  # instead, in the docs/src/** overrides below.
  #
  # This is progressive disclosure continuing, not stopping. The first drop
  # (truth/tasks/trim-root-docs-by-delegating-deep-content.typ) moved DEEP
  # CONTENT out to www/content/ and docs/contributing/. The second
  # (truth/tasks/generate-the-root-markdown-from-typst-with-typlite.typ, this
  # one) moved DERIVED FACTS out to `www/generated/*.json` — the crate map and
  # DSL fields first (agents.typ, readme.typ), then the Quality Gates table
  # and the linecop caps themselves (contributing.typ, skill.typ) — read back
  # by the .typ source instead of hand-listed, the same "don't restate it,
  # point at it" move, one layer down. If one of the four hits its docs/src/**
  # cap again, the answer is still progressive disclosure — move the deep
  # content out and link it — never a bigger number.
  #
  # `linecop --baseline 85` names anything at 85% of its cap; run it before
  # adding to an existing file, so compaction is deliberate rather than a wall.
  # PATTERN ANCHORING, verified empirically because excluding the wrong file is
  # silent: linecop matches against the `./`-prefixed path it reports, so
  # `**/README.md` matches EVERY README at any depth and a bare `README.md`
  # matches none. `./README.md` matches the root one alone. That distinction is
  # load-bearing here — `skills/mindtape/evals/README.md` is hand-written and
  # must keep the 200 Markdown default, so the exclusion below is anchored.
  # Use `./` (the full repo-root-relative path, not a bare filename) for a
  # generated file's exclusion; a `**/` exclusion would silently uncap its
  # hand-written namesakes.
  - pattern: "./README.md"
    exclude: true
  - pattern: "./AGENTS.md"
    exclude: true
  - pattern: "./CONTRIBUTING.md"
    exclude: true
  - pattern: "./skills/mindtape/SKILL.md"
    exclude: true

  # docs/src/**: the .typ SOURCES the four caps above used to apply to
  # directly. A generated .md's line count is not a meaningful size proxy
  # either way — typlite emits one line per paragraph, never hard-wrapping, so
  # it reads short regardless of how much the source says — which is the other
  # half of why the cap belongs here and not on the output.
  #
  # agents.typ (151 lines) and skill.typ (131) are capped at their size after
  # a whole rewrite plus about 10%. An agent loads each whole, so one that
  # outgrows its cap gets rewritten again, not a higher cap. readme.typ
  # and contributing.typ keep the caps they were ported with: the old Markdown
  # cap plus the lines the port added.
  #
  # Source filenames are a naming CONVENTION this task fixes, not a schema the
  # generator enforces (docs/generate-md.sh reads each source's own
  # `<mindtape-md>` block for its output path — the filename is free): the
  # lowercased stem of the file it produces, so a future port has an
  # unambiguous place to land without touching this file.
  - pattern: "**/docs/src/agents.typ"
    limit: 166
  - pattern: "**/docs/src/readme.typ"
    limit: 250
  - pattern: "**/docs/src/contributing.typ"
    limit: 260
  - pattern: "**/docs/src/skill.typ"
    limit: 144
  # One shared cap for every docs/contributing/*.typ deep-dive source (today:
  # generated-docs.typ at 135, the pipeline this task adds), rather than a
  # per-file entry — these deep dives vary 31-59 lines in their current
  # hand-written form and none is on the always-loaded path, so one ceiling
  # with headroom serves all of them without per-file tuning.
  - pattern: "**/docs/src/contributing/**"
    limit: 220
  # Every docs/contributing/*.md deep dive is now generated from a
  # docs/src/contributing/*.typ source, so the whole directory is excluded for
  # the same reason AGENTS.md is: a generated file's cap belongs on its source
  # (above), not on output typlite rewrites on every `just docs::md`. Anchored
  # with `./` per the note above, and a directory glob rather than six entries
  # so the next deep dive is covered by existing the moment it is generated —
  # the failure mode of a per-file list is a new generated file silently
  # inheriting a cap nobody can act on.
  - pattern: "./docs/contributing/*.md"
    exclude: true

count_mode: total

exclude_dirs:
  - target
  - archive
  - var

# The walker skips dot-prefixed directories by default, which silently uncapped
# every recipe body the Justfile extraction moved into `.just/scripts/` — the
# extraction's whole stated reason was that `Justfile` has no extension and a
# `.sh` file lands under the `Shell: 300` cap on arrival, and the bodies landed
# in a second blind spot instead (truth/tasks/restore-size-gate-coverage-over-
# the-dot-just-scripts.typ). Turning it on here rather than passing `--hidden`
# in the recipe keeps `check-file-size` a single `linecop` invocation, so the
# gate table's Command column keeps rendering the real command, and keeps the
# scan scope a property of the repo — `linecop`, `linecop --baseline 85` and
# `just eject`'s `--format paths` run all see the same file set, which they
# would not if only the gate carried the flag.
#
# What it pulls in beyond `.just/scripts/*.sh`: `.mindtape/templates/*.typ` and
# the learn-piano fixture's copy, all far under the Typst floor. Nothing here
# is at 85% of its cap, so this is coverage arriving quiet — no finding handed
# to the next `just ask-refactoring`. VCS metadata stays excluded by linecop
# itself and gitignored paths are still skipped, so `.direnv/` and `.mmz/cache/`
# never enter the walk.
include_hidden: true
