limits:
  Rust: 500
  Markdown: 200

# README is the one user-facing doc that grows a line per command; give it
# headroom while agent-facing Markdown stays under the 200 hygiene ceiling.
overrides:
  - pattern: "README.md"
    limit: 250

count_mode: total

exclude_dirs:
  - target
  - archive
  - docs
  - var
