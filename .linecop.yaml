# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/linecop/refs/heads/main/linecop-schema.json
limits:
  Rust: 500
  Markdown: 200

  # Shell was uncapped until `contrib/ask-refactoring.sh` reached 750 lines —
  # the script that files tasks about oversized files was the largest source
  # file in the repo and structurally unable to see itself, because these
  # limits named Rust and Markdown only.
  #
  # Why 300: it has to bite on 750 without firing on the split that fixes it.
  # The seam is one file per sweep arm, and the arms land at 222/217/192 with a
  # 154-line entry script; `www/generate.sh`, the only other capped shell file,
  # is 223. At 300 the largest of those sits at 74% — outside the band
  # `linecop --baseline 85` reports, so the cap does not hand the next sweep a
  # finding about the files it just created. At 250 both the largest arm and
  # `www/generate.sh` would be reported on day one, which is a cap arriving as
  # a surprise rather than as a decision.
  #
  # What it does NOT cover: linecop detects language by extension, so the
  # shebang-only `.githooks/` hooks are invisible to it at any limit. They are
  # ~25 lines each and the cap was never the thing keeping them short.
  Shell: 300

# The changelog is append-only (all under [Unreleased] pre-1.0) and gets
# archived on release, so a hard cap only fights normal growth.
overrides:
  - pattern: "**/CHANGELOG.md"
    exclude: true

  # These four are the always-loaded surface: README is the first thing a reader
  # sees, and AGENTS.md/CONTRIBUTING.md/SKILL.md are pulled into an agent's
  # context on every session. A line here costs more than a line anywhere else,
  # so they are capped tighter than the 200 Markdown ceiling, not looser.
  #
  # These caps were 250/300/300/300 and are now lower. That is not a reversal of
  # the reasoning that raised them (truth/tasks/stop-the-doc-size-cap-fighting-
  # correctness-fixes.typ), which still holds: a cap must never make a
  # correctness fix expensive. It applied because the files sat at 200/200 — a
  # wall, mid-edit. It does not apply now, because the delegation trim
  # (truth/tasks/trim-root-docs-by-delegating-deep-content.typ) moved the
  # reference material into www/content and docs/contributing, and each file
  # sits near 75% of its new cap with room for several correctness fixes in a
  # row.
  #
  # If one of these hits its cap again, the answer is progressive disclosure —
  # move the deep content to docs/contributing/ or www/content/ and link it —
  # not a bigger number. That is what the headroom is protecting.
  #
  # CONTRIBUTING.md is the tightest of the four because its remaining bulk is
  # the Quality Gates table, which is common-path and cannot be linked away. The
  # next drop comes from generating that table out of the file entirely
  # (truth/tasks/derive-the-drift-prone-doc-facts-from-their-sources.typ), not
  # from another compression pass.
  #
  # `linecop --baseline 85` names anything at 85% of its cap; run it before
  # adding to an existing file, so compaction is deliberate rather than a wall.
  - pattern: "**/README.md"
    limit: 180
  - pattern: "**/AGENTS.md"
    limit: 150
  - pattern: "**/CONTRIBUTING.md"
    limit: 200
  - pattern: "**/SKILL.md"
    limit: 300

count_mode: total

exclude_dirs:
  - target
  - archive
  - var
