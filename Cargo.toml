[package]
name = "mindtape"
version = "0.1.0"
edition = "2021"
description = "A file-based task tracker using Typst files as the source of truth"
license = "MIT"

[lib]
name = "mindtape"
path = "src/lib.rs"

[[bin]]
name = "mindtape"
path = "src/main.rs"

[dependencies]
typst = "0.14"
typst-eval = "0.14"
typst-library = "0.14"
typst-syntax = "0.14"
comemo = "0.5"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
notify = "7"
notify-debouncer-mini = "0.5"
ignore = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[workspace.lints.clippy]
# --- Correctness & Safety ---
out_of_bounds_indexing = "deny"
iter_out_of_bounds = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "deny"

# --- Code Quality ---
cognitive_complexity = "deny"
too_many_lines = "deny"
similar_names = "deny"
many_single_char_names = "deny"
if_same_then_else = "deny"
unnecessary_wraps = "deny"
large_enum_variant = "deny"
struct_excessive_bools = "deny"
new_without_default = "deny"
should_implement_trait = "deny"
type_complexity = "deny"
too_many_arguments = "deny"
needless_lifetimes = "deny"

# --- Redundancy ---
no_effect = "deny"
redundant_closure_call = "deny"
redundant_closure = "deny"
redundant_pattern = "deny"
redundant_static_lifetimes = "deny"
redundant_field_names = "deny"
neg_multiply = "deny"
approx_constant = "deny"
useless_let_if_seq = "deny"
useless_vec = "deny"
unused_unit = "deny"
unused_self = "deny"
deprecated_cfg_attr = "deny"
unseparated_literal_suffix = "deny"

# --- Pattern Matching ---
single_match = "deny"
single_match_else = "deny"
match_wild_err_arm = "deny"
match_overlapping_arm = "deny"

# --- Imports & Naming ---
wildcard_imports = "deny"
module_inception = "deny"
upper_case_acronyms = "deny"

# --- Documentation ---
missing_errors_doc = "deny"
missing_panics_doc = "deny"
doc_markdown = "deny"

# --- Pointers ---
trivially_copy_pass_by_ref = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ref_as_ptr = "deny"

# --- Style ---
semicolon_if_nothing_returned = "deny"
redundant_else = "deny"
redundant_closure_for_method_calls = "deny"
match_same_arms = "deny"
undocumented_unsafe_blocks = "deny"
