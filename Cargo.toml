[package]
name = "mindtape"
version = "0.1.0"
edition = "2021"

[lib]
name = "mindtape"
path = "src/lib.rs"

[[bin]]
name = "mindtape"
path = "src/main.rs"

[dependencies]
typst = "0.14"
typst-eval = "0.14"
typst-library = "0.14"
typst-syntax = "0.14"
comemo = "0.5"

[dev-dependencies]
tempfile = "3"
