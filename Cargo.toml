[package]
name = "mindtape"
version = "0.1.0"
edition = "2021"

[lib]
name = "mindtape"
path = "src/lib.rs"

[[bin]]
name = "mindtape"
path = "src/main.rs"

[dependencies]
typst = "0.14"
typst-eval = "0.14"
typst-library = "0.14"
typst-syntax = "0.14"
comemo = "0.5"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
notify = "7"
notify-debouncer-mini = "0.5"
ignore = "0.4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
