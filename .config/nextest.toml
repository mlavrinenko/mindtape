# nextest's default profile, so every runner shares one output level rather
# than each recipe remembering a flag.
#
# `just test` passes `--status-level fail` on the command line and always has.
# `just cover` runs the same suite through `cargo llvm-cov nextest`, which does
# NOT honour that flag — verified here on 2026-09-02: the recipe's run was
# **2316 lines, 2137 of them `PASS`**, one per test, to report a green suite and
# a coverage table. A flag that is accepted and ignored is worse than one that is
# absent, because the recipe then claims something the output disproves.
#
# Setting it here fixes it where both runners read it. A green run prints the
# summary and nothing per test; a failure still prints, per test, which is the
# whole point of `fail` rather than `none`.
[profile.default]
status-level = "fail"

# The suite's in-process unit tests read `$VISUAL`/`$EDITOR` directly
# (`add_interactive::editor_command`), so a mutant that ignores the test's
# override falls through to whatever editor the developer's session carries.
# A `--wait` GUI editor opens one window per mutant,
# `run_parses_editor_output` killed at the timeout, the mutant recorded as
# TIMEOUT instead of caught. These unit tests run inside the nextest process,
# so the lock has to be in the environment it inherits: `.just/scripts/
# _mutants-env.sh` unsets `VISUAL` and points `EDITOR` at a binary that cannot
# exist, and every `just mutants`/`just mutants-diff` sources it.
#
# Not a block in this file: nextest accepts an unknown `[env]` table with a
# warning and ignores it (verified 2026-09-29). Not `.cargo/config.toml`
# either — `just nix-build` exists to reject a committed one. A raw
# `cargo mutants` bypasses the lock; `just mutants` is the supported path.
