# Months filed before this gate keep their prose. Cleaning a month is its own
# task, and each line disappears when that month passes. `swept/` holds
# generated findings, which are records rather than prose.
[truth/tasks/2026-07/*.typ]
BasedOnStyles = NONE

[truth/tasks/2026-08/*.typ]
