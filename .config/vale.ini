# Vale reads a .typ file through typst2vast, which parses the Typst syntax
# tree without evaluating it. Code, raw spans, math and comments never reach a
# rule, and a `[content]` block inside code is prose, so a figure caption is
# linted where it renders.
#
# The style is built from pinned flake inputs by nix/dev/vale-styles.nix, and
# the dev shell links it at target/vale/styles. `.config/vale/local/` holds the
# repo's own rules and vocabulary. A run needs no network after the first build.
StylesPath = ../target/vale/styles
MinAlertLevel = error
Vocab = Prose

# The tree-sitter grammars the code sections read come from the nix store, not
# from `vale sync`: the dev shell exports them through VALE_GRAMMARS_PATH, and
# nix/dev/vale-grammars.nix pins each module to the Vale release.

# Vale has no `.sh` extension mapping in 3.27. Its R reader is the bash
# grammar over `#` comments, so naming R as the format is what lets a `[*.sh]`
# section read shell comments at all. Drop this if Vale learns `.sh` itself.
[formats]
sh = r

# A quoted example is a quotation, not the writer's prose: the documentation
# page shows bad sentences on purpose. The pattern wraps the quoted text in a
# raw span before the Typst parse, as the prose gate does. It spans
# lines, because a bad example may wrap. A raw span with quotes in it can break
# into prose under this pattern, so an uppercase word it exposes goes in
# Shouting.yml's exception list.
[*.typ]
BasedOnStyles = Prose, Vale
TokenIgnores = ((?s)"[^"]*")
# A reference table is data, not prose: a row holds a rule name, the trigger
# and a quoted bad example. The quoted example is skipped already; the markers
# keep the sentence rules from reading the rows as one long sentence. Use them
# only around a table of triggers, never around a page paragraph.
BlockIgnores = ((?s)// vale-data begin.*?// vale-data end)

# Vale.Terms and Vale.Avoid read the Prose vocabulary. The first enforces the
# exact case of every accepted term, the second rejects a spelling outright.
# Prose.Spelling supplies the dictionary, so Vale's own spelling rule is off.
# Vale.Repetition catches a word typed twice in a row.
Vale.Spelling = NO
Vale.Terms = error
Vale.Avoid = error
Vale.Repetition = error

# Core prose rules. Each level sits here, not in the rule file, so promoting a
# cleaned rule is one edit. The Nix build strips each upstream `level`.
Prose.History = error
Prose.Shouting = error
Prose.EmDash = error
Prose.ProductName = error
Prose.SentenceLength = error
Prose.PassiveVoice = error
Prose.Weasel = error
Prose.Wordiness = error
Prose.Latin = error
Prose.HeadingPunctuation = error
Prose.HeadingCase = error
Prose.Spelling = error
Prose.Semicolon = error

# The ai-tells rules this project keeps. The messages come from tbhb/vale-ai-tells
# v1.37.0 (MIT). A rule that fires on the docs is either fixed or dropped with
# its reason below.
Prose.OpeningCliches = error
Prose.ClosingPleasantries = error
Prose.ConclusionMarkers = error
Prose.RestatementMarkers = error
Prose.FillerPhrases = error
Prose.HedgingPhrases = error
Prose.PromotionalPuffery = error
Prose.SycophancyMarkers = error
Prose.StructureAnnouncements = error
Prose.UnpackExplore = error
Prose.ServesAsDodge = error
Prose.PseudoCleft = error
Prose.ShellNounCopula = error
Prose.OverusedVocabulary = error
Prose.AICompoundPhrases = error
Prose.FalseExclusivity = error
Prose.UrgencyInflation = error
Prose.VagueAttributions = error
Prose.JourneyMetaphors = error
Prose.FormalTransitions = error
Prose.FormalRegister = error
Prose.NegatedObject = error
Prose.NegatedSubject = error
Prose.ConsequenceClause = error
Prose.BareNames = error
Prose.ExplainerHeadings = error
Prose.ShipOveruse = error
Prose.AnthropomorphicCognition = error
Prose.AnthropomorphicJustification = error
Prose.LabelAndExplain = error
Prose.ExplainerLeads = error
Prose.DoubleHyphen = error

# Dropped ai-tells rules, by name, because each one flags prose this project
# needs:
# - CataphoricForecasting: "Two pages state the rule" counts a short list, and
#   the count is the fact.
# - ContrastiveFormulas, StrawmanContrast: "a pack name, not a file" names the
#   distinction that prevents a misreading; the package cannot tell it from the
#   "not X but Y" formula.
# - CoordinatedReveal: ", and only the ..." states the effect of the clause
#   before it; the package reads every consequence as a reveal.
# - UniversalSubject, AbsoluteAssertions: "Every command reads the config" is
#   an exact claim about the CLI, not a blanket claim about the world.
# - FillerIntensifier: "a single" and "no single" are exact counts.
# - FigurativeBreeds, FigurativeCarries, FigurativeCasts, FigurativeClears,
#   FigurativeDemands, FigurativeDisguises, FigurativeDraws, FigurativeEarns,
#   FigurativeFalls, FigurativeFires, FigurativeHolds, FigurativeIdioms,
#   FigurativeKeeps, FigurativeLands, FigurativeLends, FigurativeLives,
#   FigurativeLoud, FigurativeMints, FigurativeNouns, FigurativeOwns,
#   FigurativePays, FigurativeQuantities, FigurativeQuiet, FigurativeReaches,
#   FigurativeRides, FigurativeRuns, FigurativeSees, FigurativeSettles,
#   FigurativeShape, FigurativeSits, FigurativeStays, FigurativeStrikes,
#   FigurativeSurfaces, FigurativeSweeps, FigurativeTravels, FigurativeTrips,
#   FigurativeWins, FigurativeWorth, BareHolds, BareReaches: in this domain
#   "mint a SWHID", "hold a value", "keep a state" and "shape a task" name
#   literal operations. The package's own messages say to disable these rules
#   for domain prose.
# - EnforcementMetaphors, EvasionMetaphors: "the gate refuses" and "the scan
#   skips" name what the code does.
# - Metacommentary, MicDrop, ParallelStaccato, StackedAnaphora: the matches are
#   headings and task definitions, not commentary.
# - NounString: four technical nouns in a row can be the precise name.
# - VerbTricolon: three parallel verbs are a real list, not a rhetorical tic.
# - NamedAdjective: "a branch named main" is the exact relation.
# - NegatedPair: "neither X nor Y" is the shortest correct form.
# - ColonUsage: the rule wants a lowercase word after every colon, and a
#   proper noun after a list label is correct; "Org-mode: Emacs outlines" is
#   one such case.

# Code comments. Vale reads them through the tree-sitter grammars above, so a
# rule sees a comment's prose and never the code around it. `Sep` is the only
# style here: a banner rule holds a comment to a shape. The prose rules for a
# shell comment live in .config/vale-plain.ini, so a banner run reads no prose.
[*.{rs,sh,css}]
BasedOnStyles = Sep
Sep.Banner = error

