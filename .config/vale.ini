# Vale reads a .typ file through typst2vast, which parses the Typst syntax
# tree without evaluating it. Code, raw spans, math and comments never reach a
# rule, and a `[content]` block inside code is prose, so a figure caption is
# linted where it renders.
#
# The styles are this repo's own, under vale/styles/Prose. `vale sync` has
# nothing to install, so a run needs no network.
StylesPath = vale/styles
MinAlertLevel = warning

# A quoted example is a quotation, not the writer's prose: the documentation
# page shows bad sentences on purpose. The pattern wraps the quoted text in a
# raw span before the Typst parse, as `check-doc-prose` skips it. It spans
# lines, because a bad example may wrap. A raw span with quotes in it can break
# into prose under this pattern, so an uppercase word it exposes goes in
# Shouting.yml's exception list.
[*.typ]
BasedOnStyles = Prose
TokenIgnores = ((?s)"[^"]*")

# A task records a change. "now", "no longer" and "used to" name the old and
# new behavior, which is what AS-IS and TO-BE are for, so the history rule
# belongs to the docs. The product name has a defined constant only in the
# docs sources, so a task may type it.
[truth/tasks/*/*.typ]
Prose.History = NO
Prose.ProductName = NO

# Months filed before this gate keep their prose. Cleaning a month is its own
# task, and each line disappears when that month passes. `swept/` holds
# generated findings, which are records rather than prose.
[truth/tasks/2026-07/*.typ]
BasedOnStyles = NONE

[truth/tasks/2026-08/*.typ]
BasedOnStyles = NONE

[truth/tasks/2026-09/*.typ]
BasedOnStyles = NONE

[truth/tasks/swept/*.typ]
BasedOnStyles = NONE
