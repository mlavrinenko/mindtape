# A commit message is prose, and Vale reads it as Markdown. The `Commits`
# style holds the five rules a subject and a body are held to: the subject's
# length, its imperative opener, history words, em dashes and shouted words.
# The style extends the matching `Prose` rules, so the word lists live once.
#
# The style comes from the pinned flake inputs by nix/dev/vale-styles.nix, and
# the dev shell links it at target/vale/styles. A run needs no network after
# the first build.
StylesPath = ../target/vale/styles
MinAlertLevel = error

[formats]
txt = md

[*.txt]
BasedOnStyles = Commits
Commits.SubjectLength = error
Commits.Imperative = error
Commits.History = error
Commits.EmDash = error
Commits.Shouting = error
Commits.CoAuthor = error
Commits.Generated = error
