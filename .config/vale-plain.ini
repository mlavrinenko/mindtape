# Every prose source outside a Typst document: the skill's Markdown, the
# comments of every tracked shell script, Justfile and YAML file, both schema
# descriptions and the strings `mt _cli --json` prints in `--help`.
# `docs::prose` runs it.
#
# The `Plain` style extends `Prose.History`, `Prose.Shouting` and
# `Prose.EmDash`, so the word lists and patterns live in one file. A Typst
# source goes through `vale.ini` with the full `Prose` style instead.
#
# The style is built from pinned flake inputs by nix/dev/vale-styles.nix and
# linked at target/vale/styles. The dev shell exports the grammars through
# VALE_GRAMMARS_PATH. A run needs no network after the first build.
StylesPath = ../target/vale/styles
MinAlertLevel = error
Vocab = Prose

# Vale 3.27 has no `.sh` extension mapping. Its R reader is the bash grammar
# over `#` comments, so naming R as the format is what lets a `.sh` section
# read shell comments at all. The same reader reads a Justfile's `#` comments;
# `Justfile` takes its own mapping because it has no extension.
[formats]
sh = r
just = r
Justfile = r

# The skill's references and its eval README. A quoted example is a quotation,
# so the code-span alternative comes first and a quote inside a span stays
# hidden with the span. History and shouting are the rules the old script
# applied, and `Vale.Terms` and `Vale.Avoid` replace its `MindTape` grep.
# Spelling and repetition stay off, because the Markdown arm never checked
# them.
[*.md]
BasedOnStyles = Plain, Vale
TokenIgnores = ((?s)`[^`]*`|"[^"]*")
Plain.History = error
Plain.Shouting = error
Plain.EmDash = NO
Vale.Spelling = NO
Vale.Repetition = NO
Vale.Terms = error
Vale.Avoid = error

# A shell comment is prose. The Comments View reads it through the bash
# grammar and parses its body as Markdown, so a code span passes. A constant
# written as `$NAME`, `${NAME}` or `NAME=` is code, and a shellcheck directive
# is a message to shellcheck, not a reader. The reader leaves a heredoc body
# alone.
[*.sh]
BasedOnStyles = Plain
View = Comments
TokenIgnores = ((?m)^shellcheck\s+.*|`[^`]*`|"[^"]*"|\$\{?[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*=)
Plain.History = error
Plain.Shouting = error
Plain.EmDash = NO

# A Justfile's `#` comments, read the same way. `[**/Justfile]` matches the
# root Justfile and one in a subdirectory.
[*.just]
BasedOnStyles = Plain
View = Comments
TokenIgnores = ((?m)^shellcheck\s+.*|`[^`]*`|"[^"]*"|\$\{?[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*=)
Plain.History = error
Plain.Shouting = error
Plain.EmDash = NO

[**/Justfile]
BasedOnStyles = Plain
View = Comments
TokenIgnores = ((?m)^shellcheck\s+.*|`[^`]*`|"[^"]*"|\$\{?[A-Z][A-Z0-9_]*|[A-Z][A-Z0-9_]*=)
Plain.History = error
Plain.Shouting = error
Plain.EmDash = NO

# A YAML value is data, not prose, so the View keeps the `#` comments and
# drops the values. The docs, the gate table and the configs live or die by
# those comments.
[*.{yaml,yml}]
BasedOnStyles = Plain
View = Comments
TokenIgnores = ((?s)`[^`]*`|"[^"]*")
Plain.History = error
Plain.Shouting = error
Plain.EmDash = NO

# A schema description reaches the docs site and an editor. The Schema View
# keeps every `description`, at the root and nested, and `md` keeps a code
# span out.
[*.json]
BasedOnStyles = Plain
View = Schema
TokenIgnores = ((?s)`[^`]*`|"[^"]*")
Plain.History = error
Plain.Shouting = error
Plain.EmDash = error

# `mt _cli --json`, written to `target/cli.help`, holds the strings `--help`
# prints. Only the em dash rule applies, because a help string is terminal
# text. `.help` is no data extension, so the dasel View reads the file as
# YAML, which reads JSON too.
[*.help]
BasedOnStyles = Plain
View = Help
TokenIgnores = ((?s)`[^`]*`|"[^"]*")
Plain.History = NO
Plain.Shouting = NO
Plain.EmDash = error
