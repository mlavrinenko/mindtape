# The Cargo schema tells tombi to sort keys and array values. These rules turn
# that off, so a group of keys keeps its written order and its comment.
[[schemas]]
toml-version = "v1.0.0"
path = "https://www.schemastore.org/cargo.json"
include = ["Cargo.toml", "crates/*/Cargo.toml"]
format.rules = { array-values-order.enabled = false, table-keys-order.enabled = false }
