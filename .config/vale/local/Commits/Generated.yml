# A "Generated by ..." line attributes the commit to a tool. The project's
# commits name their author, not their tool, so the line fails the message.
# The token keeps the signature's capital G: a body's lowercase "generated
# by" is prose about the build, and the Shouting rule already has the caps.
extends: existence
message: "Drop the generated-by line: '%s'."
level: error
nonword: true
tokens:
  - 'Generated by'
