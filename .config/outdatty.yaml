# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/outdatty/main/schema/outdatty.schema.json

# Every path below and every key in outdatty.lock, which sits beside this file,
# starts at the repo root.
root: ..

# Declares which dependents must be re-confirmed when a source changes. After
# editing a source, review the dependents and run `just outdatty::update <group>`
# to record the new state. `just outdatty::update-all` re-records every group, so
# use it only after reviewing every group's dependents. `just outdatty::check`
# (part of `just check`) fails until you do.

# `require_tracked` opts out of outdatty's audit that every non-gitignored file
# belongs to some group (default `["**"]`). The audit does not fit this repo.
# Most files are crate sources and task artifacts, and no drift group should
# claim either. A group means "review these dependents when this source
# changes", and answering the audit by inventing groups would turn it into
# "this file is known", which is not worth gating. Even the doc surfaces the
# audit suits (a new page that no group tracks) have real exclusions inside
# them (generated `.md` outputs, CSS, the jq programs), so no narrow scope is
# free either. The opt-out is explicit so that a tool bump does not absorb it
# silently.
require_tracked: ["!**"]

# What a dependent-only edit owes this lock: record that dependent alone, in the
# commit that made the edit, with `just outdatty::update <group> <path>`.
#
# Only a source change triggers the gate. That asymmetry is intended. A
# dependent edited on its own moves no source hash, so the gate stays green, and
# the dependent's recorded hash sits stale until an unrelated source edit
# re-records the group and carries the dependent's hash along. The lock then
# shows the review on the wrong commit.
#
# Measured on outdatty 0.4.0 with one hand-edited dependent:
#
#   - `outdatty check` and plain `outdatty status` print `[ ok ]` for the group
#     and exit 0.
#   - `outdatty status --format json` names the file in the group's
#     `changed_dependents` array while its `status` stays `"ok"`.
#   - `outdatty update --group <g>` rewrites only that dependent's hash while no
#     other dependent in the group is pending. With another one pending, the
#     group re-record stamps it too, onto a commit that never reviewed it.
#
# So the record is per file. outdatty 0.5's `--dependent <path>` (the recipe's
# optional trailing paths) records the named dependent's hash and leaves the
# group's sources and every other pending dependent as locked. That makes the
# watermark CONTRIBUTING.md claims ("a recorded hash is a review watermark")
# hold for dependents as well as sources. A source edit still re-records the
# whole group, because that edit obliges a review of every dependent.
#
# This is a convention with a query and no gate. A dependent changing alone is
# ordinary work, and a check that failed on it would turn every doc edit red and
# reverse the source/dependent asymmetry above. Pending re-records are listed by
#
#   outdatty status --format json | jq -r '.groups[] | select(.changed_dependents != []) | .id'
#
# A forgotten one misattributes the watermark and never breaks a build.

groups:
  # The CLI groups. The build renders every command, flag, default and help
  # line from `mt _cli --json` (www/generated/cli.json), and
  # `just docs::spans` checks each `mt …` argv the prose quotes, so a flag
  # change needs no review. What still drifts is prose that restates what a
  # module does: a refusal, a default, an output shape. So each group pairs one
  # source with the pages that restate it, and editing `cmd/ls/mod.rs` asks
  # for the `mt ls` prose and nothing else.
  #
  # A command's source is the module that declares its `*Args` and runs it,
  # plus each helper sibling a page restates: `cmd/flip/guards.rs` and
  # `cmd/ls/rules.rs` are sources, `cmd/link/plan.rs` is not. A helper no prose
  # restates stays out, because listing it would fire a review on an internal
  # refactor. www/utils/cli-notes.typ holds one entry per command, so in each
  # group below it means that command's entry.
  #
  # A page under www/content/cli/ joins a group only when it carries prose of
  # its own. The ones that hold only `#cli-command(...)` (add, at, board,
  # eval, find, go, import, init, install, preset, review, set) render from
  # cli.json and restate nothing. `crates/mindtape/src/lib.rs` is no source:
  # its re-exports move on ordinary commits and no page restates them.
  # `cmd/review.rs` is none either, as no prose says more than its help.

  # The global flags `cli/mod.rs` declares: `-w`, `--color`,
  # and each status as a command of its own. The binary's name is cli-name's.
  - name: cli-globals-docs
    source:
      - crates/mindtape-cli/src/cli/mod.rs
    dependents:
      - www/content/agents.typ
      - www/content/config.typ
      - www/content/cli/ls.typ
      - docs/src/skill.typ

  # Which argument completes from which project value. cli-notes.typ's
  # `install` entry and the quickstart name the values a tab press offers.
  - name: cli-completion-docs
    source:
      - crates/mindtape-cli/src/cli/completion/mod.rs
    dependents:
      - www/utils/cli-notes.typ
      - www/content/quickstart.typ

  # `mt add`: the fill order, the built-in template, `--dedup`, the editor,
  # `--describe=json` and `--format json`, and the refusal of an unknown slot.
  - name: cli-add-docs
    source:
      - crates/mindtape-cli/src/cmd/add/mod.rs
    dependents:
      - www/utils/cli-notes.typ
      - www/content/templates.typ
      - www/content/config.typ
      - www/content/agents.typ
      - www/content/quickstart.typ
      - docs/src/skill.typ
      - skills/mindtape/references/add-slots.md
      - skills/mindtape/evals/README.md
      - skills/mindtape/evals/evals.json

  # `mt allow`: what it prints and records. The approval's digest, its place
  # outside the repo and the worktrees sharing it live in
  # `crates/mindtape/src/allow.rs`, which hooks.typ, wait-on-upstream.typ and
  # the skill restate.
  - name: cli-allow-docs
    source:
      - crates/mindtape-cli/src/cmd/allow.rs
      - crates/mindtape/src/allow.rs
    dependents:
      - www/content/cli/allow.typ
      - www/utils/cli-notes.typ
      - www/content/hooks.typ
      - www/content/wait-on-upstream.typ
      - docs/src/skill.typ
      - skills/mindtape/evals/README.md
      - skills/mindtape/evals/evals.json

  # `mt check`: the template pass (`check/templates.rs`), `--commit-msg`
  # (`check/commit.rs`) and `--commits` (`check/range.rs`), the `ok:` line and
  # the exit code.
  - name: cli-check-docs
    source:
      - crates/mindtape-cli/src/cmd/check/mod.rs
      - crates/mindtape-cli/src/cmd/check/templates.rs
      - crates/mindtape-cli/src/cmd/check/commit.rs
      - crates/mindtape-cli/src/cmd/check/range.rs
    dependents:
      - www/content/cli/check.typ
      - www/content/commit-rules.typ
      - www/content/templates.typ
      - www/content/quickstart.typ
      - www/content/agents.typ
      - skills/mindtape/evals/evals.json

  # `mt config`: `show`, `--origin` and `--defaults`.
  - name: cli-config-docs
    source:
      - crates/mindtape-cli/src/cmd/config.rs
    dependents:
      - www/content/cli/config.typ
      - www/content/config.typ
      - www/content/priority.typ
      - www/content/agents.typ
      - docs/src/skill.typ

  # `mt dicts`: the listing's count and case, and one dictionary's merged
  # entries.
  - name: cli-dicts-docs
    source:
      - crates/mindtape-cli/src/cmd/dicts.rs
    dependents:
      - www/content/cli/dicts.typ
      - www/content/named-sets.typ
      - www/content/agents.typ
      - docs/src/skill.typ
      - skills/mindtape/references/filters.md

  # `mt eval` reads one file with no readiness, so its `why` is empty and its
  # `children` 0, as the schema says.
  - name: cli-eval-docs
    source:
      - crates/mindtape-cli/src/cmd/eval.rs
    dependents:
      - www/content/schema.typ
      - www/content/agents.typ

  # `mt find` is `mt ls` over `contains()` terms.
  - name: cli-find-docs
    source:
      - crates/mindtape-cli/src/cmd/find.rs
    dependents:
      - www/utils/cli-notes.typ
      - www/content/cli/ls.typ

  # `mt flip`: the status verbs, `-m`, `--force` past a guard or a gate, and
  # when hooks print. The guards are `flip/guards.rs` (transitions, `unblocked`,
  # unfinished children, required notes), the `[[on.flip]]` runner is
  # `flip/hooks.rs` and the environment a `run` command sees is
  # `flip/hooks_cmd.rs`. cli-notes.typ's `allow` entry says what a held-back
  # gate does to a flip.
  - name: cli-flip-docs
    source:
      - crates/mindtape-cli/src/cmd/flip/mod.rs
      - crates/mindtape-cli/src/cmd/flip/guards.rs
      - crates/mindtape-cli/src/cmd/flip/hooks.rs
      - crates/mindtape-cli/src/cmd/flip/hooks_cmd.rs
    dependents:
      - www/content/cli/flip.typ
      - www/content/statuses.typ
      - www/content/hooks.typ
      - www/content/links.typ
      - www/content/quickstart.typ
      - www/utils/cli-notes.typ
      - docs/src/skill.typ
      - skills/mindtape/evals/evals.json

  # `mt go`'s editor lookup and its `{task}` token.
  - name: cli-go-docs
    source:
      - crates/mindtape-cli/src/cmd/go.rs
    dependents:
      - www/utils/cli-notes.typ

  # `mt graph`: its two formats, `--no-terminal`, the node colors and the leaf
  # nodes of an external kind.
  - name: cli-graph-docs
    source:
      - crates/mindtape-cli/src/cmd/graph/mod.rs
    dependents:
      - www/content/cli/graph.typ
      - www/content/links.typ
      - www/content/agents.typ

  # `mt import`: the batch check, the report, `--map`, `--to`, `--into`,
  # `--dry-run`, the naming and the exit code.
  - name: cli-import-docs
    source:
      - crates/mindtape-cli/src/cmd/import/mod.rs
    dependents:
      - www/content/import-export.typ
      - www/content/schema.typ
      - skills/mindtape/references/import.md

  # `mt init`: the default preset, `--no-input`, the `#:schema` line and the
  # preset overlay.
  - name: cli-init-docs
    source:
      - crates/mindtape-cli/src/cmd/init/mod.rs
    dependents:
      - www/content/quickstart.typ
      - www/content/config.typ
      - www/content/import-export.typ

  # `mt install`: the four parts it writes, where each lands, and when to run
  # it again.
  - name: cli-install-docs
    source:
      - crates/mindtape-cli/src/cmd/install/mod.rs
    dependents:
      - www/utils/cli-notes.typ
      - www/content/quickstart.typ
      - www/content/config.typ

  # `mt link`: how a target is named and written, the merge, `--replace`, and
  # the `--apply` map, whose shape `cmd/link/input.rs` parses. `edit.rs` and
  # `plan.rs` decide nothing the prose restates.
  - name: cli-link-docs
    source:
      - crates/mindtape-cli/src/cmd/link/mod.rs
      - crates/mindtape-cli/src/cmd/link/input.rs
    dependents:
      - www/content/cli/link.typ
      - www/utils/cli-notes.typ
      - www/content/links.typ
      - docs/src/skill.typ
      - skills/mindtape/references/hand-editing.md

  # The built-in link kinds and the rule each carries (`BUILTIN_KINDS`).
  # /links/ renders its table, its count and each kind's rule from
  # link-kinds.json, and `mt link --help` lists the kinds off the same table, so
  # neither is here. What the hash still guards is the meaning each kind's note
  # gives, which a change of rule leaves compiling and wrong.
  - name: link-kinds-docs
    source:
      - crates/mindtape/src/link/mod.rs
    dependents:
      - www/utils/link-kind-notes.typ

  # Which commands run on a set (the `runs_on_set` mark in `CLASSIFICATION`).
  # /read-many-projects/, the skill and each command page list them from
  # set-commands.json and cli.json, so none is here. What the hash still guards
  # is what each set command's note says it does on a set, which a change of
  # mark leaves compiling and wrong.
  - name: set-commands-docs
    source:
      - crates/mindtape-cli/src/cli/command_class.rs
    dependents:
      - www/utils/set-command-notes.typ

  # `mt ls`: the facets, paging and the next-page command, the line under the
  # table, the sort spec, and that there is no `--all`. `ls/rules.rs` resolves
  # the `[[ls.rules]]` cascade the pages describe.
  - name: cli-ls-docs
    source:
      - crates/mindtape-cli/src/cmd/ls/mod.rs
      - crates/mindtape-cli/src/cmd/ls/rules.rs
    dependents:
      - www/content/cli/ls.typ
      - www/content/filters.typ
      - www/content/named-sets.typ
      - www/content/agents.typ
      - www/content/schema.typ
      - docs/src/skill.typ
      - skills/mindtape/references/filters.md
      - skills/mindtape/evals/README.md
      - skills/mindtape/evals/evals.json

  # `mt mv`: a bare stem, `git mv`, a rename in place, and each edge keeping
  # its prefix.
  - name: cli-mv-docs
    source:
      - crates/mindtape-cli/src/cmd/mv.rs
    dependents:
      - www/content/cli/mv.typ
      - www/utils/cli-notes.typ
      - www/content/concepts.typ

  # What each `--format` carries: the JSON envelope (`applied`, `truncated`,
  # `retired`), a set's `project` and `error`, and the CSV mapping (`slug#` as
  # `id`, `file` from the root). The table and the cell meanings are
  # restated by hand on these pages.
  - name: cli-output-docs
    source:
      - crates/mindtape-cli/src/render/output.rs
    dependents:
      - www/content/schema.typ
      - www/content/cli/ls.typ
      - www/content/agents.typ
      - www/content/import-export.typ
      - www/content/read-many-projects.typ

  # `mt preset ls --json`, in the agents page's list of JSON commands.
  - name: cli-preset-docs
    source:
      - crates/mindtape-cli/src/cmd/preset.rs
    dependents:
      - www/content/agents.typ

  # `mt recur`: the refusals, `--dry-run`, `--advance` and `--skip`.
  - name: cli-recur-docs
    source:
      - crates/mindtape-cli/src/cmd/recur/mod.rs
    dependents:
      - www/content/cli/recur.typ
      - www/content/recurring.typ

  # `mt rm`: a reference, a folder or a filter per entry, one confirmation,
  # the filter word read before a stem hash, and the bare `mt rm`.
  - name: cli-rm-docs
    source:
      - crates/mindtape-cli/src/cmd/rm/mod.rs
    dependents:
      - www/content/cli/rm.typ
      - www/utils/cli-notes.typ
      - www/content/filters.typ
      - www/content/statuses.typ
      - www/content/cli/ls.typ
      - docs/src/skill.typ

  # `mt rules`: the line each rule prints, the severity and message it shows
  # when a rule sets none, and which rules `--for` keeps.
  - name: cli-rules-docs
    source:
      - crates/mindtape-cli/src/cmd/rules.rs
    dependents:
      - www/content/cli/rules.typ
      - www/content/rules.typ
      - www/content/packs.typ
      - www/content/agents.typ
      - docs/src/skill.typ

  # `mt set`: the fields it refuses and the command each one names, the
  # fields it writes, and its re-run writing nothing.
  - name: cli-set-docs
    source:
      - crates/mindtape-cli/src/cmd/set.rs
    dependents:
      - www/utils/cli-notes.typ
      - www/content/cli/mv.typ
      - www/content/estimates.typ
      - docs/src/skill.typ
      - skills/mindtape/references/hand-editing.md
      - skills/mindtape/references/blocking.md
      - skills/mindtape/evals/evals.json

  # `mt views`: the listing, and one view's description.
  - name: cli-views-docs
    source:
      - crates/mindtape-cli/src/cmd/views.rs
    dependents:
      - www/content/cli/views.typ
      - www/content/named-sets.typ
      - docs/src/skill.typ

  # The filter and `--sort` field vocabulary. /filters/ renders its field
  # table and sort exceptions from filter-fields.json, so the page isn't here.
  # What the hash still guards is the prose beside those names, which a
  # change of meaning leaves compiling and wrong: the notes the table renders,
  # the skill's filter reference (docs::facts checks only its names), and
  # cli/ls.typ, which says `file` is no field and points at `path`. `sort.rs`
  # is not a second source: it reads its sortable fields off this one
  # (`is_sort_field`), and the rest is comparator internals.
  - name: filter-fields-docs
    source:
      - crates/mindtape/src/model/fields.rs
    dependents:
      - www/utils/filter-field-notes.typ
      - skills/mindtape/references/filters.md
      - www/content/cli/ls.typ

  # The config floor's values that prose quotes: the default view, `[rm]
  # default-filter`, the shipped `[ls.columns]` whens and `[templates]`. The
  # legend's table on /statuses/ renders from floor-legend.json and the scales
  # on /priority/ from frameworks.json, so neither page is here for those.
  - name: config-floor-docs
    source:
      - crates/mindtape/src/config/defaults.toml
    dependents:
      - www/content/filters.typ
      - www/content/cli/ls.typ
      - www/content/quickstart.typ
      - www/content/templates.typ
      - www/content/statuses.typ
      - www/content/import-export.typ
      - www/content/config.typ

  # The `flow` preset `mt init` writes by default. The quickstart's refused
  # flip and the jq adapters' status names quote its legend. No page quotes
  # the other presets.
  - name: flow-preset-docs
    source:
      - crates/mindtape-cli/src/cmd/init/presets/flow/config.toml
    dependents:
      - www/content/quickstart.typ
      - www/content/import-export.typ

  # The filter language's functions (`has`, `miss`, `contains`, `touches`,
  # `stale`, `changed`, `count`, `links`, `in_view`, ...) are matched by name
  # in the modules below. www/content/filters.typ and
  # skills/mindtape/references/filters.md list them by hand, and
  # www/generated/*.json carries nothing about what each one means, so a
  # function that is added, renamed or redefined has no fact file to flag the
  # two pages. Each module is listed rather than globbed, because a source
  # glob cannot exclude: `filter/**` would make every test edit and the
  # `[[ls.rules]]` condition language re-confirm these pages. The field
  # vocabulary the same pages list is tracked by filter-fields-docs.
  - name: filter-docs
    source:
      - crates/mindtape/src/filter/mod.rs
      - crates/mindtape/src/filter/aggregate.rs
      - crates/mindtape/src/filter/compare.rs
      - crates/mindtape/src/filter/eval.rs
      - crates/mindtape/src/filter/links.rs
      - crates/mindtape/src/filter/predicates.rs
      - crates/mindtape/src/filter/strings.rs
      - crates/mindtape/src/filter/views.rs
    dependents:
      - www/content/filters.typ
      - skills/mindtape/references/filters.md

  # The two word lists `mt` ships as the `mindtape-verbs` and
  # `mindtape-dev-verbs` dictionaries. The pages restate them by hand: the
  # 500-verb count, sample words such as `refactor` and `rate-limit`, and the
  # words ("Backport") that neither list holds. The `mt dicts` output they
  # capture is generated, so only this prose can drift.
  - name: dict-words-docs
    source:
      - crates/mindtape/src/dicts/verbs.txt
      - crates/mindtape/src/dicts/dev-verbs.txt
    dependents:
      - www/content/named-sets.typ
      - www/content/start-titles-with-a-verb.typ
      - www/content/filters.typ
      - www/content/packs.typ
      - skills/mindtape/references/filters.md

  # What `ready` and `blocked` mean once a `waits-on` checker can block a task.
  - name: waits-docs
    source:
      - crates/mindtape/src/waits.rs
      - crates/mindtape/src/graph/ready.rs
    dependents:
      - www/content/wait-on-upstream.typ
      - www/content/filters.typ
      - skills/mindtape/references/filters.md
      - docs/src/skill.typ

  # A package change (version, dependencies, metadata) should land in the changelog.
  - name: release-notes
    source:
      - Cargo.toml
    dependents:
      - CHANGELOG.md

  # The Typst task DSL is mirrored in the docs and the CLI's embedded copy.
  # concepts.typ, priority.typ, and templates.typ each carry their own
  # `task.with(...)`/`ice(...)`/`slot(...)` snippet taken from this file's
  # signatures. Each is also in a CLI group above for the command facts it
  # restates (dual membership, as with SKILL.md below). dsl.typ stays the
  # detailed reference the others defer to.
  #
  # index.typ's "Why Typst" list restates what the `task` signature checks.
  #
  # AGENTS.md and skills/mindtape/SKILL.md are generated (typlite;
  # `just docs::md`), so the sources are the dependents to reconcile. Their DSL
  # snippets and field-shape prose are hand-restated, not derived.
  # `www/generated/dsl-fields.json` carries the field names, but this group is
  # about the full task DSL shape (field types, framework packagers, the
  # validation-layer split), which no fact file captures.
  - name: prelude-docs
    source:
      - lib/prelude.typ
    dependents:
      - docs/src/agents.typ
      - www/content/index.typ
      - www/content/dsl.typ
      - www/content/links.typ
      - www/content/recurring.typ
      - www/content/concepts.typ
      - www/content/priority.typ
      - www/content/templates.typ
      - docs/src/skill.typ
      # Dual membership, for SKILL.md's reason: the slot detail it keeps here
      # also restates DSL shape (a framework priority's leaves are its slots).
      - skills/mindtape/references/add-slots.md

  # The built-in priority frameworks. /priority/ restates none of them: the
  # names, inputs, bounds, formulas, categories and both scales are derived into
  # www/generated/frameworks.json, so this group does not list that page. It
  # lists the one thing derivation cannot carry: www/utils/framework-notes.typ
  # says what each formula means, and re-formulating `ice` or re-purposing an
  # input leaves that prose compiling and wrong. Two failure modes a hash cannot
  # see are already covered without it: a framework that leaves frameworks.toml
  # fails the page render by name, and one that arrives fails `just
  # docs::facts` until it has an entry. So a one-dependent group is the
  # whole wiring.
  - name: priority-frameworks
    source:
      - crates/mindtape/src/framework/frameworks.toml
    dependents:
      - www/utils/framework-notes.typ

  # The Typst library version appears in every #import example and the CLI's
  # embedded constant. Bump lib/typst.toml and these must follow.
  #
  # docs/src/agents.typ (AGENTS.md's source), docs/src/readme.typ (README.md's
  # source), docs/src/skill.typ (SKILL.md's source) and www/utils/site.typ (the
  # docs site's `PKG_VERSION`, and through it every `#import` example on the
  # site) are not dependents: each reads its `@local/mindtape:...` version from
  # `www/generated/crate-map.json`'s `typst-lib.version` (itself derived from
  # this same lib/typst.toml), so a bump propagates through `just docs::md`
  # with no human reconciliation. A derived fact needs no drift gate.
  # docs/src/contributing.typ (CONTRIBUTING.md's source) never hand-types this
  # version and only names the group by reference, so it is not a dependent
  # either.
  - name: typst-pkg-version
    source:
      - lib/typst.toml
    dependents:
      - crates/mindtape/src/test_support/fs.rs
      - crates/mindtape/src/test_support/mod.rs
      - crates/mindtape-cli/src/cmd/init/mod.rs
      - crates/mindtape-cli/src/cmd/init/presets/gated/templates/task.typ
      - examples/minimal/tasks/fix-login-bug.typ
      - examples/minimal/tasks/add-dark-mode.typ
      - examples/minimal/tasks/refactor-auth.typ
