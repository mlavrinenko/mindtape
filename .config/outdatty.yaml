  # The binary / invocation name is documented and emitted by these sources.
  # Any rename (or new subcommand example) must land in every dependent. The
  # dependents include docs/src/agents.typ, docs/src/readme.typ,
  # docs/src/contributing.typ and docs/src/skill.typ, and omit the generated
  # AGENTS.md, README.md, CONTRIBUTING.md and SKILL.md. Their bare `mt`,
  # `mt ls` and `mt check` mentions are hand-typed in the sources and not
  # derived: nothing in www/generated/*.json carries the CLI binary's
  # invocation name.
  - name: cli-name
    source:
      - crates/mindtape-cli/Cargo.toml
      - crates/mindtape-cli/src/cli/mod.rs
    dependents:
      - docs/src/readme.typ
      - www/content/index.typ
      - www/content/quickstart.typ
      - www/content/cli.typ
      - docs/src/contributing.typ
      # The Command Semantics page hand-types `mt _cli`, `mt done` and
      # `mt flip done` mentions, so a binary or invocation rename must reach it.
      - docs/src/contributing/command-semantics.typ
      - docs/src/agents.typ
      - CHANGELOG.md
      - docs/src/skill.typ

  # Dev tooling and the contributor docs that describe it. A source is a file
  # whose behaviour a dependent restates by hand. No file in www/generated/
  # carries those facts, so editing a source means reviewing every dependent.
  #
  # The dependents are docs/src sources, never their rendered Markdown,
  # because a fix is made in the source. No doc lists the gates, so adding or
  # removing one needs no review here. Every deep dive describes recipes and
  # scripts by hand.
  #
  # The scripts under .just/scripts/ are listed one by one, each in the group of
  # the doc that restates it, so a script fix asks for that doc and no other. A
  # script no doc restates sits in the source-only group at the end. Tracking a
  # new script is a decision: `just meta::script-scope` fails on a script that
  # is a source of no group.
  - name: dev-shell-docs
    source:
      - flake.nix
      - nix/dev/flake.nix
      - nix/dev/shell.nix
      - Justfile
      - .config/nextest.toml
      - .config/wt.toml
      - .just/bench.just
      - .just/crap.just
      - .just/docs.just
      - .just/install.just
      - .just/lint.just
      - .just/meta.just
      - .just/mutants.just
      - .just/outdatty.just
      - .just/scripts/wt-carry-lcov.sh
      - .just/scripts/clippy.sh
      - .just/scripts/check-examples.sh
    dependents:
      - docs/src/contributing.typ
      - docs/src/agents.typ
      - docs/src/contributing/gates.typ
      - docs/src/contributing/example-projects.typ
      - docs/src/contributing/windows.typ
      - docs/src/contributing/coverage-crap.typ
      - docs/src/contributing/crap-baseline.typ
      - docs/src/contributing/mutation-testing.typ
      - docs/src/contributing/signal-sweep.typ
      - docs/src/contributing/docs-site-build.typ
      - docs/src/contributing/documentation.typ

  # The script that writes the site's Markdown copies and llms.txt, which
  # docs-site-build.typ describes and the agents page and the skill point
  # readers at.
  - name: site-markdown-docs
    source:
      - www/generate-md.sh
    dependents:
      - docs/src/contributing/docs-site-build.typ
      - www/content/agents.typ
      - docs/src/skill.typ

  # How a leading @name picks one project or a set, which commands read a set,
  # and the board a set shows: at.toml's keys and resolution in mindtape::at,
  # the held set and its refusal in project_set.rs and cmd/at.rs, the set paths
  # of ls and check, and the board's columns, `hide` and `sort` in at/board.rs.
  # The page, the skill and cli-notes.typ's `board` entry restate them by hand
  # around the captured runs. The shipped board.toml is not a source here,
  # because both pages render it by a `docs:slice`.
  - name: sets-docs
    source:
