  # The git hooks: gates.typ says what pre-commit asserts, commit-messages.typ
  # what commit-msg checks. contributing.typ's Dependency Drift section states
  # the Docs-Unaffected trailer the outdatty review check asks for.
  - name: githooks-docs
    source:
