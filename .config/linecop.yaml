# yaml-language-server: $schema=https://raw.githubusercontent.com/mlavrinenko/linecop/refs/heads/main/linecop-schema.json

# The repo root: linecop scans it, and every override pattern starts there.
root: ..

limits:
  Rust: 500
  Markdown: 200

  # A script that outgrows one job gets split. Two gate libraries with no seam
  # carry their own cap in `overrides` below. The `.githooks/` hooks have no
  # extension, so their `#!/usr/bin/env bash` line makes them Bash, not Shell.
  Shell: 300
  Bash: 300

  # The Justfile and the `.just/*.just` modules, held to the scripts' cap.
  Just: 300

  # A real ceiling for every Typst file, picked to clear the largest
  # (`lib/prelude.typ`) with headroom. The `docs/src` sources carry tighter
  # caps in their own overrides below. Raising this to fit one file loosens
  # every other Typst file at once, so split the file instead.
  Typst: 1000

# The changelog is append-only (all under [Unreleased] pre-1.0) and gets
# archived on release, so a hard cap only fights normal growth.
overrides:
  - pattern: "**/CHANGELOG.md"
    exclude: true

  # README.md, AGENTS.md, CONTRIBUTING.md and skills/mindtape/SKILL.md are
  # rendered from docs/src/*.typ by `just docs::md`, so their caps sit on the
  # sources below, where a fix is made. typlite writes one line per
  # paragraph, so a rendered file's line count measures its paragraphs, list
  # items and table rows.
  #
  # AGENTS.md, CONTRIBUTING.md and SKILL.md are capped as well, because every
  # agent session in this repo loads them whole. The line cap limits how many
  # rules a file holds, and `max_bytes` limits how long they run, because a
  # long paragraph counts as one line. Both leave about 10% room. When one
  # fires, follow "Rewrite the whole file" in docs/contributing/documentation.md
  # and never raise the number.
  #
  # A pattern is a `.gitignore` line read from `root`, the repo root. A bare
  # `README.md` matches that name at any depth, and `./README.md` or
  # `/README.md` anchors to the root. Each rendered file's pattern is anchored
  # with `./`, because skills/mindtape/evals/README.md is written by hand and
  # keeps the Markdown cap.
  #
  # `linecop --baseline 85` lists the files near their cap. Run it before you
  # add to an existing file.
  - pattern: "./README.md"
    exclude: true
  - pattern: "./AGENTS.md"
    limit: 78
    max_bytes: 5600
  - pattern: "./CONTRIBUTING.md"
    limit: 142
    max_bytes: 11300
  - pattern: "./skills/mindtape/SKILL.md"
    limit: 76
    max_bytes: 6600

  # The sources of the four rendered files. agents.typ (147 lines) and
  # skill.typ (129) are capped at their size after a whole rewrite plus about
  # 10%. An agent loads each whole, so the rule above holds for them too.
  # readme.typ and contributing.typ keep the Markdown cap plus room for the
  # Typst that reads generated facts. docs/generate-md.sh takes each source's
  # output path from its `<mindtape-md>` block, and each source is named after
  # the file it renders.
  - pattern: "**/docs/src/agents.typ"
    limit: 166
  - pattern: "**/docs/src/readme.typ"
    limit: 250
  - pattern: "**/docs/src/contributing.typ"
    limit: 260
  - pattern: "**/docs/src/skill.typ"
    limit: 144
  # The documentation rules are the one deep dive that grows with every new
  # docs rule, and only a writer of docs opens it, so it gets room above the
  # shared ceiling below (the first match wins) instead of a rewrite that would cut a rule.
  - pattern: "**/docs/src/contributing/documentation.typ"
    limit: 260
  # One cap for every deep-dive source. No deep dive is loaded into every
  # session, so one ceiling serves them all.
  - pattern: "**/docs/src/contributing/**"
    limit: 220
  # The deep dives under docs/contributing/ are rendered from those sources,
  # so the cap above covers them. A directory glob covers a new deep dive as
  # soon as it is rendered.
  - pattern: "./docs/contributing/*.md"
    exclude: true

  # Sourced by five doc gates, so a split would add a third file every one of them must load. The scanner and the extractor already read as two sections of one parse of the Typst tree.
  - pattern: "**/.just/scripts/_doc-blocks-lib.sh"
    limit: 360

  # One gate with one job, stopping history and shouting in prose. Its name scan, comment scan and schema scan share the awk rules, so a split would copy them.
  - pattern: "**/.just/scripts/check-doc-prose.sh"
    limit: 360

count_mode: total

exclude_dirs:
  - target
  - archive
  - var

# The walker skips dot-prefixed directories by default, which would leave every
# recipe body in `.just/scripts/` uncapped. Setting `include_hidden` here and
# not passing `--hidden` in the recipe keeps `lint::size` a single
# `linecop` invocation, so the gate table's Command column renders the real
# command. It also keeps the scan scope a property of the repo: `linecop`,
# `linecop --baseline 85` and `just eject`'s `--format paths` run all see the
# same file set, which they would not if only the gate carried the flag.
#
# It pulls in `.githooks/`, the `.just/` modules and `.just/scripts/*.sh`.
# VCS metadata stays excluded by linecop itself and gitignored paths are still
# skipped, so `.direnv/` and `.mmz/cache/` never enter the walk.
include_hidden: true
