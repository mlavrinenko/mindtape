# Vale's config for Rust doc comments, read by the `lint::vale-code` recipe.
# Vale reads a Rust comment through its tree-sitter grammar. The RustDoc View
# in .config/vale/local/config/views/RustDoc.yml keeps `///` and `//!` and
# drops an inline `//` comment. `[formats] rs = md` parses the comment body as
# Markdown, so a code span and a fenced doc test stay out.
#
# The style comes from the pinned flake inputs by nix/dev/vale-styles.nix, and
# the dev shell links it at target/vale/styles. `.config/vale/local/` holds the
# repo's own rules, the View and the vocabulary. A run needs no network after
# the first build.
StylesPath = ../target/vale/styles
MinAlertLevel = error
Vocab = Prose

# Associate the comment body with Markdown. The View sets the type too.
[formats]
rs = md
# The shell comment move that follows enables this mapping and the section at
# the end of the file together. Vale 3.27 has no `.sh` reader; its R grammar
# reads `#` comments.
# sh = r

# A rule is `error` or `NO`. A warning is a rule nobody enforces, and it fills
# an editor with prose the gate ignores. The disabled groups below wait for
# `backfill-the-code-comment-prose`, which clears their alerts and moves each
# group to `error` here.
[*.rs]
BasedOnStyles = Prose
View = RustDoc
Prose.History = error
Prose.Shouting = error

# Sentence shape.
Prose.SentenceLength = NO
Prose.PassiveVoice = NO
Prose.Semicolon = NO
Prose.ConsequenceClause = NO
Prose.EmDash = NO
Prose.DoubleHyphen = NO
Prose.Latin = NO
Prose.HeadingPunctuation = NO
Prose.HeadingCase = NO

# Word choice.
Prose.Weasel = NO
Prose.Wordiness = NO
Prose.FormalRegister = NO
Prose.OverusedVocabulary = NO
Prose.JourneyMetaphors = NO
Prose.AICompoundPhrases = NO
Prose.UrgencyInflation = NO
Prose.PromotionalPuffery = NO
Prose.SycophancyMarkers = NO
Prose.HedgingPhrases = NO
Prose.FillerPhrases = NO
Prose.OpeningCliches = NO
Prose.ClosingPleasantries = NO
Prose.ConclusionMarkers = NO
Prose.RestatementMarkers = NO
Prose.StructureAnnouncements = NO
Prose.UnpackExplore = NO
Prose.VagueAttributions = NO
Prose.FalseExclusivity = NO
Prose.FormalTransitions = NO

# Sentence frames.
Prose.ServesAsDodge = NO
Prose.PseudoCleft = NO
Prose.ShellNounCopula = NO
Prose.LabelAndExplain = NO
Prose.ExplainerLeads = NO
Prose.NegatedObject = NO
Prose.NegatedSubject = NO
Prose.BareNames = NO
Prose.AnthropomorphicCognition = NO
Prose.AnthropomorphicJustification = NO
Prose.ShipOveruse = NO
Prose.ExplainerHeadings = NO

# Names and spelling.
Prose.ProductName = NO
Prose.Spelling = NO

