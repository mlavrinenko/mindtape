# .mmz/config.yaml — per-sub-gate memoized freshness for MindTape's close gate.
#
# `mt flip` into a terminal status runs `mmz --is-fresh --tag gate`, which
# asserts every gate-tagged rule already passed against this worktree rather
# than running any of them again. Rules here that are NOT gate-tagged are
# memoized for convenience (a future `mmz just bench` would skip on a no-op
# re-run) but stay out of the close predicate.
#
# A gate that re-runs `just check` inside `mt flip` is bad ergonomics — slow,
# at the least convenient moment, and it teaches an agent to reach for
# `--force`. Asserting a prior pass is cheap and is the predicate the review
# actually wants: proof of a passing build, not a claim of one.
#
# Record every gate pass by running `just check` itself — every arm of `just
# check` is `just mmz <subgate>`, so the underlying sub-recipe runs through mmz
# and records its outcome. `mmz --is-fresh --tag gate` then asserts all of them.
#
# NOTE ON SCOPE. `truth/tasks/**` is deliberately absent from every scope.
# `mt flip` writes the task file it is gating, so a rule keyed on those files
# would go stale the moment a status is stamped — the close gate would flip
# itself stale mid-command, and a multi-target or sequential close could never
# pass. `just fmt-check` DOES typstyle-check `truth/tasks/` (see the Justfile),
# so a full `just check` still rejects a mis-formatted task file; we just don't
# MEMOIZE that read, trading a task-file-only formatting change escaping the
# freshness shortcut for a gate that survives its own writes. Task structure is
# validated by the pre-commit hook (`cargo run -- check`), not by the gate.

scopes:
  # Everything that builds the rust crates: ALL files under crates/ — not just
  # `*.rs`. defaults.toml, frameworks.toml, the preset/axes `config.toml` and the
  # embedded template `.typ` are `include_str!`'d into the binary and asserted by
  # the test suite, so `crates/**` keeps them in the build/test freshness (a
  # `*.rs`-only glob silently dropped them). Plus the workspace manifests and the
  # rust-toolchain pin. The dev-shell toolchain (flake.nix/flake.lock) lives in
  # `gates-meta`, shared by every rule.
  rust:
    - "crates/**"
    - "Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain.toml"

  # cargo fmt's config — edits change what "formatted" means.
  rust-fmt:
    - "rustfmt.toml"

  # cargo clippy's config — edits change the lint surface.
  rust-clippy:
    - "clippy.toml"

  # Cargo manifests only — cargo-machete reads these, not sources. Includes the
  # per-crate manifests (where the `[dependencies]` machete scans actually live),
  # not just the virtual workspace root.
  manifests:
    - "Cargo.toml"
    - "Cargo.lock"
    - "crates/**/Cargo.toml"

  # Policy/config the workspace tests assert against, plus the Typst prelude
  # every task file imports (edits to lib/prelude.typ bust the test cache).
  policy:
    - ".mindtape/config.toml"
    - ".mindtape/templates/**"
    - "schema/**"
    - "lib/**"

  # TOML formatter (`just fmt-check` runs `tombi format --check` over these).
  toml-fmt:
    - ".mindtape/config.toml"
    - "examples/learn-piano/.mindtape/config.toml"
    - "examples/large/.mindtape/config.toml"

  # Typst formatter (`just fmt-check` runs `typstyle --check` over these).
  # `truth/tasks/**` is intentionally NOT listed (see NOTE ON SCOPE): the gate
  # must survive `mt flip`'s own writes to that tree.
  typ-fmt:
    - "lib/**"
    - "examples/learn-piano/tasks/**"
    - "examples/learn-piano/.mindtape/templates/**"
    - "www/content/**"
    - "www/templates/**"
    - "www/utils/**"

  # linecop config — a limit change busts the file-size gate.
  file-size-config:
    - ".linecop.yaml"

  # outdatty's own config + lock. The dependents outdatty re-reads are already
  # covered by the `rust`/`policy`/`examples`/`docs` scopes (outdatty.lock
  # hashes their content), so a dependent edit busts via those scopes, and a
  # raw lock/config edit busts here.
  outdatty-config:
    - "outdatty.yaml"
    - "outdatty.lock"

  # The example projects `just check-examples` validates — keep this list and
  # that recipe in step. A fixture outside the scope goes false-fresh and stops
  # being gated, which is how the skill's previous eval fixture rotted through
  # two config migrations unnoticed. Deliberately not a `examples/*` glob:
  # examples/large/ is a generated, gitignored benchmark fixture that the recipe
  # does not check, and its 2000 task files would churn this rule for nothing.
  examples:
    - "examples/learn-piano/**"
    - "examples/minimal/**"

  # The docs tree `just docs-check` builds and validates (tola + pagefind +
  # validate) plus the mirrored docs whose drift outdatty gates. `docs/**`
  # covers the frozen decisions and redesign subdirs too — harmless over-scope.
  docs:
    - "www/**"
    - "README.md"
    - "CONTRIBUTING.md"
    - "AGENTS.md"
    - "CHANGELOG.md"
    - "skills/**"
    - "contrib/**"
    - "docs/**"
    # www/generate.sh reads the release workflow (via yq) to derive the
    # quickstart install targets baked into the built docs.
    - ".github/workflows/release.yml"

  # Shared by every rule: the recipe bodies (Justfile) and the dev-shell they all
  # run in (flake.nix/flake.lock). Every formatter, linter and cargo tool comes
  # from that shell, so a toolchain or tool-set bump must re-run every gate,
  # machete included — and flake.nix is an outdatty `dev-docs` source, so keeping
  # it here stops `outdatty-check` reporting fresh after a flake.nix edit. All
  # content-hashed, so an untouched file contributes no churn.
  gates-meta:
    - "Justfile"
    - "flake.nix"
    - "flake.lock"

on_hit: "mmz: skipped {cache:command} (inputs unchanged)"

# `just ask-refactoring` is deliberately absent below, and not merely because it
# is not a gate: memoizing it would defeat it. The sweep exists to RE-OBSERVE the
# advisory signals every run, and a cache hit is exactly the answer it must never
# give. Its own re-run guard is the [views.ask-refactoring] view, not a cache.
commands:
  # Rust formatting — `cargo fmt --check` over Rust, `tombi format --check`
  # over the project config TOML, `typstyle --check` over the Typst sets. A
  # single edit to one set busts only this rule.
  - name: just fmt-check
    tags: [gate]
    inputs: [rust, rust-fmt, toml-fmt, typ-fmt, gates-meta]

  - name: just clippy
    tags: [gate]
    inputs: [rust, rust-clippy, gates-meta]

  - name: just test
    tags: [gate]
    inputs: [rust, policy, examples, gates-meta]

  # cargo-llvm-cov instruments and runs the same suite as `just test` (same
  # scope), then writes target/coverage/lcov.info — the artifact `just crap`
  # and `just ask-refactoring`'s coverage arm both read. NOT gate-tagged:
  # `just check` does not run coverage, so `mt flip`'s freshness assertion
  # must not require this rule to be fresh.
  - name: just cover
    inputs: [rust, policy, examples, gates-meta]

  - name: just machete
    tags: [gate]
    inputs: [manifests, gates-meta]

  # linecop scans `*.rs` and `*.md` (target/archive/var excluded by config).
  # `crates/**/*.rs` is the `rust` scope; the tracked `.md` files all live
  # under `docs` (README, CONTRIBUTING, AGENTS, CHANGELOG, skills/**,
  # docs/** — including docs/logo-candidates/README.md).
  - name: just check-file-size
    tags: [gate]
    inputs: [rust, file-size-config, docs, gates-meta]

  # jscpd scans `crates/` Rust only; the `-k 70` token threshold is Justfile-
  # defined, so a Justfile edit re-runs this gate.
  - name: just check-dry
    tags: [gate]
    inputs: [rust, gates-meta]

  # outdatty.check re-reads every dependent's current content and compares to
  # the lock. Every dependent lives under `rust`/`policy`/`examples`/`docs`, so
  # a dependent edit busts via those scopes; `outdatty-config` covers the lock
  # + the group config directly.
  - name: just outdatty-check
    tags: [gate]
    inputs: [outdatty-config, rust, policy, examples, docs, gates-meta]

  # `cargo run -p mindtape-cli -w examples/learn-piano check` — depends on the
  # built binary (rust) plus the fixture's task tree + project config (policy +
  # examples).
  - name: just check-examples
    tags: [gate]
    inputs: [rust, policy, examples, gates-meta]

  # Set-differences `mt _cli --json`'s reflected command names (built binary,
  # so `rust`) against www/utils/cli-notes.typ's dict keys (`docs`) — a new
  # subcommand with no matching entry fails by name. `gates-meta` because the
  # recipe body (the typst-query driver) lives in the Justfile.
  - name: just check-doc-coverage
    tags: [gate]
    inputs: [rust, docs, gates-meta]

  # docs-gen shells out to the built `mt` binary (rust) and reads the docs
  # tree + the learn-piano fixture (examples) + the project policy/prelude
  # (the generated CLI transcripts reference `mt`'s config-driven output).
  - name: just docs-check
    tags: [gate]
    inputs: [rust, policy, examples, docs, gates-meta]

  # Formatter self-test: a deliberately-mis-formatted TOML/Typst fixture must
  # be rejected by tombi/typstyle. The formatters are dev-shell-pinned, and the
  # recipe body (the bad-fixture literals) lives in the Justfile — so this rule
  # only re-runs on a Justfile or toolchain-pin edit.
  - name: just fmt-fixture-check
    tags: [gate]
    inputs: [rust, rust-fmt, gates-meta]