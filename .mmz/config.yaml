# .mmz/config.yaml — per-sub-gate memoized freshness for MindTape's close gate.
#
# `mt flip` into a terminal status runs `mmz --is-fresh --tag gate`, which
# asserts every gate-tagged rule already passed against this worktree rather
# than running any of them again. Rules here that are NOT gate-tagged are
# memoized for convenience (a future `mmz just bench` would skip on a no-op
# re-run) but stay out of the close predicate.
#
# A gate that re-runs `just check` inside `mt flip` is bad ergonomics — slow,
# at the least convenient moment, and it teaches an agent to reach for
# `--force`. Asserting a prior pass is cheap and is the predicate the review
# actually wants: proof of a passing build, not a claim of one.
#
# Record every gate pass by running `just check` itself — every arm of `just
# check` is `just mmz <subgate>`, so the underlying sub-recipe runs through mmz
# and records its outcome. `mmz --is-fresh --tag gate` then asserts all of them.
#
# NOTE ON SCOPE. `truth/tasks/**` is deliberately absent from every scope.
# `mt flip` writes the task file it is gating, so a rule keyed on those files
# would go stale the moment a status is stamped — the close gate would flip
# itself stale mid-command, and a multi-target or sequential close could never
# pass. `just fmt-check` DOES typstyle-check `truth/tasks/` (see the Justfile),
# so a full `just check` still rejects a mis-formatted task file; we just don't
# MEMOIZE that read, trading a task-file-only formatting change escaping the
# freshness shortcut for a gate that survives its own writes. Task structure is
# validated by the pre-commit hook (`cargo run -- check`), not by the gate.

scopes:
  # Everything that builds the rust crates: ALL files under crates/ — not just
  # `*.rs`. defaults.toml, frameworks.toml, the preset/axes `config.toml` and the
  # embedded template `.typ` are `include_str!`'d into the binary and asserted by
  # the test suite, so `crates/**` keeps them in the build/test freshness (a
  # `*.rs`-only glob silently dropped them). Plus the workspace manifests and the
  # rust-toolchain pin. The dev-shell toolchain (flake.nix/flake.lock) lives in
  # `gates-meta`, shared by every rule.
  rust:
    - "crates/**"
    - "Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain.toml"

  # cargo fmt's config — edits change what "formatted" means.
  rust-fmt:
    - "rustfmt.toml"

  # cargo clippy's config — edits change the lint surface.
  rust-clippy:
    - "clippy.toml"

  # Cargo manifests only — cargo-machete reads these, not sources. Includes the
  # per-crate manifests (where the `[dependencies]` machete scans actually live),
  # not just the virtual workspace root.
  manifests:
    - "Cargo.toml"
    - "Cargo.lock"
    - "crates/**/Cargo.toml"

  # Policy/config the workspace tests assert against, plus the Typst prelude
  # every task file imports (edits to lib/prelude.typ bust the test cache).
  policy:
    - ".mindtape/config.toml"
    - ".mindtape/templates/**"
    - "schema/**"
    - "lib/**"

  # TOML formatter (`just fmt-check` runs `tombi format --check` over these).
  toml-fmt:
    - ".mindtape/config.toml"
    - "examples/learn-piano/.mindtape/config.toml"
    - "examples/large/.mindtape/config.toml"

  # Typst formatter (`just fmt-check` runs `typstyle --check` over these).
  # `truth/tasks/**` is intentionally NOT listed (see NOTE ON SCOPE): the gate
  # must survive `mt flip`'s own writes to that tree.
  typ-fmt:
    - "lib/**"
    - "examples/learn-piano/tasks/**"
    - "examples/learn-piano/.mindtape/templates/**"
    - "www/content/**"
    - "www/templates/**"
    - "www/utils/**"
    - "docs/src/**"

  # linecop config — a limit change busts the file-size gate.
  file-size-config:
    - ".linecop.yaml"

  # outdatty's own config + lock. The dependents outdatty re-reads are already
  # covered by the `rust`/`policy`/`examples`/`docs` scopes (outdatty.lock
  # hashes their content), so a dependent edit busts via those scopes, and a
  # raw lock/config edit busts here.
  outdatty-config:
    - "outdatty.yaml"
    - "outdatty.lock"

  # The example projects `just check-examples` validates — keep this list and
  # that recipe in step. A fixture outside the scope goes false-fresh and stops
  # being gated, which is how the skill's previous eval fixture rotted through
  # two config migrations unnoticed. Deliberately not a `examples/*` glob:
  # examples/large/ is a generated, gitignored benchmark fixture that the recipe
  # does not check, and its 2000 task files would churn this rule for nothing.
  examples:
    - "examples/learn-piano/**"
    - "examples/minimal/**"

  # The docs tree `just docs::check` builds and validates (tola + pagefind +
  # validate) plus the mirrored docs whose drift outdatty gates. `docs/**`
  # covers the frozen decisions and redesign subdirs too — harmless over-scope.
  docs:
    - "www/**"
    - "README.md"
    - "CONTRIBUTING.md"
    - "AGENTS.md"
    - "CHANGELOG.md"
    - "skills/**"
    - "contrib/**"
    - "docs/**"
    # www/generate.sh reads the release workflow (via yq) to derive the
    # quickstart install targets baked into the built docs.
    - ".github/workflows/release.yml"

  # The coverage artifact `just check-crap` measures. This scope is the reason
  # that arm can be memoized at all: it is a build artifact under git-ignored
  # `target/`, in none of the scopes above, and a rule that cannot name its
  # input records "I could not measure" as a pass whose digest never moves when
  # the artifact appears — the exact false-fresh the comments above keep
  # arguing against, and why that arm ran unwrapped for as long as it did.
  #
  # What actually unblocked it was naming the artifact at all, NOT the
  # `gitignore: false` below. Measured on mmz 0.6.0, and recorded here because
  # the tidy story is the wrong one: a wildcard pattern
  # (`target/coverage/*.info`) is walked, so the filter applies and it yields
  # nothing under `gitignore: true`; the wildcard-free path below is stat-ed
  # instead of walked, so it yields the lcov under either setting.
  #
  # The key stays for two reasons that do not depend on that. This scope's
  # correctness must not rest on the glob never gaining a wildcard, and a scope
  # whose whole subject is ignored paths should say so. It belongs on the scope
  # rather than the manifest: flipping the top-level key would walk all of
  # `target/` and the 2000 generated files under `examples/large/` the
  # `examples` scope exists to keep out of every rule.
  #
  # A glob matching nothing is legal and is the point — absent and present are
  # different input states, so `just check-crap` skips loudly while no lcov
  # exists and goes stale the moment `just cover` writes one.
  lcov:
    gitignore: false
    globs:
      - "target/coverage/lcov.info"

  # The ratchet baseline `just crap`'s second pass scores against
  # (`--baseline`, in .just/scripts/crap.sh). A root JSON file no other scope
  # covers, and `just crap-baseline` re-mints it without necessarily touching a
  # source — so without this the check-crap record taken against the old
  # baseline would stay fresh and the ratchet would never be re-evaluated
  # against the new one. Same class of hole as the Typst half of
  # check-file-size below, found by writing the input list rather than by a
  # gate going quiet.
  crap-baseline:
    - "crap-baseline.json"

  # Shared by every rule: the recipe bodies the two justfiles still hold inline
  # (Justfile, and .just/docs.just — the `docs` module Justfile splits recipe
  # bodies into, per truth/tasks/split-the-justfile-into-modules.typ) and the
  # dev-shell they all run in (flake.nix/flake.lock). Every formatter, linter
  # and cargo tool comes from that shell, so a toolchain or tool-set bump must
  # re-run every gate, machete included — and flake.nix is an outdatty
  # `dev-docs` source, so keeping it here stops `outdatty-check` reporting fresh
  # after a flake.nix edit. All content-hashed, so an untouched file contributes
  # no churn.
  #
  # `.just/scripts/**` was here too until truth/tasks/split-gates-meta-into-per-
  # script-scopes.typ; it is enumerated one scope per script below. What that
  # bought, and what it cost, are argued there.
  gates-meta:
    - "Justfile"
    - ".just/docs.just"
    - "flake.nix"
    - "flake.lock"

  # The manifest itself, for the one rule whose SUBJECT it is
  # (`just script-scope-check`, below). No other rule names it: mmz already
  # keys a record on that rule's own declared inputs, so an input-list edit
  # invalidates the rule it edits without help. What that does NOT cover is a
  # rule reading the file as data, which is exactly what script-scope-check
  # does.
  mmz-config:
    - ".mmz/config.yaml"

  # The whole script directory as a SET, for the three rules whose subject is
  # the directory rather than one body in it: `check-file-size` (linecop scans
  # every .sh under it — `include_hidden: true` in .linecop.yaml), `outdatty-
  # check` (every script is a `dev-docs` source, so every script's content is
  # compared against outdatty.lock) and `script-scope-check` (whose whole job
  # is the set difference below). All three are sub-second, so the churn a glob
  # costs here is the churn worth paying; the rules that read ONE body
  # take that body's own scope instead.
  #
  # A glob, deliberately, and it is the only one left over this directory: a
  # rule that has to notice a script ARRIVING cannot be given an enumeration,
  # because the file it must react to is by definition the one nobody listed.
  # It does not weaken the check it feeds — script-scope-check counts only
  # wildcard-free literal paths as "naming" a script, so re-adding a glob (here
  # or anywhere else) satisfies nothing and the unlisted script still fails by
  # name.
  scripts-all:
    - ".just/scripts/**"

  # ONE SCOPE PER SCRIPT, from here down (truth/tasks/split-gates-meta-into-per-
  # script-scopes.typ). Each is named by the rule (or rules) that actually run
  # or read that body, and by nothing else. Before this, all of them sat in
  # `gates-meta` as a `.just/scripts/**` glob shared by every rule, so editing
  # check-crap.sh re-ran clippy, the full test suite, the docs build and
  # every other rule that never opens it.
  #
  # WHAT THE GLOB BOUGHT, and this enumeration gives up: the directory is
  # recipe bodies by construction, so a body extracted out of the Justfile was
  # covered by ARRIVING rather than by someone remembering to wire it up. An
  # unlisted script is invisible — its rule serves a stale hit against a body it
  # never hashed — and that is the same false-fresh every comment in this file
  # argues against. The price is paid by a check rather than by care: `just
  # script-scope-check` set-differences the files on disk against the literal
  # paths named here and fails naming any script no scope lists. Without that
  # arm this split would be a net loss.
  #
  # NAMING is mechanical so the next one has an unambiguous place to land:
  # `script-` plus the script's stem, a leading underscore dropped
  # (`_lcov-stale-reason.sh` → `script-lcov-stale-reason`). The check does not
  # read the name — it matches on the path — so a convention is all it is.
  #
  # FIVE OF THEM ARE NAMED BY NO RULE, and that is the honest state rather than
  # an oversight: crap-baseline.sh, install-lib.sh, release.sh, fork.sh and
  # _mutants-env.sh are bodies of recipes no rule in `commands` wraps
  # (`just crap-baseline`, `just install-lib`, `just release`, `just fork`, and
  # the preamble mutants.sh/mutants-diff.sh source). They still get a scope,
  # because the check demands every script be named, and they are still gated
  # for size and drift through `scripts-all` above. A scope with no reader is the visible
  # form of "no memoized rule reads this"; deleting it would only hide that.
  script-arg-pattern-check:
    - ".just/scripts/arg-pattern-check.sh"
  script-check-crap:
    - ".just/scripts/check-crap.sh"
  script-check-doc-coverage:
    - ".just/scripts/check-doc-coverage.sh"
  script-check-doc-facts:
    - ".just/scripts/check-doc-facts.sh"
  script-check-doc-recipes:
    - ".just/scripts/check-doc-recipes.sh"
  script-cover:
    - ".just/scripts/cover.sh"
  script-crap:
    - ".just/scripts/crap.sh"
  script-crap-baseline:
    - ".just/scripts/crap-baseline.sh"
  script-crap-baseline-check:
    - ".just/scripts/crap-baseline-check.sh"
  script-docs-md-check:
    - ".just/scripts/docs-md-check.sh"
  script-fmt-fixture-check:
    - ".just/scripts/fmt-fixture-check.sh"
  script-fork:
    - ".just/scripts/fork.sh"
  script-install-lib:
    - ".just/scripts/install-lib.sh"
  script-lcov-stale-reason:
    - ".just/scripts/_lcov-stale-reason.sh"
  script-mutants:
    - ".just/scripts/mutants.sh"
  script-mutants-diff:
    - ".just/scripts/mutants-diff.sh"
  script-mutants-env:
    - ".just/scripts/_mutants-env.sh"
  script-nav-diff:
    - ".just/scripts/_nav-diff.sh"
  script-positional-args-check:
    - ".just/scripts/positional-args-check.sh"
  script-release:
    - ".just/scripts/release.sh"
  script-script-attr-check:
    - ".just/scripts/script-attr-check.sh"
  script-script-scope-check:
    - ".just/scripts/script-scope-check.sh"
  script-site-pages-fixture-check:
    - ".just/scripts/site-pages-fixture-check.sh"
  script-size-fixture-check:
    - ".just/scripts/size-fixture-check.sh"

on_hit: "mmz: skipped {cache:command} (inputs unchanged)"

# `just ask-refactoring` is deliberately absent below, and not merely because it
# is not a gate: memoizing it would defeat it. The sweep exists to RE-OBSERVE the
# advisory signals every run, and a cache hit is exactly the answer it must never
# give. Its own re-run guard is the [views.ask-refactoring] view, not a cache.
commands:
  # Rust formatting — `cargo fmt --check` over Rust, `tombi format --check`
  # over the project config TOML, `typstyle --check` over the Typst sets. A
  # single edit to one set busts only this rule.
  - name: just fmt-check
    tags: [gate]
    inputs: [rust, rust-fmt, toml-fmt, typ-fmt, gates-meta]

  - name: just clippy
    tags: [gate]
    inputs: [rust, rust-clippy, gates-meta]

  - name: just test
    tags: [gate]
    inputs: [rust, policy, examples, gates-meta]

  # cargo-llvm-cov instruments and runs the same suite as `just test` (same
  # scope), then writes target/coverage/lcov.info — the artifact `just crap`
  # and `just ask-refactoring`'s coverage arm both read. NOT gate-tagged:
  # `just check` does not run coverage, so `mt flip`'s freshness assertion
  # must not require this rule to be fresh.
  - name: just cover
    inputs: [rust, policy, examples, gates-meta, script-cover]

  - name: just machete
    tags: [gate]
    inputs: [manifests, gates-meta]

  # linecop scans every language `.linecop.yaml` gives a base limit — Rust,
  # Markdown, Shell and Typst (target/archive/var excluded by config) — so the
  # input list has to cover all four, not the two it named while the config
  # had grown past them. `crates/**/*.rs` is `rust`; the tracked `.md` files
  # and the `www/`+`contrib/` shell live under `docs`; `.just/scripts/*.sh` is
  # `scripts-all` — the whole directory, not one body, because linecop scans
  # every file in it and an oversized script the input list never named would
  # go false-fresh here exactly as an unscanned directory did before
  # `include_hidden`. `policy` and `examples` are the Typst half — `lib/**`,
  # `.mindtape/templates/**` and the learn-piano fixture's task tree and
  # template — and were the live hole: a Typst file could cross its cap and
  # this rule would still report fresh. `include_hidden: true` widened it
  # (`.mindtape/templates/**` only entered the scan with that key), which is
  # what surfaced it.
  - name: just check-file-size
    tags: [gate]
    inputs: [rust, policy, examples, file-size-config, docs, gates-meta, scripts-all]

  # jscpd scans `crates/` Rust only; the `-k 70` token threshold is Justfile-
  # defined, so a Justfile edit re-runs this gate.
  - name: just check-dry
    tags: [gate]
    inputs: [rust, gates-meta]

  # outdatty.check re-reads every dependent's current content and compares to
  # the lock. Every dependent lives under `rust`/`policy`/`examples`/`docs`, so
  # a dependent edit busts via those scopes; `outdatty-config` covers the lock
  # + the group config directly. `scripts-all` rather than one script's scope:
  # every file in .just/scripts/ is a `dev-docs` SOURCE (outdatty.yaml lists
  # them one by one, for its own reasons), so this rule reads the whole
  # directory and a per-body scope would leave the rest false-fresh.
  - name: just outdatty-check
    tags: [gate]
    inputs: [outdatty-config, rust, policy, examples, docs, gates-meta, scripts-all]

  # `cargo run -p mindtape-cli -w examples/learn-piano check` — depends on the
  # built binary (rust) plus the fixture's task tree + project config (policy +
  # examples).
  - name: just check-examples
    tags: [gate]
    inputs: [rust, policy, examples, gates-meta]

  # Set-differences `mt _cli --json`'s reflected command names (built binary,
  # so `rust`) against www/utils/cli-notes.typ's dict keys (`docs`) — a new
  # subcommand with no matching entry fails by name. The recipe body (the
  # typst-query driver) is .just/scripts/check-doc-coverage.sh, so that one
  # script's scope — not the directory — plus `gates-meta` for the Justfile
  # line that invokes it and the dev shell it runs in.
  - name: just check-doc-coverage
    tags: [gate]
    inputs: [rust, docs, gates-meta, script-check-doc-coverage]

  # Regenerates its own facts (www/generate-facts.sh reads Cargo.toml/Cargo.lock/
  # rust-toolchain.toml — `rust` — plus lib/prelude.typ/lib/typst.toml —
  # `policy` — and .linecop.yaml — `file-size-config`) then set-differences
  # crate-map.json/dsl-fields.json against the two prose dicts under
  # www/utils/ (`docs`). `script-check-doc-facts` is the recipe body;
  # `gates-meta` carries the gate-table shape www/generate-facts.sh's
  # gates.json reads back out of the Justfile. `script-nav-diff` is wired by
  # hand for check-crap's reason: check-doc-facts.sh's NAV arm now shells out
  # to .just/scripts/_nav-diff.sh directly, and script-scope-check's arm two
  # only proves what a recipe's OWN body names, not a script another script
  # calls — the same nested-call blind spot as check-crap's `just crap`.
  - name: just check-doc-facts
    tags: [gate]
    inputs: [rust, policy, file-size-config, docs, gates-meta, script-check-doc-facts, script-nav-diff]

  # Scans docs/src/**/*.typ and www/content/*.typ for a hand-typed `just
  # <recipe>` mention that skips www/generated/just.typ (`docs`) against the
  # recipe/alias names `just --dump` reflects (`gates-meta`, the Justfile it
  # dumps) — plus its own body's scope. No `rust` input, this never touches the
  # built binary.
  - name: just check-doc-recipes
    tags: [gate]
    inputs: [docs, gates-meta, script-check-doc-recipes]

  # docs::gen shells out to the built `mt` binary (rust) and reads the docs
  # tree + the learn-piano fixture (examples) + the project policy/prelude
  # (the generated CLI transcripts reference `mt`'s config-driven output).
  - name: just docs::check
    tags: [gate]
    inputs: [rust, policy, examples, docs, gates-meta]

  # Regenerates every docs/src/*.typ source (after www/generate-facts.sh, same
  # as check-doc-facts) with typlite into a temp dir, then diffs each against
  # the committed file at its declared output path (AGENTS.md today).
  # `rust`+`policy`+`file-size-config` because a source may read
  # www/generated/{crate-map,dsl-fields,linecop-caps}.json, and those scopes
  # cover THAT json's own sources; `docs` because docs/src/** and every output
  # path it writes both sit under it. `gates-meta` because typlite is a
  # flake.nix devShell addition, and `script-docs-md-check` for the recipe
  # body itself.
  - name: just docs::md-check
    tags: [gate]
    inputs: [rust, policy, file-size-config, docs, gates-meta, script-docs-md-check]

  # Formatter self-test: a deliberately-mis-formatted TOML/Typst fixture must
  # be rejected by tombi/typstyle. The formatters are dev-shell-pinned, and the
  # recipe body (the bad-fixture literals) is
  # .just/scripts/fmt-fixture-check.sh — so this rule only re-runs on a recipe-
  # body or toolchain-pin edit.
  - name: just fmt-fixture-check
    tags: [gate]
    inputs: [rust, rust-fmt, gates-meta, script-fmt-fixture-check]

  # Dispatch-only self-test: the `[arg(...)]` patterns on
  # `release`/`bench`/`gen-bench`/`eject` and on `ask-refactoring`'s five
  # thresholds must reject a known-bad value and accept a known-good one, and
  # every declared default must satisfy its own pattern. Every check the script runs
  # is `just --dry-run --yes <recipe> <value>` against THIS Justfile, so
  # `gates-meta` (the two justfiles + the dev-shell pin) plus this script's own
  # scope is the whole input — no rust build, no task tree, and no other
  # script, since dry-run means no recipe body executes at all.
  - name: just arg-pattern-check
    tags: [gate]
    inputs: [gates-meta, script-arg-pattern-check]

  # Static self-test: `test`/`build`/`mutants`/`mutants-diff` must carry
  # `[positional-arguments]` and forward "$@", never interpolate
  # `{{ ARGS }}`/`{{ args }}` into the body. Read from `just --dump --dump-
  # format json` plus a grep of the scripts those recipes forward into
  # (.just/scripts/mutants.sh, .just/scripts/mutants-diff.sh) — no rust build,
  # no task tree, nothing a static read of the Justfile and three scripts does
  # not already cover. Those two forwarded-into scripts are the reason this
  # rule names three script scopes rather than one: a rule may READ a body it
  # does not run, and a grep target left out of the input list goes false-fresh
  # exactly as an unhashed recipe body would.
  #
  # `ask-refactoring` was the fifth recipe here until its flags became declared
  # parameters (truth/tasks/derive-the-ask-refactoring-flag-table-from-arg-
  # attributes.typ). Dropping it also closed a real scope hole: the script
  # grepped contrib/ask-refactoring.sh, which no scope below covers, so an edit
  # there could serve a stale hit on this rule.
  - name: just positional-args-check
    tags: [gate]
    inputs: [gates-meta, script-positional-args-check, script-mutants, script-mutants-diff]

  # Static self-test plus a synthesized probe: no recipe body may open with a
  # `#!` shebang (read from `just --dump --dump-format json`, walking modules),
  # and every justfile's own `set script-interpreter` must abort a failed
  # pipeline — proven by running a `false | true` probe under a replica
  # justfile carrying that file's setting line verbatim, never by matching its
  # text. Both subjects are the two justfiles and the script itself, so
  # `gates-meta` plus this script's own scope is the whole input, same shape as
  # the two rules above; the probe runs in a temp dir and reads nothing else,
  # and the `bash` it resolves comes from the dev shell `gates-meta` pins.
  - name: just script-attr-check
    tags: [gate]
    inputs: [gates-meta, script-script-attr-check]

  # Scan-scope self-test: an oversized shell script at `.just/scripts/` inside
  # a replica tree must be reported by linecop reading this repo's config, and
  # must go unreported with `include_hidden` deleted. `file-size-config` is the
  # subject — the assertion is about that file's scan scope, so a config edit
  # must re-run it — `script-size-fixture-check` is the body, and `gates-meta`
  # carries the dev-shell pin linecop itself comes from. No `rust`, no `docs`,
  # and no `scripts-all` either: the replica holds one synthesized file and the
  # scan never touches the real directory, which is the whole reason it is a
  # replica.
  - name: just size-fixture-check
    tags: [gate]
    inputs: [file-size-config, gates-meta, script-size-fixture-check]

  # The cheap CRAP arm: `just _lcov-stale-reason` decides, then either `just
  # crap` scores or the arm skips loudly and exits 0. It ran unwrapped until
  # mmz could name a git-ignored path, because memoizing a skip that could not
  # see the artifact is worse than not memoizing at all; the `lcov` scope above
  # is what closed that, so the recorded verdict — pass or skip — dies the
  # moment the artifact it read (or could not read) changes state. `rust`
  # because the staleness test compares `crates/**/*.rs` mtimes against the
  # lcov and `cargo crap` scores those same sources, `crap-baseline` because
  # the ratchet pass reads it, and `gates-meta` for the CRAP_EXCLUDES list the
  # scripts are handed and the cargo-crap pin they run from.
  #
  # THREE script scopes, because this arm runs three bodies, not one:
  # check-crap.sh shells out to `just _lcov-stale-reason` and then to `just
  # crap`. `script-scope-check` only proves the DIRECT invocation — the body
  # the recipe names — so the other two are wired by hand here and stay a
  # reading exercise; a body reached through a nested `just` is the one case
  # that check cannot derive.
  - name: just check-crap
    tags: [gate]
    inputs: [rust, crap-baseline, lcov, gates-meta, script-check-crap, script-crap, script-lcov-stale-reason]

  # The other half of the CRAP pair, and the half that is always correct: a
  # static read of the committed baseline, refusing a machine-local path or an
  # empty entry list. Two inputs and no `rust`, because nothing about a source
  # edit changes the verdict — the subject is the JSON file, not the code it
  # scores. `gates-meta` is the dev shell jq comes from.
  - name: just crap-baseline-check
    tags: [gate]
    inputs: [crap-baseline, gates-meta, script-crap-baseline-check]

  # The arm that pays for the enumeration above (truth/tasks/split-gates-meta-
  # into-per-script-scopes.typ): set-differences the `.just/scripts/*.sh` files
  # on disk against the literal paths the scopes name, then cross-checks that
  # every rule here whose recipe body invokes a script names that script's
  # scope. `mmz-config` is the manifest it reads; `scripts-all` is the
  # directory listing — a GLOB on purpose, since the file this rule must react
  # to is by definition the one no scope lists yet, and an enumeration could
  # not see it arrive; `script-script-scope-check` is its own body, and
  # `gates-meta` is the Justfile it dumps plus the dev shell yq/jq come from.
  # `outdatty-config` arrived with arm three (truth/tasks/fail-a-half-wired-
  # gate-arm-at-the-wiring-it-is-missing.typ): that arm reads outdatty.yaml's
  # `dev-docs` sources, so a script dropped from that list must bust this rule.
  # Without it the arm would report a verdict over a file it never hashed —
  # the same false-fresh the arms themselves exist to refuse.
  - name: just script-scope-check
    tags: [gate]
    inputs: [mmz-config, outdatty-config, scripts-all, script-script-scope-check, gates-meta]

  # Replica-tree self-test for the docs manifest gate: two pages declaring the
  # same route and a page with no `<page-meta>` block both drive a `cp -r
  # www` copy of www/generate-site-pages.sh (`docs`, since the fixture is
  # built from the real www/content/**), and a page missing from NAV drives
  # `.just/scripts/_nav-diff.sh` directly against a synthetic pair of route
  # lists — wired here by hand for the same nested-call reason
  # `script-nav-diff` is wired onto `just check-doc-facts` above, since
  # script-scope-check's arm two cannot see a script calling another script.
  # `script-site-pages-fixture-check` is its own body, `gates-meta` the dev
  # shell typst/jq come from.
  - name: just site-pages-fixture-check
    tags: [gate]
    inputs: [docs, gates-meta, script-site-pages-fixture-check, script-nav-diff]