# .mmz/config.yaml — per-sub-gate memoized freshness for Mindtape's close gate.
#
# `mt flip` into a terminal status runs `mmz --is-fresh --tag gate`, which
# asserts every gate-tagged rule already passed against this worktree rather
# than running any of them again. Rules here that are not gate-tagged are
# memoized for convenience (a `mmz just bench` would skip on a no-op re-run)
# but stay out of the close predicate.
#
# A gate that re-runs `just check` inside `mt flip` is slow, runs at the least
# convenient moment, and teaches an agent to reach for `--force`. Asserting a
# prior pass is cheap and is the predicate the review wants: proof of a passing
# build, not a claim of one.
#
# `just check` records every gate pass. Every arm of `just check` is
# `just mmz <subgate>`, so the underlying sub-recipe runs through mmz and
# records its outcome. `mmz --is-fresh --tag gate` then asserts all of them.
#
# Note on scope. `truth/tasks/**` is absent from every scope. `mt flip` writes
# the task file it is gating, so a rule keyed on those files would go stale the
# moment a status is stamped. The close gate would flip itself stale
# mid-command, and a multi-target or sequential close could never pass.
# `just fmt-check` typstyle-checks `truth/` (see the Justfile), so a full
# `just check` still rejects a mis-formatted task file. Only the memoization of
# that read is given up: a task-file-only formatting change escapes the
# freshness shortcut, in return for a gate that survives its own writes. Task
# structure is validated by the pre-commit hook (`cargo run -- check`), not by
# the gate.

scopes:
  # Everything that builds the rust crates: every file under crates/, not just
  # `*.rs`. defaults.toml, frameworks.toml, the preset/axes `config.toml` and the
  # embedded template `.typ` are `include_str!`'d into the binary and asserted by
  # the test suite, so `crates/**` keeps them in the build/test freshness (a
  # `*.rs`-only glob would leave them out). Plus the workspace manifests and the
  # rust-toolchain pin. The dev-shell toolchain (flake.nix/flake.lock) lives in
  # `gates-meta`, shared by every rule.
  rust:
    - "crates/**"
    - "Cargo.toml"
    - "Cargo.lock"
    - "rust-toolchain.toml"

  # cargo fmt's config — edits change what "formatted" means.
  rust-fmt:
    - "rustfmt.toml"

  # cargo clippy's config — edits change the lint surface.
  rust-clippy:
    - "clippy.toml"

  # Cargo manifests only — cargo-machete reads these, not sources. Includes the
  # per-crate manifests (where the `[dependencies]` machete scans actually live),
  # not just the virtual workspace root.
  manifests:
    - "Cargo.toml"
    - "Cargo.lock"
    - "crates/**/Cargo.toml"

  # Policy/config the workspace tests assert against, plus the Typst prelude
  # every task file imports (edits to lib/prelude.typ bust the test cache).
  policy:
    - ".mindtape/config.toml"
    - ".mindtape/templates/**"
    - "schema/**"
    - "lib/**"

  # TOML formatter (`just fmt-check` runs `tombi format --check` over every
  # tracked `*.toml`, TOML_FMT_PATHS). What `rust`, `rust-fmt`, `rust-clippy`,
  # `typ-fmt` and the `crates/**` glob already hash is not repeated here;
  # `tombi.toml` is its config, so an edit changes what "formatted" means.
  toml-fmt:
    - "tombi.toml"
    - ".cargo/mutants.toml"
    - ".config/nextest.toml"
    - ".config/wt.toml"
    - ".gitleaks.toml"
    - ".mindtape/config.toml"
    - "clippy.toml"
    - "examples/*/.mindtape/config.toml"
    - "examples/across-projects/.config/mindtape/at.toml"
    - "examples/across-projects/projects/*/.mindtape/config.toml"
    - "www/tola.toml"

  # Every `*.toml` in the tree, for `just check-gate-drift`: the arm compares
  # TOML_FMT_PATHS to the TOML files git lists, and a new file can appear
  # anywhere. `toml-fmt` above lists what the formatter reads, which is the
  # list under test, so it cannot stand in. mmz walks untracked files and drops
  # ignored ones, the same split `git ls-files --cached --others
  # --exclude-standard` draws.
  toml-all:
    - "**/*.toml"

  # Typst formatter (`just fmt-check` runs `typstyle --check` over these).
  # `truth/tasks/**` is not listed (see "Note on scope"): the gate must survive
  # `mt flip`'s own writes to that tree. The shared `truth/*.typ` files beside
  # it are no task, so they are listed.
  typ-fmt:
    - "lib/**"
    - "truth/*.typ"
    - "examples/api-service/tasks/**"
    - "examples/api-service/.mindtape/templates/**"
    - "examples/derived-tags/api/**"
    - "examples/derived-tags/web/**"
    - "examples/links/tasks/**"
    - "examples/named-sets/tasks/**"
    - "examples/priority/tasks/**"
    - "examples/recurring/tasks/**"
    - "examples/round-trip/tasks/**"
    - "examples/dsl/tasks/**"
    - "examples/rules/**"
    - "examples/statuses/tasks/**"
    - "examples/across-projects/projects/*/tasks/**"
    - "examples/lsp/**"
    - "www/content/**"
    - "www/templates/**"
    - "www/utils/**"
    - "docs/src/**"

  # linecop config — a limit change busts the file-size gate.
  file-size-config:
    - ".linecop.yaml"

  # gitleaks' ruleset for this repo — the default rules and one allowlist.
  # An edit changes what `just check-secrets` can find, so it busts that rule
  # the way .linecop.yaml busts the size gate.
  secrets-config:
    - ".gitleaks.toml"

  # Everything `just check-secrets` reads, which is the whole tracked tree:
  # a credential can land in any file, so no narrower list would cover it.
  # It is an enumeration because `truth/tasks/**` must stay out (see "Note on
  # scope" above: `mt flip` writes the task file it is gating), mmz has no
  # negative glob, and `**` minus one directory is therefore a list of what is
  # left. Those task files are still scanned. The read is just not memoized,
  # as `just fmt-check` already does over the same directory.
  #
  # The enumeration fails when a top-level directory appears that nobody adds
  # here: the scope goes false-fresh with a whole subtree unhashed. Arm three
  # of .just/scripts/check-secrets.sh refuses that. It set-differences
  # `git ls-files` against mmz's own expansion of this scope and fails naming
  # the uncovered files. So a missing line below turns the gate red, and
  # adding the line it names fixes it.
  secrets-tree:
    - "*"
    - ".cargo/**"
    - ".config/**"
    - ".githooks/**"
    - ".github/**"
    - ".just/**"
    - ".mindtape/**"
    - ".mmz/**"
    - "contrib/**"
    - "crates/**"
    - "docs/**"
    - "examples/**"
    - "lib/**"
    - "schema/**"
    - "skills/**"
    - "www/**"

  # outdatty's own config + lock. The dependents outdatty re-reads are already
  # covered by the `rust`/`policy`/`examples`/`docs` scopes (outdatty.lock
  # hashes their content), so a dependent edit busts via those scopes, and a
  # raw lock/config edit busts here.
  outdatty-config:
    - "outdatty.yaml"
    - "outdatty.lock"

  # The example projects `just check-examples` validates. Keep this list and
  # that recipe in step: a fixture outside the scope goes false-fresh and stops
  # being gated without anyone noticing. It is not an `examples/*` glob,
  # because examples/large/ is a generated, gitignored benchmark fixture that
  # the recipe does not check, and its 2000 task files would churn this rule
  # for nothing.
  # www/capture.sh joins because it declares the api-service clock, which
  # crates/mindtape-cli/tests/it/eval_fixture_e2e.rs reads, so a clock edit re-runs
  # the test.
  examples:
    - "www/capture.sh"
    - "examples/minimal/**"
    - "examples/links/**"
    - "examples/estimates/**"
    - "examples/dsl/**"
    - "examples/statuses/**"
    - "examples/rules/**"
    - "examples/api-service/**"
    - "examples/derived-tags/**"
    - "examples/round-trip/**"
    - "examples/named-sets/**"
    - "examples/priority/**"
    - "examples/recurring/**"
    - "examples/task-files/**"
    - "examples/across-projects/**"

  # Every example project's config, for `just check-doc-spans`: their status
  # legends are the status verbs a doc may write as `mt <status>`. The
  # `examples` scope names only the gated fixtures.
  example-configs:
    - "examples/*/.mindtape/**"

  # The docs tree `just docs::check` builds and validates (tola + pagefind +
  # validate) plus the mirrored docs whose drift outdatty gates. `docs/**`
  # covers the frozen decisions and redesign subdirs too — harmless over-scope.
  docs:
    - "www/**"
    - "README.md"
    - "CONTRIBUTING.md"
    - "AGENTS.md"
    - "CHANGELOG.md"
    - "skills/**"
    - "contrib/**"
    - "docs/**"
    # www/generate.sh reads the release workflow (via yq) to derive the
    # quickstart install targets baked into the built docs.
    - ".github/workflows/release.yml"
    # Quoted verbatim by www/content/rule-packs.typ, copied into
    # www/generated/ by www/generate-rule-packs.sh; lives under crates/, so
    # no glob above already covers it.
    - "crates/mindtape/src/packs/mindtape-tasks.toml"
    # Quoted verbatim by www/content/self-validating-tasks.typ and captured
    # (a deliberately failing `mt check`) by www/generate.sh. Not in the
    # `examples` scope above: that one is `just check-examples`'s validated
    # set, and this fixture is never meant to pass it.
    - "examples/self-validating/**"

  # The coverage artifact `just crap` scores. This scope is what lets that
  # rule be memoized: the artifact is a build output under git-ignored
  # `target/`, in none of the scopes above, and a rule that cannot name its
  # input records "I could not measure" as a pass whose digest never moves when
  # the artifact appears. That is the false-fresh the comments above argue
  # against.
  #
  # Naming the artifact is what makes the scope work. The `gitignore: false`
  # below is secondary. Measured on mmz 0.6.0: a wildcard pattern
  # (`target/coverage/*.info`) is walked, so the gitignore filter applies and it
  # yields nothing under `gitignore: true`. The wildcard-free path below is
  # stat-ed instead of walked, so it yields the lcov under either setting.
  #
  # The key stays for two reasons that do not depend on that. This scope's
  # correctness must not rest on the glob never gaining a wildcard, and a scope
  # whose whole subject is ignored paths should say so. The key sits on the
  # scope because a top-level `gitignore: false` would walk all of `target/` and
  # the 2000 generated files under `examples/large/` that the `examples` scope
  # keeps out of every rule.
  #
  # A glob matching nothing is legal and intended: absent and present are
  # different input states, so a `just crap` record goes stale the moment
  # `just cover` writes a new lcov.
  lcov:
    gitignore: false
    globs:
      - "target/coverage/lcov.info"

  # The ratchet baseline `just crap`'s second pass scores against
  # (`--baseline`, in .just/scripts/crap.sh). It is a root JSON file no other
  # scope covers, and `just crap-baseline` re-mints it without necessarily
  # touching a source. Without this scope, the `just crap` record taken against
  # the old baseline would stay fresh and the ratchet would never be
  # re-evaluated against the new one. The Typst half of check-file-size below
  # has the same gap.
  crap-baseline:
    - "crap-baseline.json"

  # Shared by every rule: the recipe bodies the two justfiles hold inline
  # (Justfile, and .just/docs.just, the `docs` module that Justfile splits
  # recipe bodies into) and the dev shell they all run in (flake.nix and
  # flake.lock). Every formatter, linter and cargo tool comes from that shell,
  # so a toolchain or tool-set bump must re-run every gate, machete included.
  # flake.nix is a source of the outdatty `dev-shell-docs` group, so listing it here stops
  # `outdatty-check` reporting fresh after a flake.nix edit. All files are
  # content-hashed, so an untouched file contributes no churn.
  #
  # `.just/scripts/**` is not in this scope. It is enumerated one scope per
  # script below.
  #
  # `.config/nextest.toml` counts as a recipe body here. `status-level` lives
  # there rather than in the `test` recipe because `cargo llvm-cov nextest`
  # accepts the flag and ignores it, so the file decides what the suite prints
  # and, if it gains retries, a test-thread count or a default filter, what the
  # suite runs. Without it here, every memoized `just test` and `just cover`
  # record survives an edit to it.
  # Every tracked shell script, for `just shellcheck`, which lints each file
  # whose first line is a shell shebang. `**/*.sh` is the extension, `.githooks`
  # holds the hooks (no extension) and `examples/*/scripts` the fixture
  # projects' own. A glob, so a script added there is read as soon as it exists.
  # A shebang script elsewhere without `.sh` is linted when the gate runs, but
  # a change to it alone leaves the gate fresh, so give such a script an
  # extension. `.shellcheckrc` sets what shellcheck follows and reports.
  shell-scripts:
    - "**/*.sh"
    - ".githooks/**"
    - "examples/*/scripts/*"
    - ".shellcheckrc"

  # The GitHub workflows. tests/it/release_workflow_e2e.rs runs a step of
  # release.yml, so the suite reads them, and actionlint lints them all.
  workflows:
    - ".github/workflows/**"

  gates-meta:
    - "Justfile"
    - ".config/nextest.toml"
    - ".just/docs.just"
    - "flake.nix"
    - "flake.lock"

  # The clones `just check-dry` tolerates. Re-minting it changes what the gate
  # lets through, so it is that gate's input.
  dry-baseline:
    - ".jscpd-baseline.json"

  # The outdatty.yaml sources and dependents that no other scope holds, for
  # `just outdatty-check`. The rule compares every listed file to outdatty.lock,
  # so a listed file outside its inputs goes false-fresh when it changes.
  # `just script-scope-check` (arm four) fails by name on a listed file that
  # the rule's scopes miss, so a new outdatty source is added here or to a scope
  # the rule already takes.
  outdatty-sources:
    - ".config/wt.toml"
    - ".gitattributes"
    - ".githooks/commit-msg"
    - ".githooks/local-paths"
    - ".githooks/pre-commit"
    - "release.toml"

  # The manifest itself, for the one rule that reads it as data
  # (`just script-scope-check`, below). No other rule names it: mmz already
  # keys a record on a rule's own declared inputs, so an input-list edit
  # invalidates the rule it edits without help. That does not cover a rule that
  # reads the file as data, and script-scope-check is that rule.
  mmz-config:
    - ".mmz/config.yaml"

  # The whole script directory as a set, for the four rules whose subject is
  # the directory rather than one body in it: `check-file-size` (linecop scans
  # every .sh under it, since .linecop.yaml sets `include_hidden: true`),
  # `outdatty-check` (every script is a source of some group, so every script's
  # content is compared against outdatty.lock), `check-gate-drift` (which walks
  # the call graph out of `check` and reads every script it reaches, so a new
  # script is read as soon as it exists) and `script-scope-check` (which takes
  # the set difference below). All four take seconds at most, so the churn a
  # glob costs here is worth paying. A rule that reads one body takes that
  # body's own scope instead.
  #
  # It is the only glob over this directory. A rule that has to notice a new
  # script cannot be given an enumeration, because the file it must react to is
  # by definition the one nobody listed. The glob does not weaken the check it
  # feeds: script-scope-check counts only wildcard-free literal paths as
  # naming a script, so re-adding a glob (here or anywhere else) satisfies
  # nothing and the unlisted script still fails by name.
  scripts-all:
    - ".just/scripts/**"

  # The tracked shell scripts, YAML files and Justfile modules outside the
  # directories other scopes cover, for `just check-doc-prose`, which reads the
  # full-line comments of every file of those kinds that git lists.
  comment-sources:
    - ".github/**"
    - "examples/large/generate.sh"

  # The scripts outside .just/scripts/ that a `just check` arm can reach, for
  # `just check-gate-drift`, which follows the call graph out of `check` and
  # reads every body it lands on (www/generate.sh and what it runs,
  # docs/generate-md.sh). A glob for the reason `scripts-all` is one: the file
  # that matters is the one an arm starts running without anybody listing it.
  gate-reach-scripts:
    - "www/*.sh"
    - "docs/*.sh"

  # One scope per script, from here down. Each is named by the rule (or rules)
  # that run or read that body, and by nothing else. A `.just/scripts/**` glob
  # shared by every rule would make an edit to check-crap.sh re-run clippy, the
  # full test suite, the docs build and every other rule that never opens it.
  #
  # A glob covers a new script as soon as the file exists, so nobody has to
  # remember to wire it up. An enumeration gives that up. An unlisted script is
  # invisible: its rule serves a stale hit against a body it never hashed,
  # which is the false-fresh every comment in this file argues against. A check
  # pays that price instead of care: `just script-scope-check` set-differences
  # the files on disk against the literal paths named here and fails naming any
  # script no scope lists. Without that arm this split would be a net loss.
  #
  # Naming is mechanical so the next scope has an obvious place to land:
  # `script-` plus the script's stem, a leading underscore dropped
  # (`_lcov-stale-reason.sh` becomes `script-lcov-stale-reason`). The check
  # matches on the path and does not read the name, so the convention is only a
  # convention.
  #
  # Ten scripts are named by no rule: crap-baseline.sh, release-hook.sh, the four
  # install scripts (install.sh, install-bin.sh, install-lib.sh,
  # uninstall-lib.sh), the two sourced preambles (_mutants-env.sh,
  # _typst-package.sh) and the two that run the gates (check.sh, mmz-arm.sh).
  # They are bodies of recipes that no rule in `commands` wraps, and installs
  # mutate the machine, so memoizing them would skip the mutation. They still get a scope, because
  # script-scope-check demands that every script be named, and `scripts-all`
  # above still gates them for size and drift. A scope with no reader is the
  # visible form of "no memoized rule reads this"; deleting it would hide that.
  script-arg-pattern-check:
    - ".just/scripts/arg-pattern-check.sh"
  script-check:
    - ".just/scripts/check.sh"
  script-check-doc-coverage:
    - ".just/scripts/check-doc-coverage.sh"
  script-check-doc-facts:
    - ".just/scripts/check-doc-facts.sh"
  script-check-doc-recipes:
    - ".just/scripts/check-doc-recipes.sh"
  script-check-doc-prose:
    - ".just/scripts/check-doc-prose.sh"
  script-check-doc-blocks:
    - ".just/scripts/check-doc-blocks.sh"
  script-doc-blocks-control:
    - ".just/scripts/_doc-blocks-control.sh"
  script-doc-blocks-lib:
    - ".just/scripts/_doc-blocks-lib.sh"
  # The checker lives in its own jq file beside the driver.
  script-check-doc-spans:
    - ".just/scripts/check-doc-spans.sh"
    - ".just/scripts/check-doc-spans.jq"
  script-check-gate-drift:
    - ".just/scripts/check-gate-drift.sh"
  script-gate-drift-control:
    - ".just/scripts/_gate-drift-control.sh"
  script-gate-drift-lib:
    - ".just/scripts/_gate-drift-lib.sh"
  script-check-secrets:
    - ".just/scripts/check-secrets.sh"
  script-check-secrets-manifest:
    - ".just/scripts/check-secrets-manifest.sh"
  script-cover:
    - ".just/scripts/cover.sh"
  script-crap:
    - ".just/scripts/crap.sh"
  script-crap-ratchet-lib:
    - ".just/scripts/_crap-ratchet-lib.sh"
  script-crap-ratchet-control:
    - ".just/scripts/_crap-ratchet-control.sh"
  script-crap-baseline:
    - ".just/scripts/crap-baseline.sh"
  script-crap-baseline-check:
    - ".just/scripts/crap-baseline-check.sh"
  script-docs-md-check:
    - ".just/scripts/docs-md-check.sh"
  script-fmt-fixture-check:
    - ".just/scripts/fmt-fixture-check.sh"
  script-install:
    - ".just/scripts/install.sh"
  script-install-bin:
    - ".just/scripts/install-bin.sh"
  script-install-lib:
    - ".just/scripts/install-lib.sh"
  script-lcov-stale-reason:
    - ".just/scripts/_lcov-stale-reason.sh"
  script-mmz-arm:
    - ".just/scripts/mmz-arm.sh"
  script-mutants:
    - ".just/scripts/mutants.sh"
  script-mutants-diff:
    - ".just/scripts/mutants-diff.sh"
  script-mutants-env:
    - ".just/scripts/_mutants-env.sh"
  script-nav-diff:
    - ".just/scripts/_nav-diff.sh"
  # The merge driver is no recipe's body. The e2e test in
  # crates/mindtape-cli/tests/it/outdatty_lock_merge_e2e.rs runs it, together with
  # the `.gitattributes` line that assigns it, so `just test` and `just cover`
  # read this scope.
  script-outdatty-lock-merge:
    - ".just/scripts/outdatty-lock-merge.sh"
    - ".gitattributes"
  # Likewise the jscpd baseline merge driver and its test,
  # crates/mindtape-cli/tests/it/jscpd_baseline_merge_e2e.rs.
  script-jscpd-baseline-merge:
    - ".just/scripts/jscpd-baseline-merge.sh"
    - ".gitattributes"
  # Likewise the CRAP baseline merge driver and its test,
  # crates/mindtape-cli/tests/it/crap_baseline_merge_e2e.rs.
  script-crap-baseline-merge:
    - ".just/scripts/crap-baseline-merge.sh"
    - ".gitattributes"
  # The worktrunk `pre-remove` hook runs this one (.config/wt.toml), no recipe.
  # The e2e test in crates/mindtape-cli/tests/it/wt_carry_lcov_e2e.rs runs it, so
  # `just test` and `just cover` read this scope.
  script-wt-carry-lcov:
    - ".just/scripts/wt-carry-lcov.sh"
  # .githooks/commit-msg runs this one, no recipe. The fixture gate
  # `just outdatty-review-trailer-fixture-check` commits through it, so that
  # rule reads both scopes.
  script-outdatty-review-trailer:
    - ".just/scripts/outdatty-review-trailer.sh"
  script-outdatty-review-trailer-fixture-check:
    - ".just/scripts/outdatty-review-trailer-fixture-check.sh"
  script-path-attr-check:
    - ".just/scripts/path-attr-check.sh"
  script-plural-check:
    - ".just/scripts/plural-check.sh"
  script-positional-args-check:
    - ".just/scripts/positional-args-check.sh"
  script-release-hook:
    - ".just/scripts/release-hook.sh"
  script-script-attr-check:
    - ".just/scripts/script-attr-check.sh"
  script-script-graph:
    - ".just/scripts/_script-graph.sh"
  script-script-graph-control:
    - ".just/scripts/_script-graph-control.sh"
  script-script-graph-lib:
    - ".just/scripts/_script-graph-lib.sh"
  script-script-reach:
    - ".just/scripts/_script-reach.sh"
  script-script-scope-check:
    - ".just/scripts/script-scope-check.sh"
  script-site-pages-fixture-check:
    - ".just/scripts/site-pages-fixture-check.sh"
  script-size-fixture-check:
    - ".just/scripts/size-fixture-check.sh"
    # It sources the sweep's size arm and asserts `score_size`'s rows.
    - "contrib/ask-refactoring/size.sh"
  script-typst-package:
    - ".just/scripts/_typst-package.sh"
  script-uninstall-lib:
    - ".just/scripts/uninstall-lib.sh"

# Empty: a cache hit prints nothing, because an exit code already carries the
# verdict. A direct `just mmz <gate>` on an unchanged tree stays silent, and
# under `just check` .just/scripts/mmz-arm.sh asks `mmz --is-fresh` whether an
# arm was a hit, so the verdict line can count hits without a note per arm.
on_hit: ""

# `just ask-refactoring` is absent below because memoizing it would defeat it,
# gate or not. The sweep re-observes the advisory signals on every run, and a
# cache hit is the answer it must never give. Its own re-run guard is the
# [views.ask-refactoring] view, not a cache.
commands:
  # Rust formatting: `cargo fmt --check` over Rust, `tombi format --check`
  # over the project config TOML, `typstyle --check` over the Typst sets. A
  # single edit to one set busts only this rule.
  - name: just fmt-check
    tags: [gate]
    inputs: [rust, rust-fmt, toml-fmt, typ-fmt, gates-meta]

  - name: just clippy
    tags: [gate]
    inputs: [rust, rust-clippy, gates-meta]

  - name: just test
    tags: [gate]
    inputs: [rust, policy, examples, workflows, gates-meta, script-outdatty-lock-merge, script-jscpd-baseline-merge, script-crap-baseline-merge, script-wt-carry-lcov]

  # cargo-llvm-cov instruments and runs the same suite as `just test` (same
  # scope), then writes target/coverage/lcov.info, the artifact `just crap`
  # and `just ask-refactoring`'s undertested arm both read. The output voids the
  # record when the lcov is deleted, so `just crap` never scores a missing one
  # behind a fresh `cover`.
  - name: just cover
    tags: [gate]
    inputs: [rust, policy, examples, workflows, gates-meta, script-cover, script-outdatty-lock-merge, script-jscpd-baseline-merge, script-crap-baseline-merge, script-wt-carry-lcov]
    outputs: [target/coverage/lcov.info]

  - name: just machete
    tags: [gate]
    inputs: [manifests, gates-meta]

  # actionlint reads every workflow and runs shellcheck over each `run:` block.
  - name: just check-workflows
    tags: [gate]
    inputs: [workflows, gates-meta]

  # shellcheck reads every tracked shell script (`shell-scripts`). `gates-meta`
  # carries the Justfile recipe and the dev-shell pin of shellcheck itself.
  - name: just shellcheck
    tags: [gate]
    inputs: [shell-scripts, gates-meta]

  # linecop scans every language `.linecop.yaml` gives a base limit (Rust,
  # Markdown, Shell and Typst, with target/archive/var excluded by config), so
  # the input list has to cover all four. `crates/**/*.rs` is `rust`; the
  # tracked `.md` files and the `www/`+`contrib/` shell live under `docs`;
  # `.just/scripts/*.sh` is `scripts-all`, the whole directory and not one body,
  # because linecop scans every file in it and an oversized script the input
  # list never named would go false-fresh here. `policy` and `examples` are the
  # Typst half: `lib/**`, `.mindtape/templates/**` and the example
  # projects' task trees and templates. Without them a Typst file could cross its
  # cap while this rule still reported fresh. `.mindtape/templates/**` is
  # scanned only because `.linecop.yaml` sets `include_hidden: true`.
  - name: just check-file-size
    tags: [gate]
    inputs: [rust, policy, examples, file-size-config, docs, gates-meta, scripts-all]

  # jscpd scans `crates/` Rust only; its flags are Justfile-defined, so a
  # Justfile edit re-runs this gate, and so does a re-minted baseline.
  - name: just check-dry
    tags: [gate]
    inputs: [rust, gates-meta, dry-baseline]

  # gitleaks over the whole tracked tree. `secrets-tree` is that tree (minus
  # the one directory a gate-tagged rule may not name, argued on the scope
  # itself) and `secrets-config` is the ruleset it reads it with. Both belong
  # to this rule alone. `mmz-config` is here for script-scope-check's reason,
  # one file over: arm three, whose body is
  # .just/scripts/check-secrets-manifest.sh (named by `script-check-secrets-
  # manifest` below), reads this manifest as data. It set-differences
  # `git ls-files` against mmz's own expansion of `secrets-tree`, so an
  # input-list edit must re-run the arm that judges it. The scope union
  # already covers .mmz/config.yaml through `.mmz/**`, and naming it anyway
  # follows the rule the `mmz-config` scope exists for: a rule that reads a
  # file as data says so. No `rust`: nothing is built or run here, and
  # `crates/**` is scanned as text through `secrets-tree` like every other
  # file.
  - name: just check-secrets
    tags: [gate]
    inputs: [secrets-tree, secrets-config, mmz-config, gates-meta, script-check-secrets, script-check-secrets-manifest]

  # outdatty.check re-reads every dependent's current content and compares it to
  # the lock. Every dependent lives under `rust`/`policy`/`examples`/`docs`, so
  # a dependent edit busts via those scopes, and `outdatty-config` covers the
  # lock and the group config directly. The rule takes `scripts-all` and not one
  # script's scope: every file in .just/scripts/ is a source of some group
  # (outdatty.yaml lists them one by one), so this rule reads the whole
  # directory, and a per-body scope would leave the rest false-fresh.
  # `outdatty-sources` holds the listed files no other scope does; arm four of
  # `just script-scope-check` fails by name on one the inputs miss.
  - name: just outdatty-check
    tags: [gate]
    inputs: [outdatty-config, outdatty-sources, rust, policy, examples, docs, gates-meta, scripts-all]

  # `mt -w examples/<name> check` for each example — depends on the built
  # binary (rust) plus the fixtures' task trees + project config (policy +
  # examples).
  - name: just check-examples
    tags: [gate]
    inputs: [rust, policy, examples, gates-meta]

  # Set-differences `mt _cli --json`'s reflected command names (built binary,
  # so `rust`) against www/utils/cli-notes.typ's dict keys (`docs`) — a new
  # subcommand with no matching entry fails by name. The recipe body (the
  # typst-query driver) is .just/scripts/check-doc-coverage.sh, so that one
  # script's scope — not the directory — plus `gates-meta` for the Justfile
  # line that invokes it and the dev shell it runs in.
  - name: just check-doc-coverage
    tags: [gate]
    inputs: [rust, docs, gates-meta, script-check-doc-coverage]

  # Regenerates its own facts (www/generate-facts.sh reads Cargo.toml/Cargo.lock/
  # rust-toolchain.toml — `rust` — plus lib/prelude.typ/lib/typst.toml —
  # `policy` — and .linecop.yaml — `file-size-config`) then set-differences
  # crate-map.json/dsl-fields.json against the two prose dicts under
  # www/utils/ (`docs`). `script-check-doc-facts` is the recipe body;
  # `gates-meta` carries the gate-table shape www/generate-facts.sh's
  # gates.json reads back out of the Justfile. `script-nav-diff` is here because
  # check-doc-facts.sh's `NAV` arm shells out to .just/scripts/_nav-diff.sh
  # directly. Arm two of script-scope-check walks that hop instead of taking it
  # on trust, so the input is derived and dropping it fails by name.
  - name: just check-doc-facts
    tags: [gate]
    inputs: [rust, policy, file-size-config, docs, gates-meta, script-check-doc-facts, script-nav-diff]

  # Scans the doc sources (`docs`) for a hand-typed `just <recipe>` mention that
  # skips www/generated/just.typ, against the recipe/alias names `just --dump`
  # reflects (`gates-meta`, the Justfile it dumps). It reads them through the
  # shared extractor in _doc-blocks-lib.sh (`script-doc-blocks-lib`), beside
  # its own body's scope. No `rust` input, this never touches the built binary.
  - name: just check-doc-recipes
    tags: [gate]
    inputs: [docs, gates-meta, script-check-doc-recipes, script-doc-blocks-lib]

  # Scans the doc sources (`docs`) for history words and all-caps emphasis, and
  # the full-line comments of every tracked shell script, YAML file and Justfile
  # module: the Justfile and .just/docs.just (`gates-meta`), .mmz/config.yaml
  # (`mmz-config`), outdatty.yaml (`outdatty-config`), .linecop.yaml
  # (`file-size-config`), .just/scripts (`scripts-all`) and the rest
  # (`comment-sources`, `docs`). It also reads the descriptions in
  # schema/config.schema.json (`policy`). It reads the committed schema, so it
  # never builds `mt`, and it reads no generated file.
  - name: just check-doc-prose
    tags: [gate]
    inputs: [docs, gates-meta, mmz-config, outdatty-config, file-size-config, policy, scripts-all, comment-sources, script-check-doc-prose, script-doc-blocks-lib]

  # Parses www/content, www/utils and docs/src (`docs`) with typstyle, which
  # the dev shell pins (`gates-meta`), and runs its control over synthetic
  # files first. Nothing is built.
  - name: just check-doc-blocks
    tags: [gate]
    inputs: [docs, gates-meta, script-check-doc-blocks, script-doc-blocks-lib, script-doc-blocks-control]

  # Checks inline code spans in the docs (`docs`) against `mt _cli --json` and
  # each project's status legend (the built binary, `rust`; the root config and
  # schema/config.schema.json, `policy`; `example-configs`).
  - name: just check-doc-spans
    tags: [gate]
    inputs: [rust, policy, example-configs, docs, gates-meta, script-check-doc-spans, script-doc-blocks-lib]

  # The one producer of www/generated/, memoized so the four gates that read it
  # (docs::check, docs::md-check, check-doc-facts, site-pages-fixture-check)
  # run www/generate.sh once per tree instead of once each. Each calls `mmz
  # just docs::gen` under target/www-generated.lock, so the first to take the
  # lock regenerates and the rest find this record fresh. Not gate-tagged: it
  # is a producer, and the gates that read it carry the verdict.
  #
  # The inputs are the union the four readers declared for running
  # www/generate.sh themselves: the built `mt` (`rust`), the prelude and root
  # config (`policy`), the fixtures it captures (`examples`), www/, docs/,
  # contrib/ and the release workflow (`docs`), the .linecop.yaml it reads back
  # as linecop-caps.json (`file-size-config`), and the Justfile it dumps for
  # gates.json and just.typ (`gates-meta`). The `outputs` void the record when
  # www/generated/ or the favicon is deleted, by a `cargo clean`-style wipe or a
  # fresh clone, so a reader never meets a fresh record over a missing file.
  - name: just docs::gen
    inputs: [rust, policy, examples, file-size-config, docs, gates-meta]
    outputs:
      - www/generated/cli.json
      - www/generated/crate-map.json
      - www/generated/just.typ
      - www/generated/site-pages.json
      - www/generated/hero-card.svg
      - www/assets/images/favicon-32.png

  # docs::gen shells out to the built `mt` binary (rust) and reads the docs
  # tree + the example fixtures (examples) + the project policy/prelude
  # (the generated CLI transcripts reference `mt`'s config-driven output).
  - name: just docs::check
    tags: [gate]
    inputs: [rust, policy, examples, docs, gates-meta]

  # Regenerates every docs/src/*.typ source (after www/generate-facts.sh, same
  # as check-doc-facts) with typlite into a temp dir, then diffs each against
  # the committed file at its declared output path (AGENTS.md among them).
  # `rust`+`policy`+`file-size-config` because a source may read
  # www/generated/{crate-map,dsl-fields,linecop-caps}.json, and those scopes
  # cover that json's own sources; `docs` because docs/src/** and every output
  # path it writes both sit under it. `gates-meta` because typlite is a
  # flake.nix devShell addition, and `script-docs-md-check` for the recipe
  # body itself.
  - name: just docs::md-check
    tags: [gate]
    inputs: [rust, policy, file-size-config, docs, gates-meta, script-docs-md-check]

  # Formatter self-test: a deliberately-mis-formatted TOML/Typst fixture must
  # be rejected by tombi/typstyle. The formatters are dev-shell-pinned, and the
  # recipe body (the bad-fixture literals) is
  # .just/scripts/fmt-fixture-check.sh — so this rule only re-runs on a recipe-
  # body or toolchain-pin edit.
  - name: just fmt-fixture-check
    tags: [gate]
    inputs: [rust, rust-fmt, gates-meta, script-fmt-fixture-check]

  # Dispatch-only self-test: the `[arg(...)]` patterns on
  # `release`/`bench`/`gen-bench`/`eject` and on `ask-refactoring`'s five
  # thresholds must reject a known-bad value and accept a known-good one, and
  # Dispatch-only self-test: the `[arg(...)]` patterns on
  # `release`/`bench`/`gen-bench`/`eject` and on `ask-refactoring`'s five
  # thresholds must reject a known-bad value and accept a known-good one, and
  # every declared default must satisfy its own pattern. Every check the script
  # runs is `just --dry-run --yes <recipe> <value>` against this Justfile, so
  # `gates-meta` (the two justfiles + the dev-shell pin) plus this script's own
  # scope is the whole input: no rust build, no task tree, and no other script,
  # since dry-run means no recipe body executes at all.
  - name: just arg-pattern-check
    tags: [gate]
    inputs: [gates-meta, script-arg-pattern-check]

  # Static self-test: `test`/`build`/`mutants`/`mutants-diff` must carry
  # `[positional-arguments]` and forward "$@", never interpolate
  # `{{ ARGS }}`/`{{ args }}` into the body. It reads `just --dump --dump-
  # format json` plus a grep of the scripts those recipes forward into
  # (.just/scripts/mutants.sh, .just/scripts/mutants-diff.sh). No rust build,
  # no task tree, nothing a static read of the Justfile and three scripts does
  # not already cover. Those two forwarded-into scripts are the reason this
  # rule names three script scopes rather than one: a rule may read a body it
  # does not run, and a grep target left out of the input list goes false-fresh
  # exactly as an unhashed recipe body would.
  - name: just positional-args-check
    tags: [gate]
    inputs: [gates-meta, script-positional-args-check, script-mutants, script-mutants-diff]

  # Static self-test plus a synthesized probe: no recipe body may open with a
  # `#!` shebang (read from `just --dump --dump-format json`, walking modules),
  # and every justfile's own `set script-interpreter` must abort a failed
  # pipeline. The probe proves that by running `false | true` under a replica
  # justfile carrying that file's setting line verbatim, and never by matching
  # its text. Both subjects are the two justfiles and the script itself, so
  # `gates-meta` plus this script's own scope is the whole input, the same
  # shape as the two rules above. The probe runs in a temp dir and reads
  # nothing else, and the `bash` it resolves comes from the dev shell
  # `gates-meta` pins.
  - name: just script-attr-check
    tags: [gate]
    inputs: [gates-meta, script-script-attr-check]

  # `#[path]` gate: every `#[path = "..."]` under `crates/` must name a test
  # sibling. `rust` is the tree it scans, `script-path-attr-check` the body,
  # and `gates-meta` the dev-shell pin of the tools it runs.
  - name: just path-attr-check
    tags: [gate]
    inputs: [rust, gates-meta, script-path-attr-check]

  # Plural gate: no `(s)` in a string literal in non-test Rust code under
  # `crates/`. `rust` is the tree it scans, `script-plural-check` the body, and
  # `gates-meta` the dev-shell pin of the tools it runs.
  - name: just plural-check
    tags: [gate]
    inputs: [rust, gates-meta, script-plural-check]

  # Scan-scope self-test: an oversized shell script at `.just/scripts/` inside
  # a replica tree must be reported by linecop reading this repo's config, and
  # must go unreported with `include_hidden` deleted. `file-size-config` is the
  # subject, since the assertion is about that file's scan scope, so a config
  # edit must re-run it. `script-size-fixture-check` is the body, and
  # `gates-meta` carries the dev-shell pin linecop itself comes from. No
  # `rust`, no `docs`, and no `scripts-all` either: the replica holds one
  # synthesized file and the scan never touches the real directory, which is
  # why it is a replica.
  - name: just size-fixture-check
    tags: [gate]
    inputs: [file-size-config, gates-meta, script-size-fixture-check]

  # Fixture repo for the commit-msg hook's Docs-Unaffected check. The fixture
  # builds its own repo and lock, so it reads no tracked file but the two
  # bodies: its own and the check it commits through. `gates-meta` carries the
  # dev-shell git, yq and jq.
  - name: just outdatty-review-trailer-fixture-check
    tags: [gate]
    inputs: [gates-meta, script-outdatty-review-trailer-fixture-check, script-outdatty-review-trailer]

  # The CRAP gate over the lcov `just cover` writes: the threshold, then the
  # ratchet against crap-baseline.json. `just check` runs it after `cover`, so
  # the lcov is fresh. `lcov` names that artifact, `rust` the sources it
  # scores and whose mtimes _lcov-stale-reason.sh compares against it,
  # `crap-baseline` the ratchet's baseline, and `gates-meta` the CRAP_EXCLUDES
  # list and the cargo-crap pin. crap.sh shells out to `just
  # _lcov-stale-reason` and sources the ratchet arm, whose control it runs
  # first, so all four bodies are inputs.
  - name: just crap
    tags: [gate]
    inputs: [rust, crap-baseline, lcov, gates-meta, script-crap, script-lcov-stale-reason, script-crap-ratchet-lib, script-crap-ratchet-control]

  # The other half of the CRAP pair, and the half that is always correct: a
  # static read of the committed baseline, refusing a machine-local path or an
  # empty entry list. Two inputs and no `rust`, because a source edit does not
  # change the verdict: the subject is the JSON file and not the code it
  # scores. `gates-meta` is the dev shell jq comes from.
  - name: just crap-baseline-check
    tags: [gate]
    inputs: [crap-baseline, gates-meta, script-crap-baseline-check]

  # Two hand-kept facts read from their source, and the self-test that checks
  # the reader: TOML_FMT_PATHS against `git ls-files` (so `toml-all`,
  # which includes a new untracked file as git does) and every gate-reachable
  # `cargo build`/`cargo run` of mindtape-cli against `--tests`. The second
  # reads every script a `check` arm reaches: `scripts-all` for the directory
  # whose members it follows into, `gate-reach-scripts` for www/ and docs/,
  # `gates-meta` for the Justfile and .just/docs.just it parses with the dev
  # shell's just and jq. Its own body is `script-check-gate-drift`, with the
  # two scripts it reaches: the readers and the control.
  - name: just check-gate-drift
    tags: [gate]
    inputs: [toml-all, gates-meta, scripts-all, gate-reach-scripts, script-check-gate-drift, script-gate-drift-lib, script-gate-drift-control, script-script-reach, script-script-graph-lib]

  # The arm that checks the enumeration above. It set-differences the
  # `.just/scripts/*.sh` files on disk against the literal paths the scopes
  # name, then cross-checks that every rule here whose recipe body invokes a
  # script names that script's scope. `mmz-config` is the manifest it reads.
  # `scripts-all` is the directory listing, a glob on purpose, since the file
  # this rule must react to is by definition the one no scope lists yet, and an
  # enumeration could not see it appear. `script-script-scope-check` is its own
  # body, and `gates-meta` is the Justfile it dumps plus the dev shell yq/jq
  # come from. `outdatty-config` is here because arm three reads outdatty.yaml's
  # group sources, so a script dropped from those lists must bust this rule.
  # Without it the arm would report a verdict over a file it never hashed, the
  # false-fresh the arms themselves exist to refuse.
  #
  # `script-script-graph` and `script-script-graph-control` are the walk that
  # arm two asks for its answer and the control that proves the walk still
  # reads an edge. The walk derives both from script-scope-check.sh's calls, so
  # dropping one from this list fails by name.
  - name: just script-scope-check
    tags: [gate]
    inputs: [mmz-config, outdatty-config, scripts-all, script-script-scope-check, script-script-graph, script-script-graph-lib, script-script-graph-control, gates-meta]

  # Replica-tree self-test for the docs manifest gate: two pages declaring the
  # same route and a page with no `<page-meta>` block both drive a `cp -r
  # www` copy of www/generate-site-pages.sh (`docs`, since the fixture is
  # built from the real www/content/**), and a page missing from `NAV` drives
  # `.just/scripts/_nav-diff.sh` directly against a synthetic pair of route
  # lists. That is the same script-to-script hop `script-nav-diff` covers on
  # `just check-doc-facts` above, and arm two of script-scope-check derives it.
  # `script-site-pages-fixture-check` is its own body, `gates-meta` the dev
  # shell typst/jq come from.
  #
  # `rust`, `policy`, `examples` and `file-size-config` are here because the
  # body runs www/generate.sh to produce www/generated/, so this rule reads
  # everything `just docs::check` names for that same producer: the built `mt`
  # and its sources, lib/prelude.typ, the example fixtures it captures
  # against. `file-size-config` is for the .linecop.yaml generate-facts.sh reads
  # back as linecop-caps.json, as `just check-doc-facts` names it for running
  # the same script. A verdict rarely turns on these four scopes, but naming
  # them costs a re-run, and leaving them out would record a pass over a file
  # the rule never hashed.
  - name: just site-pages-fixture-check
    tags: [gate]
    inputs: [rust, policy, examples, file-size-config, docs, gates-meta, script-site-pages-fixture-check, script-nav-diff]
