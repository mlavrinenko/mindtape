name: CI

# Runs on every push/PR. The job is cheap, so it runs unconditionally rather
# than with paths-ignore (a required check that never triggers blocks merges).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: ~

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned: first-party actions to immutable release tags, third-party
# actions to commit SHAs. Bump them with Dependabot's `github-actions` ecosystem.
jobs:
  # `just check`'s stages split over two runners. The cover stage rebuilds the
  # workspace instrumented and shares no build with the others, so beside them
  # it cuts a cold run from about 9 minutes to about 5.5 (4 cores, measured
  # locally). The flake build joins the shorter half.
  check:
    name: Check (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: lint, test
            stages: fast build
            cache: test
          - part: coverage, nix build
            stages: cover
            cache: cover
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-rules step reads the pushed range, whose base a depth-1
          # clone lacks, and the allowlist test in both halves reads `main`.
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Substitutes from, and pushes every path built below to, the
      # mlavrinenko binary cache: the dev shell's from-source tools and `mt`.
      # Pushes only once the repo has a CACHIX_AUTH_TOKEN secret.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mlavrinenko
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Compiled dependencies only: cargo reuses an artifact only when its
      # fingerprint (compiler, flags, features, source) matches, so a stale
      # one rebuilds rather than changing a result. The key's flake.lock hash
      # tracks the dev shell's toolchain, which the action's own `rustc -vV`
      # probe outside the shell can't see. Saved from main alone, so a branch
      # never evicts it.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Each half builds a different profile, so each keeps its own cache.
          key: ${{ matrix.cache }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same dev shell and the same `just check` as local development, given
      # this half's stages.
      - name: Check
        run: nix develop --command just check ${{ matrix.stages }}

      # The flake build the release hook runs, so a push that breaks it fails
      # here and not at release time.
      - name: Nix build
        if: matrix.stages == 'cover'
        run: nix develop --command just nix-build

      # The commit-msg hook is one `--no-verify` away from skipped, so the
      # commits it guards are held to `[[commits.rules]]` again here: a push
      # checks what it pushed, a PR its own commits. Nothing earlier is read —
      # history is never rewritten, so re-judging it could only fail forever.
      # The floor bounds a range from below, so history up to it stays exempt
      # even when one push carries it. That history holds path-form `Refs:`
      # trailers the trailer check refuses and every flip-only
      # `task: start`/`task: close` commit that `flip-with-work` refuses. The
      # floor is the last commit before `flip-with-work` turned on. A new
      # branch (`before` all zeros), `workflow_dispatch` and a force-push
      # whose `before` is gone have no range and skip, saying so.
      #
      # `changelog-with-product-change` raises the floor to the commit that
      # added it, found by `git log -S` rather than by hash, so a rebase before
      # integration cannot stale it. Product commits made before the rule
      # carry no entry, and only commits after it are judged.
      - name: Commit rules (pushed range)
        if: matrix.stages == 'fast build'
        env:
          FLOOR: 59c947205865b61e586a49c98366e1e4173afec2
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}"; then
            echo "::notice::no pushed range to check commit rules over"
            exit 0
          fi
          RULE=$(git log --reverse --format=%H -S'changelog-with-product-change' -- .mindtape/config.toml | head -n 1)
          if [ -n "$RULE" ]; then
            FLOOR=$RULE
          fi
          if ! git merge-base --is-ancestor "$FLOOR" "$BEFORE"; then
            BEFORE=$FLOOR
          fi
          nix develop --command cargo run -q -- check --commits "$BEFORE..$AFTER"

  # Windows has no Nix, so this job cannot run `just check` and deliberately
  # does not try: fmt, clippy, machete, linecop, jscpd and the docs gates are
  # platform-independent and stay on the Linux job above. What only a Windows
  # runner can answer is whether the code compiles and behaves there — the
  # platform seams `sh -c` vs `cmd /C`, the `dirs` config/data paths `mt
  # install` writes, the Typst local-package directory, and path separators in
  # derived tags and link resolution. So this job builds and runs the suite,
  # nothing more.
  #
  # The pty-driven tests (`tests/it/tty_e2e.rs`, `tests/it/interactive_e2e.rs`) and
  # the lock merge driver's (`tests/it/outdatty_lock_merge_e2e.rs`) are
  # `#![cfg(unix)]` and compile to nothing here; see their module docs.
  windows:
    name: Test (Windows)
    runs-on: windows-latest
    # This job runs plain rustup cargo, never the dev shell, so clear the
    # sccache rustc-wrapper for the same reason release.yml does.
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
        with:
          # diag/allowlist_tests.rs compares the list with `main`'s, and fails
          # in CI where it finds no `main`.
          fetch-depth: 0
      # Same toolchain source as release.yml's build job: the action exports
      # RUSTUP_TOOLCHAIN, which takes precedence over rust-toolchain.toml, so
      # this tests what the Windows release binary is actually compiled with.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # cargo-nextest is not part of rustup, and there is no Nix here to
      # provide the dev shell's copy (flake.nix) — install the same runner
      # the Linux job gates on, from an official prebuilt. Pinned to a commit
      # SHA like every third-party action.
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          key: windows-latest

      - name: Build
        run: cargo build --workspace --all-targets

      # Windows runs rarely, so one red run should list every failure: with
      # fail-fast, the 0.3.0 preflight stopped after 46 of 3899 tests.
      - name: Test
        run: cargo nextest run --workspace --no-fail-fast
