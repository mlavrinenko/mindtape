name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Rustup-based jobs run cargo without the dev shell, so clear the sccache
# rustc-wrapper. No .cargo/config.toml is committed — `just nix-build` exists to
# keep it that way — but RUSTC_WRAPPER is an inherited environment setting on a
# dev machine, and a wrapper these jobs cannot resolve fails every cargo call.
env:
  RUSTC_WRAPPER: ""

jobs:
  version-check:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag v${TAG} does not match workspace version ${CARGO} in Cargo.toml"
            exit 1
          fi
          echo "Tag v${TAG} matches workspace version ${CARGO}"

  check:
    name: Check
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Check
        run: nix develop --command just check

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      # `ext` is the executable suffix for the target, and it is spelled out per
      # entry rather than derived from the triple so www/generate.sh can read
      # the release's real download filenames straight out of this matrix (see
      # the artifact `name:` below). Empty everywhere but Windows.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p mindtape-cli
      # Derive the binary name from the manifest instead of hardcoding it. The
      # package is `mindtape-cli` but its [[bin]] is `mt`, and hardcoding the
      # package name here meant this step copied a file that never existed, so
      # every target failed and a tagged release attached no binaries at all.
      # Reading it from cargo metadata keeps the artifact correct if the binary
      # is ever renamed. The downloaded file stays `mindtape-<triple><ext>` —
      # the `.exe` on Windows matters: a downloaded file without it is not
      # runnable, and renaming it is not something a Release page can say.
      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          bin="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[]
                     | select(.name == "mindtape-cli")
                     | .targets[]
                     | select(.kind[] == "bin")
                     | .name' \
            | head -1)"
          test -n "$bin" || { echo "could not resolve the mindtape-cli binary name" >&2; exit 1; }
          ext='${{ matrix.ext }}'
          cp "target/${{ matrix.target }}/release/${bin}${ext}" \
             "mindtape-${{ matrix.target }}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: mindtape-${{ matrix.target }}${{ matrix.ext }}
          path: mindtape-${{ matrix.target }}${{ matrix.ext }}

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Publish in dependency order; pause for the crates.io index to settle.
      - name: Publish typst-harvest
        run: cargo publish -p typst-harvest --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30
      - name: Publish mindtape
        run: cargo publish -p mindtape --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: sleep 30
      - name: Publish mindtape-cli
        run: cargo publish -p mindtape-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mindtape-*
