name: Deploy Pages

on:
  push:
    branches: [main]
    paths: [www/**, .github/workflows/pages.yml]
  workflow_dispatch: ~

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build docs and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # tola comes from the same flake dev shell used locally, so CI matches
      # `just docs::check`. Output lands in www/public/mindtape (the /mindtape
      # path prefix from tola.toml's url).
      - name: Build and validate docs
        run: nix develop --command just docs::check

      # tola writes a CNAME from the url host; a project page has no custom
      # domain, so drop it before publishing.
      - name: Strip auto-generated CNAME
        run: rm -f www/public/mindtape/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/public/mindtape
      - id: deployment
        uses: actions/deploy-pages@v4
