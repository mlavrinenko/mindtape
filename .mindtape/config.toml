# .mindtape/config.toml — MindTape tracking itself (dogfood).
# White-listed: MindTape constrains only what is declared here. Omit a section
# to accept the defaults and the prelude's full status shortcut set.

[tasks]
# MindTape's own backlog lives here, one task per file.
roots = ["truth/tasks"]

# Status legend: legal values in lifecycle order, each with an optional glyph and
# colour. `terminal = true` ends a task (required fields relax once terminal).
[[tasks.status]]
value = "proposed"
glyph = "💡"
color = "blue"

[[tasks.status]]
value = "accepted"
glyph = "📋"
color = "cyan"

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true

[[tasks.status]]
value = "failed"
glyph = "❌"
color = "red"
terminal = true

# Priority: a number on a 0..9 scale, classified into labelled bands.
[tasks.priority]
kind = "int"
min = 0
max = 9
required = "non-terminal"
[[tasks.priority.bands]]
label = "low"
min = 0
max = 2
glyph = "🟢"
color = "green"
[[tasks.priority.bands]]
label = "normal"
min = 3
max = 6
glyph = "🟡"
color = "yellow"
[[tasks.priority.bands]]
label = "high"
min = 7
max = 9
glyph = "🔴"
color = "red"

[tasks.estimate]
units = ["minutes", "hours", "days", "weeks"]

[tasks.tags]
# Area labels for the backlog. Empty would accept any tag.
allowed = ["substrate", "speconaut", "cli", "tests", "www", "docs", "tooling", "gating"]

[[tasks.body.headers.rules]]
path    = ["Summary"]
action  = "require"
message = "every task must have a Summary section"

[query]
# `mindtape list` hides finished work unless `--all` is passed.
default_filter = "status != \"done\""
