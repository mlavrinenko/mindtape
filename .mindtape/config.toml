#:schema ../schema/config.schema.json
# .mindtape/config.toml — MindTape tracking itself (dogfood).
# White-listed: MindTape constrains only what is declared here. Omit a section
# to accept the defaults and the prelude's full status shortcut set.

# The flagship task practice — the six-section shape, its markers and word
# caps, and the imperative-title rule — ships as the `mindtape-tasks` pack
# (`crates/mindtape/src/packs/mindtape-tasks.toml`) rather than living here by
# hand. What stays local is only what is true of THIS repo: goal verdicts
# (the `goals` rule, below) and an extra `Dogfood` section the pack has no
# opinion on — see the `section-allowlist` override further down for how.
# docs:slice rule-packs/extends
extends = ["mindtape-tasks"]
# docs:end

[tasks]

# MindTape's own backlog lives here, one task per file. The `mt` root name is
# emitted as a derived tag on every task (the tree is flat today, so no folder
# tags yet); nest tasks into folders and the folder names join in.
[[tasks.roots]]
path = "truth/tasks"
name = "mt"
derive-tags = true

# Status legend: legal values in lifecycle order, each with an optional glyph and
# colour. `terminal = true` ends a task (required fields relax once terminal).
# `to` declares the allowed next statuses — the transition graph. Once any entry
# carries `to`, `mt flip` gates every move to a listed edge (a same-status
# re-stamp and an unset→any first stamp stay exempt; `--force` overrides), and
# `mt check` flags a task sitting in a status unreachable from `proposed`. The
# terminal `done`/`failed` states declare reopen edges back to `wip`; `cancelled`
# is a sink (revive it with `--force`). `unblocked = true` on `wip` and `done`
# refuses entering them while a `depends-on` target is unfinished; on the
# terminal `done` it also refuses closing a parent over an unfinished child.
[[tasks.status]]
value = "proposed"
glyph = "💡"
color = "blue"
to = ["accepted", "wip", "cancelled"]

[[tasks.status]]
value = "accepted"
glyph = "📋"
color = "cyan"
to = ["wip", "cancelled"]

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"
unblocked = true
to = ["done", "failed", "accepted"]

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true
unblocked = true
to = ["wip", "cancelled", "failed"]

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true

[[tasks.status]]
value = "failed"
glyph = "❌"
color = "red"
terminal = true
to = ["wip"]

# Priority: an ICE score on a 0..9 scale, classified into labelled bands.
# `framework = "ice"` computes the score from `priority: ice(impact, confidence,
# ease)` inputs (the built-in ICE definition ships in the baked-in config layer).
# `allow-manual = false` is strict: every task must score through the framework,
# no hand-set integers.
[tasks.priority]
kind = "int"
min = 0
max = 9
required = "!terminal"
framework = "ice"
allow-manual = false

[[tasks.priority.bands]]
label = "low"
min = 0
max = 2
glyph = "🟢"
color = "green"

[[tasks.priority.bands]]
label = "normal"
min = 3
max = 6
glyph = "🟡"
color = "yellow"

[[tasks.priority.bands]]
label = "high"
min = 7
max = 9
glyph = "🔴"
color = "red"

# Difficulty says which model tier and reasoning effort a task wants, before
# anyone starts it. The scale and its junior/mid/senior/staff anchors come from
# the embedded floor; only the rubric and `required` are set here. No vendor or
# model name belongs in an artifact — mapping a number onto a model is the
# reader's policy, which is what the field was designed for.
#
# Score JUDGMENT REQUIRED, not size. A prediction is what an agent fills
# plausibly rather than truthfully, and a written rubric both a human and an
# agent apply the same way is the difference between a routing signal and a
# decorative number.
#
#   0-2  mechanical — the change is fully specified; no decision is left open.
#   3-5  local judgment — one module, one obvious approach, tests fall out of it.
#   6-8  cross-cutting design — several defensible approaches, and picking one
#        constrains later work.
#   9    the approach itself is the open question.
#
# `!terminal` mirrors priority: a closed task is exempt, so finishing work never
# means backfilling a prediction nobody will route on.
[tasks.difficulty]
required = "!terminal"

# A task estimates how many non-test SOURCE FILES it means to touch — not how
# long it will take, and not the docs, tests and `CHANGELOG.md` every task
# touches by process. A duration is a guess a model will happily invent; a
# source-file count is plannable up front, is the same information good file
# guidance already carries, and is checkable against git while the work runs.
# See truth/tasks/move-open-tasks-and-templates-to-a-src-files-estimate.typ.
[tasks.estimate]
units = ["src-files"]
required = "!terminal"

# No estimate check is built in: the caps and the working-tree budget below are
# ordinary `[[tasks.rules]]` entries reading `estimate.src-files` and
# `changed(...)`. See truth/tasks/retire-the-drift-check-and-estimate-bounds-in-
# favour-of-rules.typ.
#
# The caps are validation errors, not warnings: an oversized task must be split
# before the work starts, not after. Terminal tasks are exempt. No minimum: a
# docs-only task touches no source, and 0 is an honest count, not a missing one.
#
# The ceiling is gated on `difficulty`, because the decomposition pressure a cap
# exists to create belongs on unbounded judgment, not on size. Judgment work
# (3 and up on the rubric above) is held to 5 source files — p75 of this
# repo's files-per-commit over 200 commits (p50=2, p75=5, p90=11, p95=15,
# p99=32) — since a design decision spread wider than that is two decisions.
# Mechanical work keeps the p95 ceiling of 15: a fully specified change carries
# one decision however many files it touches, and splitting it only copies
# that decision into several tasks. Anything looser (30 ≈ p99) would never
# bind, and a limit that never fires is not a limit.
#
# These numbers are provisional: retune them as the backlog shows where they
# pinch. Open question — should mechanical work (difficulty below 3) carry no
# file cap at all, since its one decision does not grow with the file count?
[[tasks.rules]]
name = "judgment-stays-small"
when = "!terminal && difficulty >= 3"
assert = "estimate.src-files <= 5"
message = "judgment work stays small; split the decision from the mechanical fan-out rather than widen the cap"
severity = "error"

[[tasks.rules]]
name = "mechanical-stays-under-15"
when = "!terminal && !(difficulty >= 3)"
assert = "estimate.src-files <= 15"
message = "even mechanical work this wide hides a second decision; split it"
severity = "error"

# `mt check` warns (never fails) once the working tree outgrows what the
# in-flight task declared. Only source counts, so every other path is a `!`
# exclude below. Nobody hand-edits generated output — `docs-md-check` /
# `docs-check` fail the build if anyone tries — and everything else excluded is
# touched by every task by process (a status flip, a docs page, a test,
# `CHANGELOG.md`), never by the design decision the estimate is meant to size.
# Counting either against a task's declared budget turns a truthful estimate
# into a number an author has to inflate just to keep an advisory warning
# quiet, which trains everyone to stop reading it. For the same reason a
# filed estimate is never raised: it records the decomposition as planned.
#
# - README.md, CONTRIBUTING.md, AGENTS.md, skills/mindtape/SKILL.md and
#   docs/contributing/*.md: rendered from docs/src/**.typ by `just docs-md`.
# - www/generated/**: derived facts and captured CLI output, rebuilt by
#   `just docs-gen`.
# - outdatty.lock: a review watermark `just outdatty-update` rewrites.
# - docs/src/**, www/content/**: the docs every task touches by process.
# - CHANGELOG.md: the entry every task's commit carries.
# - truth/tasks/**: a task's own file, which `mt flip` writes.
# - crates/*/tests/**, **/*test*.rs: red-first coverage, not the change.
# - examples/**: fixture projects the docs, gates and skill evals read.
[[tasks.rules]]
name = "src-budget"
when = 'status == "wip" && has(estimate.src-files)'
assert = '''changed("staged+worktree",
  "!README.md", "!CONTRIBUTING.md", "!AGENTS.md", "!skills/mindtape/SKILL.md",
  "!docs/contributing/*.md", "!www/generated/**", "!outdatty.lock",
  "!docs/src/**", "!www/content/**", "!CHANGELOG.md", "!truth/tasks/**",
  "!crates/*/tests/**", "!**/*test*.rs", "!examples/**") <= estimate.src-files'''
message = "split the remaining work into a new task and finish the part in hand; keep estimate.src-files as filed, since it records the decomposition"
severity = "warn"

# Goal verdicts moved out of the body into `x-goals:`, beside status and
# links, so a script can find them without parsing prose (`mt eval --json`
# now carries them). `assert` cannot reach an `x-<ns>` field or walk its
# nested dict, so this reaches for `check`: `check-goals` re-checks the same
# rules `goals(...)` used to enforce at Typst load — missing/unknown goals, a
# helps/hurts with no reason, a task that helps nothing — but as `mt check`
# breaches instead of a load-time panic.
# A tweak skips the planning sections because it is never open: filed done,
# it is terminal, and every `!terminal` rule and requirement passes it by. An
# open one would be a planned task wearing the wrong template.
[[tasks.rules]]
name = "tweak-lands-done"
when = 'has_tag("tweak")'
assert = "terminal"
message = "file a tweak done, in the commit that makes the change: `mt add -t tweak --status done`; plan anything bigger with another template"
severity = "error"

[[tasks.rules]]
name = "goals"
when = "!terminal"
check = { typst = "truth/lib.typ", function = "check-goals", field = "x-goals" }
severity = "error"

# Work-in-progress caps. One milestone and one leaf, no more. A milestone
# coordinates its leaves and may legitimately stay open across sessions; a leaf
# may not, and a session ending on an open leaf is the failure these exist to
# stop. `severity = "error"` because the intended response is to finish or split
# the open work, not to note the breach and carry on.
#
# No status name is hardcoded in Rust — each is a `count(...)` rule over a
# filter, named so it can be overridden by name across packs like any other
# rule. `when` repeats `assert`'s own predicate: the cap is a constant
# comparison, true or false alike for every task it names, so every task
# `when` admits gets its own breach the moment the cap is crossed — which is
# how a refused `mt flip` gets to name every task sharing the set, not just the
# one it is flipping. The second filter catches every task carrying no `kind`
# at all, since an absent field is unequal to every literal in the filter
# language, so the pair partitions the whole backlog by construction.
[[tasks.rules]]
name = "milestone-wip-cap"
when = 'status == "wip" && kind == "milestone"'
assert = 'count(status == "wip" && kind == "milestone") <= 1'
message = "close or split the open milestone before opening another"
severity = "error"

[[tasks.rules]]
name = "leaf-wip-cap"
when = 'status == "wip" && kind != "milestone"'
assert = 'count(status == "wip" && kind != "milestone") <= 1'
message = "finish the open task, or split off what is done and close that, before starting another"
severity = "error"

[tasks.tags]
# Area labels for the backlog. Empty would accept any tag.
allowed = [
  "mt",
  "substrate",
  "speconaut",
  "cli",
  "tests",
  "www",
  "docs",
  "tooling",
  "gating",
  # A task the ADR process retired into: an architectural or tooling call
  # settled in the body, with no code deliverable of its own — see
  # Extending MindTape in CONTRIBUTING.md. `flip-with-work`
  # (mindtape-tasks) reads it to let one close in a task-only commit,
  # `staged(has_tag("decision"))`, the sole exemption from riding its
  # close in the work it names.
  "decision",
  # Provenance, written by `just ask-refactoring` (contrib/ask-refactoring.sh)
  # and by nothing else. `swept` marks a task the sweep filed rather than a
  # human; the three signal tags say which advisory tool noticed it. All four
  # are declared now, before the mutants and coverage arms exist, so adding a
  # signal is a script and a template — never a config migration.
  "swept",
  "size",
  "mutants",
  "coverage",
  # Provenance for the human/agent channel: `found` marks a task filed with
  # `mt add --template finding` — an out-of-scope observation, not a signal
  # a script emitted. `mt ls 'has_tag("found")'` is the whole outstanding list.
  "found",
  # Written by `mt add --template tweak` and by nothing else: a change too
  # small to plan, filed done in the commit that makes it. `tweak-lands-done`
  # below holds it to that.
  "tweak",
]

# What kind of work a task is. The leaf kinds are commit types, so a task names
# the commit that will close it. `dev` stands where Conventional Commits puts
# `chore`, which names no kind of work: it changes the harness around the repo —
# gates, scripts, the backlog's own config and spec — to improve the development
# experience or enable a process. `milestone` is the one kind no commit closes:
# it ends through its leaves, and the WIP limits below cap it separately. A
# misspelled kind would silently fall out of that cap, which is why the list is
# closed.
#
# The sweep templates stamp their one kind (`refactor` for a size finding,
# `test` for the rest); `task.typ` leaves `kind` out, so `mt add` splices a
# choice over this list rather than keeping a second copy of it. A
# non-interactive add fails naming that slot, so agents pass `--set kind=feat`.
#
# `required = "!terminal"` mirrors the fields above: an open task names its
# kind, a closed one is exempt, so history predating the field is not
# backfilled.
[tasks.fields.kind]
values = ["feat", "fix", "refactor", "docs", "test", "dev", "milestone"]
required = "!terminal"

# Who is working the task. The only distinction this backlog needs is
# human-vs-model: `max` holds the work no agent can finish — a render loaded in
# a browser, a decision the maintainer owns — and `agent` holds everything
# else. Which MODEL takes an agent task is the reader's routing policy, read off
# `difficulty`, which is why one `agent` actor is enough and no vendor or model
# name belongs here either.
#
# `required = "!terminal"` mirrors priority/difficulty/estimate: an open task
# says who is working it, a closed one is exempt, so finishing work never means
# backfilling a name onto history. `allowed` is checked against the `[[actors]]`
# registry at the bottom of this file, so a misspelling cannot reach a task.
#
# No template declares `assignee`, so `mt add` splices in a choice slot over
# these two names backed by `$MINDTAPE_PRINCIPAL`. Unset, the variable is an
# unknown actor rather than a default: an interactive add prompts, and a
# non-interactive one fails naming the slot. That is deliberate — the harness
# that guesses here is the harness that silently files the human's work as the
# agent's. Agents pass `--set assignee=agent` (and `--set assignee=max` when
# they are filing work FOR the maintainer, which the sweep templates hardcode
# because a swept finding is agent work by construction).
[tasks.assignee]
allowed = ["max", "agent"]
required = "!terminal"

# A review comment left in a task file is a conversation, not content: a human
# annotates, an agent reframes the task and removes the note. Forbidding it
# stops the conversation silently becoming the artifact.
[tasks.comments]
policy = "forbid"

# Every open task is one spec in the pack's six sections (Problem, TO-BE,
# Changes, Out of scope, plus its kind's own section) — see
# `crates/mindtape/src/packs/mindtape-tasks.toml` for the shape and the
# research it is checked against. Goal verdicts sit beside status and links
# instead, in `x-goals:` (see the `goals` rule below): one verdict per goal
# in truth/goals.typ and truth/process-goals.typ, checked by
# `check-goals(...)` in truth/lib.typ. A task that helps no goal is refused,
# so nothing unjustified gets filed.
#
# `section-allowlist` overrides the pack's own rule of the same name to add
# one more section, `Dogfood`, this repo's own convention for saying how it
# uses a change ("Not applicable" with a reason opts out) — a same-named
# entry replaces the pack's in place rather than appending beside it, so
# restating the full allowed set with `Dogfood` added is how a local section
# gets layered onto an inherited practice. This is the worked example for
# that mechanism: an adopting repo with its own extra section copies this
# shape; one it wants gone entirely reaches for `disable = ["<name>"]`
# instead.
# docs:slice rule-packs/section-allowlist
[[tasks.body.headers.rules]]
name = "section-allowlist"
action = "allowlist"
allowed = [
  { match = "^(Problem|Environment|TO-BE|Source of truth|Changes|Alternatives|Rollback|Out of scope|Dogfood)$" },
]
when = "!terminal"
message = "an open task's sections are Problem, TO-BE, Changes, Out of scope and Dogfood, plus its kind's own section"
# docs:end

[[tasks.body.headers.rules]]
name = "one-dogfood-section"
path = ["Dogfood"]
action = "unique"
when = "!terminal"
message = "every open task says how this repo will dogfood it, in one Dogfood section (\"Not applicable\" with a reason opts out)"

[[tasks.body.headers.rules]]
name = "dogfood-after-out-of-scope"
action = "order"
before = ["Out of scope"]
after = ["Dogfood"]
when = "!terminal"
message = "Dogfood follows Out of scope"

[[tasks.body.content.rules]]
name = "dogfood-non-empty"
path = ["Dogfood"]
assert = "non-empty"
when = "!terminal"
message = "a Dogfood heading over nothing decides nothing; say how this repo uses the change, or \"Not applicable\" and why"

# The pack's own word cap (`section-word-cap`) does not reach `Dogfood`,
# since that section is only ever this repo's own — so it gets a cap of its
# own rather than an override of the pack's.
[[tasks.body.content.rules]]
name = "dogfood-word-cap"
path = ["Dogfood"]
assert = { max-words = 120 }
when = "!terminal"
message = "keep this section under 120 words; a longer one is a task that should have been two"

# The default `mt ls` listing is inherited from the embedded floor's
# `[views.default]` view. Redeclare `[views.default]` here to add a
# sort/columns bundle.

# The sweep's own inbox: everything `just ask-refactoring` filed that is still
# open. It is both a listing (`mt ls @ask-refactoring`) and the sweep's re-run
# guard — contrib/ask-refactoring.sh refuses to run while this view is
# non-empty, so one sprint of mechanical work is emptied before the next is
# filed. Without it a weekly sweep would re-file the same seven splits on top of
# the seven already sitting there.
#
# It selects on the provenance tag alone, not on any signal tag, so a new signal
# joins the guard for free. `!terminal` is what "still open" means here:
# cancelling a finding is a legitimate way to empty the view, and so is writing
# the `.linecop.yaml` override that makes the finding stop existing.
[views.ask-refactoring]
filter = 'has_tag("swept") && !terminal'
sort = ["priority:desc"]
description = "Open findings from the last `just ask-refactoring` sweep"

# The two working lists: `mt ls @owner` is what the maintainer still has to do
# by hand, `mt ls @agent` is what an agent can pick up. Both are `!terminal`
# because the question either answers is "what is left", not "what happened" —
# the closed history is `mt ls 'assignee == "max"'`.
#
# The view names are handles, not a claim about the field: `assignee` says who
# works a task, never who owns it, so the actor is named `max` and only the
# LISTING is called `owner`.
[views.owner]
filter = 'assignee == "max" && !terminal'
sort = ["priority:desc"]
description = "Open tasks waiting on the maintainer"

[views.agent]
filter = 'assignee == "agent" && !terminal'
sort = ["priority:desc"]
description = "Open tasks an agent can take"

# What is stuck and on what: `why` names each blocked task's unfinished
# dependencies, so unblocking starts from one listing rather than a link walk.
[views.blocked]
filter = "blocked"
sort = ["blocks:desc", "priority:desc"]
columns = ["slug#", "title", "why"]
description = "Blocked tasks and what each waits on"

# Closing a task asserts the gate already ran against this worktree, rather
# than running it here. `mmz --is-fresh --tag gate` exits 0 only when every
# gate-tagged rule in .mmz/config.yaml last passed with these inputs unchanged;
# it never runs any wrapped command itself.
#
# Why assert instead of run: a gate that invokes `just check` inside `mt flip`
# is slow, fires at the least convenient moment, and teaches an agent to reach
# for `--force`. Asserting a prior pass is cheap, and it is the machine-checkable
# predicate the review actually wants — proof of a passing build, not a claim.
#
# Why per-tag and not the whole manifest: the manifest can carry non-gating
# mmz rules (a bench, a prune) without those flipping the close predicate. The
# `gate` tag is the boundary between "must have passed to close a task" and
# "memoized for reuse elsewhere". `just check` writes every gate-tagged record
# by running each arm as `mmz just <subgate>`; `mmz --is-fresh --tag gate` then
# asserts them all.
#
# `mmz` is one thing this command can be, not a requirement: `run` is a plain
# command, so a project without mmz points it at anything else. The rules and
# their scopes live in .mmz/config.yaml, which deliberately excludes
# truth/tasks/ — `mt flip` writes the task file it is gating and would
# otherwise bust its own rule mid-command.
#
# The terminal statuses are listed rather than derived: `when` sees the task as
# it stands BEFORE the write, so a bare `terminal` would test the status being
# left, not the one being entered.
# Picking a task up is when its scope gets re-read. A task that sat untouched
# for 30 days (no `mt review`, no status change) has drifted from the code and
# the backlog around it — a Scope counting "the five open tasks" when there are
# now twenty — so starting it is refused until someone re-reads it, fixes what
# went stale, and stamps `mt review`. 30 is provisional, like the estimate caps.
#
# A run-less gate: `gate = true` with no `run` refuses unconditionally
# whenever `when` matches, so the condition above is the whole check.
# docs:slice hooks/stale-gate
[[on.flip]]
when = 'into("wip") && stale(30)'
actions = [
  { gate = true, message = "untouched for 30 days: re-read the scope against today's code, fix what went stale, `mt review` it, then start again" },
]
# docs:end

[[on.flip]]
when = 'into("done") || into("cancelled") || into("failed")'
actions = [
  { run = "mmz --is-fresh --tag gate", gate = true, message = "the checks have not passed against this worktree — run `just check`, then flip again (`--force` waives it and records the waiver in the note)" },
]

[add]
header = ""
comments = false

# The project's actors and roles: who works tasks, and under which hats.
# Identity-only — a role carries no payload; what a role can do lives in each
# harness's own config, keyed by role name by convention.
#
# The vocabulary `[tasks.assignee] allowed` points into. `agent` holds no role:
# a role here would have to mean the same thing for every model that ever runs
# in this repo, and the per-task routing signal is `difficulty`.
[[roles]]
name = "maintainer"

[[actors]]
name = "max"
kind = "human"
roles = ["maintainer"]

[[actors]]
name = "agent"
kind = "llm"
