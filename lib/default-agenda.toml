[agenda]
filter = 'miss(start) || start <= "$today"'
on_empty = "hide"

[[agenda.sections]]
name = "Errors"
kind = "errors"

[[agenda.sections]]
name = "Overdue"
filter = 'has(due) && due < "$today"'
sort = ["due:asc"]
on_empty = "show"
empty_message = "Nothing's here, you're great!"

[[agenda.sections]]
name = "Due Today"
filter = 'has(due) && due == "$today"'
sort = ["rank:desc"]

[[agenda.sections]]
name = "Upcoming"
filter = "has(due)"
sort = ["due:asc"]
limit = 20

[[agenda.sections]]
name = "High Priority"
filter = "rank >= 100"
sort = ["rank:desc"]

[[agenda.sections]]
name = "Recent"
sort = ["file:desc", "position:asc"]
limit = 20
