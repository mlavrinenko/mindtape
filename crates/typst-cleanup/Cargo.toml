[package]
name = "typst-cleanup"
description = "Consumer-blind orchestration for retiring Typst artifacts: dirty-tree guard, SWHID tombstone minting, and atomic inbound-link rewriting. The consumer supplies eligibility, link identity, and tombstone label policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "cleanup", "swhid", "tombstone", "refactor"]
categories = ["development-tools"]

[dependencies]
swhid-mint = { path = "../swhid-mint", version = "0.4.0" }
typst-edit = { path = "../typst-edit", version = "0.4.0" }
gix = { version = "0.84", default-features = false, features = [
  "status",
  "sha1",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
