[package]
name = "mindtape-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Typst evaluation and task extraction for MindTape"
repository = "https://github.com/mlavrinenko/mindtape"
license-file = "../../LICENSE"
readme = "README.md"

[dependencies]
typst = "0.14"
typst-eval = "0.14"
typst-library = "0.14"
typst-syntax = "0.14"
comemo = "0.5"
thiserror = "2"
chrono = "0.4"
dirs = "5"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
