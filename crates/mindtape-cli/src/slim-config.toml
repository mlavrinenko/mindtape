# .mindtape/config.toml — per-project MindTape configuration.
#
# This is the slim scaffold: the status legend, priority/difficulty scales,
# and default filters all come from the shipped floor and any
# ~/.config/mindtape/defaults.toml — omit a section here to inherit it, or
# declare it to override. Run `mt config show` to see the effective merged
# config. Run `mt init --full` for a fully-expanded starter with every
# section spelled out and commented.

[tasks]
# Directories (relative to this file's project root) holding one task per file.
roots = ["tasks"]
