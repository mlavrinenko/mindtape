[package]
name = "mindtape-cli"
description = "Command-line interface for MindTape, a file-based task tracker over Typst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "task-tracker", "cli", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "mindtape"
path = "src/main.rs"

[dependencies]
mindtape = { path = "../mindtape", version = "0.4.0" }
typst-harvest = { path = "../typst-harvest", version = "0.4.0" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
comfy-table = "7"
csv = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
