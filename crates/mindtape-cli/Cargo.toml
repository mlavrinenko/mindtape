[package]
name = "mindtape-cli"
description = "Command-line interface for Mindtape, a file-based task tracker over Typst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "task-tracker", "cli", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "mt"
path = "src/main.rs"

[dependencies]
mindtape = { version = "0.3.0", path = "../mindtape" }
# Same minimal shape as mindtape's own dependency: `recur.rs`/`recur_edit.rs`
# build `on(y, m, d)` Typst source and shift `start`/`due` with `NaiveDate`
# arithmetic directly (no clock reads — the reference date always comes from
# `mindtape::today_ymd()`/the task's own fields).
chrono = { version = "0.4", default-features = false, features = ["std"] }
typst-harvest = "0.6.0"
typst-cleanup = "0.3.0"
swhid-mint = "0.1.1"
typst-edit = "0.1.0"
clap = { version = "4", features = ["derive", "string"] }
toml = "0.8"
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
csv = "1"
terminal_size = "0.4"
crossterm = "0.29"
log = "0.4"
env_logger = "0.11"
dirs = "5"
anstyle = "1"
unicode-width = "0.2"
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }

[dev-dependencies]
mindtape = { path = "../mindtape", features = ["test-support"] }
swhid-mint = { version = "0.1.1", features = ["test-support"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Validates the shipped configs against the generated JSON Schema (draft
# 2020-12 aware) in tests/it/config_schema_validate.rs.
#
# default-features = false drops `resolve-http`/`resolve-file` — the schema is
# generated in-process and has no external `$ref` to fetch. Those defaults pull
# reqwest -> rustls -> aws-lc-sys, a C+assembly crypto build that needs NASM on
# windows-msvc, which would make the Windows test job depend on a toolchain the
# product itself never uses.
jsonschema = { version = "0.47", default-features = false }

[lints]
workspace = true
