[package]
name = "mindtape-cli"
description = "Command-line interface for MindTape, a file-based task tracker over Typst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "task-tracker", "cli", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "mt"
path = "src/main.rs"

[dependencies]
mindtape = { path = "../mindtape" }
typst-harvest = "0.1.0"
typst-cleanup = "0.1.0"
swhid-mint = "0.1.1"
typst-edit = "0.1.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
csv = "1"
terminal_size = "0.4"
crossterm = "0.29"
log = "0.4"
env_logger = "0.11"
dirs = "5"
anstyle = "1"
unicode-width = "0.2"

[dev-dependencies]
mindtape = { path = "../mindtape", features = ["test-support"] }
swhid-mint = { version = "0.1.1", features = ["test-support"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
