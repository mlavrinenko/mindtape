[package]
name = "typst-cst"
description = "Parse-plane structure extraction for Typst — heading tree with source spans, no eval, no World, no IO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "parse", "headings", "structure", "outline"]
categories = ["development-tools"]

[dependencies]
typst-syntax = "0.15"
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[lints]
workspace = true
