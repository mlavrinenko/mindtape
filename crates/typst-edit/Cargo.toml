[package]
name = "typst-edit"
description = "In-place editing for Typst source — parse-plane span queries and an atomic, non-overlapping changeset over typst-syntax; no eval, no World, no IO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "edit", "rewrite", "spans", "source"]
categories = ["development-tools"]

[dependencies]
typst-syntax = "0.15"
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[lints]
workspace = true
