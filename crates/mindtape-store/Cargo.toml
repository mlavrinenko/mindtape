[package]
name = "mindtape-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Store trait and SQLite backend for MindTape"
repository = "https://github.com/mlavrinenko/mindtape"
license-file = "../../LICENSE"
readme = "README.md"

[dependencies]
mindtape-eval = { path = "../mindtape-eval", version = "0.1.0" }
typst = "0.14"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
base62 = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
evalexpr = "13"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
