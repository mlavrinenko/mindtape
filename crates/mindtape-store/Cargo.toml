[package]
name = "mindtape-store"
version = "0.1.0"
edition = "2024"
description = "Store trait and SQLite backend for MindTape"
license = "MIT"

[dependencies]
mindtape-eval = { path = "../mindtape-eval" }
typst = "0.14"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
uuid = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
