# The benchmark project's config, copied into every generated fixture by
# crates/mindtape/benches/fixture.rs. Deliberately simple: one flat root, the
# full status legend, strict ICE priority, no body-shape rules. The generated
# tasks live under target/bench/tasks-<n>/tasks/ and this config is what
# `just bench::run` times `mt ls` and `mt check` against.

# The fixture's own copy of this checkout's `lib/`, written beside the tasks.
# Every task imports `@local/mindtape` from here, so a warm load re-hashes a
# shared project-local prelude the way the real backlog does. It also makes the
# fixture hermetic: no `mt install` has to have run for it to evaluate.
[[typst.local-packages]]
name = "mindtape"
path = "lib"

[tasks]
[[tasks.roots]]
path = "tasks"
name = "big"
derive-tags = true

# Status legend: legal values in lifecycle order. `to` declares the allowed
# next statuses, so `mt flip` gates every move to a listed edge (`--force`
# overrides) and `mt check` flags a status unreachable from `proposed`.
[[tasks.status]]
value = "proposed"
glyph = "💡"
color = "blue"
to = ["accepted", "wip", "cancelled"]

[[tasks.status]]
value = "accepted"
glyph = "📋"
color = "cyan"
to = ["wip", "cancelled"]

[[tasks.status]]
value = "wip"
glyph = "🔨"
color = "yellow"
to = ["done", "failed", "cancelled"]

[[tasks.status]]
value = "done"
glyph = "✅"
color = "green"
terminal = true
to = ["wip"]

[[tasks.status]]
value = "cancelled"
glyph = "🚫"
color = "magenta"
terminal = true

[[tasks.status]]
value = "failed"
glyph = "❌"
color = "red"
terminal = true
to = ["wip"]

# Priority: strict ICE on a 0..9 scale. `allow-manual = false` — every task
# scores through the framework, no hand-set ints.
[tasks.priority]
kind = "int"
min = 0
max = 9
required = "!terminal"
framework = "ice"
allow-manual = false

[[tasks.priority.bands]]
label = "green"
min = 0
max = 2
glyph = "🟢"
color = "green"

[[tasks.priority.bands]]
label = "amber"
min = 3
max = 6
glyph = "🟡"
color = "yellow"

[[tasks.priority.bands]]
label = "red"
min = 7
max = 9
glyph = "🔴"
color = "red"

[tasks.estimate]
units = ["minutes", "hours", "days", "weeks"]

[tasks.tags]
# "bench" is authored on every generated task; "big" is the derive-tags root
# tag emitted on every task under the "big" root — both must be allow-listed.
allowed = ["bench", "big"]

# A set-level rule asserted on every task, so the benchmark times `count`:
# it walks the set once per command however many tasks ask, keeping
# `mt check` linear. The cap is the fixture's size, so it always holds.
[[tasks.rules]]
name = "wip-cap"
assert = 'count(status == "wip") <= 2000'
severity = "error"
