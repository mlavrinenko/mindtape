# mindtape:budget — a task's size, in source files, held to a budget.
#
# The task's own Changes section is the plan: every bullet starts with one
# backticked path, and a `changes` collector reads the first path on each
# bullet, so `derived.changes` is a `["path"]` list. A glob counts once; the
# collector never expands it. The plan counts non-test SOURCE FILES — not the
# docs, tests and changelog every task touches by process. The pack keeps
# `[tasks.estimate] units = ["src-files"]`, so a task filed before the
# collector, with an `estimate.src-files`, stays valid. `[dicts.source]` is
# `**`; narrow it in your own `[dicts.source]` with `!` globs (docs, generated
# files, fixtures), which replaces this one.
#
# Both rules read `count_paths(derived.changes, "@source")`, which counts the
# distinct normalized paths in that set. The collector's `when` skips a closed
# task, so history is not rewritten.
#
# `judgment-stays-small` is an error, not a warning: an oversized task must be
# split before the work starts, not after. Only judgment work is capped,
# because the decomposition pressure a cap exists to create belongs on
# unbounded judgment, not on size. Judgment work (`min-difficulty` and up on
# the difficulty rubric) plans at most `max-files` source files, since a design
# decision spread wider than that is two decisions. Mechanical work has no
# cap: a fully specified change carries one decision however many files it
# touches, and splitting it only copies that decision into several tasks. A
# milestone is skipped, since it holds no files of its own. The default of 5
# is the p75 of one repo's files-per-commit over 200 commits; retune it as
# your backlog shows where it pinches.
#
# `src-budget` warns when the working tree outgrows the plan filed for the task
# in progress. The plan is never raised: it records the decomposition as
# planned.
#
# A project that sizes in another unit overrides both rules by name: a
# parameter reaches expressions only, never the unit.
#
# Adopt it as `extends = ["mindtape:budget"]`, or tune it with
# `{ pack = "mindtape:budget", with = { max-files = 8 } }`.

[params]
# The most source files a judgment task may plan.
max-files = 5
# The lowest difficulty that counts as judgment work.
min-difficulty = 3

[tasks.estimate]
# Kept for tasks filed before the Changes collector, so an old
# `estimate.src-files` stays valid.
units = ["src-files"]

[[tasks.collectors]]
name = "changes"
when = "!terminal"
query = { section = "Changes", pattern = "(?m)^\\s*-\\s+`([^`]+)`" }
returns = ["path"]

[[tasks.rules]]
name = "judgment-stays-small"
when = '!terminal && kind != "milestone" && difficulty >= param("min-difficulty")'
assert = 'count_paths(derived.changes, "@source") <= param("max-files")'
message = "split the decision from the mechanical fan-out instead of widening the cap"
severity = "error"

[[tasks.rules]]
name = "src-budget"
when = 'status == "wip"'
assert = 'changed("staged+worktree", "@source") <= count_paths(derived.changes, "@source")'
message = "move work not yet written into a new task; what is already written ships with this one, so closing it needs no split"
severity = "warn"

[dicts.source]
case = "exact"
values = ["**"]
