# mindtape:tasks — the flagship task practice as a rule pack.
#
# `extends = ["mindtape:tasks"]` in any config layer gives a repo the shape
# Mindtape's own backlog is written in: every open task is one spec in a
# closed set of sections, in a fixed order, each with markers and caps that
# make it skimmable and reproducible without a template a human has to copy
# by hand. Adopt it, then layer this repo's OWN policy over it with `disable
# = ["<name>"]` or a same-named override — see `.mindtape/config.toml` for a
# worked example (`section-allowlist`, overridden there to add a local-only
# `Dogfood` section).
#
# The set came out of the 2026-09-15 backlog review and the research it was
# checked against:
#
# - Problem: numbered steps anyone can follow, commands in backticks, and the
#   step that shows the defect opening with 🔴. Reproduction scripts raise
#   agent solve rates while narrative steps add little (arXiv 2607.07593);
#   developers rank steps to reproduce first (Bettenburg et al., FSE 2008).
# - TO-BE: how it should work, behave and feel once this lands, each bullet
#   opening with 🟢. A vision, not a test plan — the project's own gates do
#   the verifying.
# - Changes: bullets naming the files and what changes in each. Fix
#   suggestions and fault localization raise solve rates (arXiv 2607.07593),
#   but a wrong plan hurts more than none (arXiv 2604.12147): name places,
#   not a script.
# - Out of scope: what not to touch, so the diff stays one change.
#
# Four kinds carry one more section where the research names a gap in those
# four: a fix says where its Problem reproduces (Environment, the version and
# platform block of GitHub's bug form), a feat which designs it rejected
# (Alternatives, essential in Google design docs and Rust RFCs), a docs
# change what its prose must match (Source of truth), and a dev chore how to
# undo it (Rollback).
#
# Headings and lists carry weight on their own: stripping them lowers solve
# rates with the content intact, and so does length (arXiv 2607.07593). Hence
# the closed section set and the word caps below.
#
# What this pack deliberately leaves out, because it is only ever true of the
# adopting repo, never of the practice itself: a goal-verdicts rule (its
# `check` names a Typst module local to the repo), any extra section such as
# a `Dogfood` heading, assignees, WIP limits, estimate bounds, and a close
# gate. Add those in the extending layer.

[[tasks.body.headers.rules]]
name = "section-allowlist"
action = "allowlist"
allowed = [
  { match = "^(Problem|Environment|TO-BE|Source of truth|Changes|Alternatives|Rollback|Out of scope)$" },
]
when = "!terminal"
message = "limit an open task to Problem, TO-BE, Changes and Out of scope, plus its kind's own section"

[[tasks.body.headers.rules]]
name = "environment-for-fix"
path = ["Environment"]
action = "unique"
when = '!terminal && kind == "fix"'
message = "add one Environment section saying where the Problem reproduces"

[[tasks.body.headers.rules]]
name = "alternatives-for-feat"
path = ["Alternatives"]
action = "unique"
when = '!terminal && kind == "feat"'
message = "add one Alternatives section naming the designs you rejected"

[[tasks.body.headers.rules]]
name = "source-of-truth-for-docs"
path = ["Source of truth"]
action = "unique"
when = '!terminal && kind == "docs"'
message = "add one Source of truth section naming what the prose must match"

[[tasks.body.headers.rules]]
name = "rollback-for-dev"
path = ["Rollback"]
action = "unique"
when = '!terminal && kind == "dev"'
message = "add one Rollback section saying how to undo the change"

[[tasks.body.headers.rules]]
name = "environment-only-for-fix"
action = "forbid"
path = ["Environment"]
when = '!terminal && kind != "fix"'
message = "remove the Environment section; only fix tasks have one"

[[tasks.body.headers.rules]]
name = "alternatives-only-for-feat"
action = "forbid"
path = ["Alternatives"]
when = '!terminal && kind != "feat"'
message = "remove the Alternatives section; only feat tasks have one"

[[tasks.body.headers.rules]]
name = "source-of-truth-only-for-docs"
action = "forbid"
path = ["Source of truth"]
when = '!terminal && kind != "docs"'
message = "remove the Source of truth section; only docs tasks have one"

[[tasks.body.headers.rules]]
name = "rollback-only-for-dev"
action = "forbid"
path = ["Rollback"]
when = '!terminal && kind != "dev"'
message = "remove the Rollback section; only dev tasks have one"

# Order rules. Each passes while either side is absent, so a pair binds only
# the kinds that carry both sections.
[[tasks.body.headers.rules]]
name = "environment-after-problem"
action = "order"
before = ["Problem"]
after = ["Environment"]
when = "!terminal"
message = "move Environment after Problem"

[[tasks.body.headers.rules]]
name = "to-be-after-problem"
action = "order"
before = ["Problem"]
after = ["TO-BE"]
when = "!terminal"
message = "move TO-BE after Problem"

[[tasks.body.headers.rules]]
name = "source-of-truth-after-to-be"
action = "order"
before = ["TO-BE"]
after = ["Source of truth"]
when = "!terminal"
message = "move Source of truth after TO-BE"

[[tasks.body.headers.rules]]
name = "changes-after-to-be"
action = "order"
before = ["TO-BE"]
after = ["Changes"]
when = "!terminal"
message = "move Changes after TO-BE"

[[tasks.body.headers.rules]]
name = "changes-after-source-of-truth"
action = "order"
before = ["Source of truth"]
after = ["Changes"]
when = "!terminal"
message = "move Changes after Source of truth"

[[tasks.body.headers.rules]]
name = "alternatives-after-changes"
action = "order"
before = ["Changes"]
after = ["Alternatives"]
when = "!terminal"
message = "move Alternatives after Changes"

[[tasks.body.headers.rules]]
name = "rollback-after-changes"
action = "order"
before = ["Changes"]
after = ["Rollback"]
when = "!terminal"
message = "move Rollback after Changes"

[[tasks.body.headers.rules]]
name = "out-of-scope-after-changes"
action = "order"
before = ["Changes"]
after = ["Out of scope"]
when = "!terminal"
message = "move Out of scope after Changes"

[[tasks.body.headers.rules]]
name = "out-of-scope-after-alternatives"
action = "order"
before = ["Alternatives"]
after = ["Out of scope"]
when = "!terminal"
message = "move Out of scope after Alternatives"

[[tasks.body.headers.rules]]
name = "out-of-scope-after-rollback"
action = "order"
before = ["Rollback"]
after = ["Out of scope"]
when = "!terminal"
message = "move Out of scope after Rollback"

[[tasks.body.headers.rules]]
name = "one-problem-section"
path = ["Problem"]
action = "unique"
when = "!terminal"
message = "keep exactly one Problem section"

[[tasks.body.headers.rules]]
name = "one-to-be-section"
path = ["TO-BE"]
action = "unique"
when = "!terminal"
message = "keep exactly one TO-BE section"

[[tasks.body.headers.rules]]
name = "one-changes-section"
path = ["Changes"]
action = "unique"
when = "!terminal"
message = "keep exactly one Changes section"

[[tasks.body.headers.rules]]
name = "one-out-of-scope-section"
path = ["Out of scope"]
action = "unique"
when = "!terminal"
message = "keep exactly one Out of scope section"

# No section takes a subsection. The wildcard pair matches any heading nested
# under any heading, so one rule closes the whole depth axis rather than
# naming each section — a section that has grown sub-structure is the shape a
# task takes just before it should have been two tasks.
[[tasks.body.headers.rules]]
name = "no-subsections"
action = "forbid"
path = [{ match = ".*" }, { match = ".*" }]
when = "!terminal"
message = "remove the subsections, or split the task; a section takes none"

# Section-content rules: the heading rules above prove the sections exist;
# these prove each one says what its heading promises. Regexes run over the
# section's source text.
[[tasks.body.content.rules]]
name = "problem-is-numbered-steps"
path = ["Problem"]
assert = { must-match = "(?m)^\\s*(\\+|\\d+\\.)\\s" }
when = "!terminal"
message = "write the Problem as numbered steps anyone can follow"

[[tasks.body.content.rules]]
name = "problem-marks-the-defect"
path = ["Problem"]
assert = { must-match = "(?m)^\\s*(\\+|\\d+\\.)\\s+🔴" }
when = "!terminal"
message = "open the step that shows the defect with 🔴"

[[tasks.body.content.rules]]
name = "to-be-has-green-bullets"
path = ["TO-BE"]
assert = { must-match = "(?m)^\\s*- 🟢" }
when = "!terminal"
message = "say how it should work as bullets opening with 🟢"

[[tasks.body.content.rules]]
name = "to-be-bullets-all-green"
path = ["TO-BE"]
assert = { must-not-match = "(?m)^\\s*- [^🟢]" }
when = "!terminal"
message = "open every TO-BE bullet with 🟢"

[[tasks.body.content.rules]]
name = "changes-name-files"
path = ["Changes"]
assert = { must-match = "(?m)^\\s*- .*`" }
when = "!terminal"
message = "list Changes as bullets naming the `path` each one touches"

[[tasks.body.content.rules]]
name = "named-sections-non-empty"
path = [
  { match = "^(Out of scope|Environment|Source of truth|Alternatives|Rollback)$" },
]
assert = "non-empty"
when = "!terminal"
message = "write what belongs under the heading, or why nothing does, or remove it"

# Word caps, provisional: set on 2026-09-15 with headroom over the rewritten
# open tasks in Mindtape's own backlog. A section over its cap is a task that
# should have been two.
[[tasks.body.content.rules]]
name = "section-word-cap"
path = [
  { match = "^(Problem|Environment|TO-BE|Source of truth|Alternatives|Rollback|Out of scope)$" },
]
assert = { max-words = 120 }
when = "!terminal"
message = "cut this section to under 120 words, or split the task in two"

[[tasks.body.content.rules]]
name = "changes-word-cap"
path = ["Changes"]
assert = { max-words = 220 }
when = "!terminal"
message = "cut this section to under 220 words, or split the task in two"

# A task proposing config or API surface pays for a translation step when it
# only describes the shape in prose. Only fires on a task tagged `gating`, a
# convention the extending layer's own `[tasks.tags]` opts into — silently
# inert for a repo that never uses the tag.
[[tasks.body.content.rules]]
name = "show-shape-when-gating"
path = ["TO-BE"]
assert = { must-match = "[`]{3}" }
when = 'has_tag("gating") && !terminal'
message = "show the proposed config shape in a block"

[[tasks.body.content.rules]]
name = "no-em-dash-pileup"
path = [{ match = ".*" }]
assert = { density = { pattern = "—", max = 1, per = "paragraph" } }
when = "!terminal"
message = "keep one em dash per paragraph at most; use a comma, a colon or a second sentence for the rest"

# A question left in the sections that say what to build is a decision the
# implementer makes alone halfway through. Density skips code, so a `?` in a
# quoted command passes, and Problem stays free to quote output that has one.
[[tasks.body.content.rules]]
name = "no-open-questions"
path = [{ match = "TO-BE|Changes|Out of scope|Dogfood" }]
assert = { density = { pattern = '\?(\s|$)', max = 0, per = "sentence" } }
when = "!terminal"
message = "ask the user and write the answer in, since a task leaves no question open"

# A title's grammatical shape is a convention `mt check` can hold once there
# is a vocabulary to ask against: `verbs` unions both dictionaries `mt` ships
# so this rule always has one, project-specific additions included via a
# same-named `[dicts.verbs]` override in the extending layer.
[[tasks.rules]]
name = "imperative-title"
assert = 'in_dict("verbs", word(title, 1))'
when = "!terminal"
message = "start the title with an imperative verb"
severity = "error"

[dicts.verbs]
include = ["mindtape-verbs", "mindtape-dev-verbs"]

# A commit names the task it works on, by stem — the flagship practice's
# other half, checked at commit time rather than review. `!tasks_only` exempts
# a commit that only files or edits task artifacts: it refs nothing but
# itself. A `fixup!`, `squash!` or `amend!` subject is exempt too, since
# autosquash drops its message. An unsquashed fixup passes this rule, so
# `no-unsquashed-fixup` below refuses it under `mt check --commits`.
# The extending layer's own `[commits]` sets the trailer key (default
# `Refs`) and wires a `commit-msg` hook to `mt check --commit-msg`; the rule
# fires either way.
[[commits.rules]]
name = "work-names-a-task"
scope = "commit"
when = '!tasks_only && !matches(subject, "^(fixup|squash|amend)! ")'
assert = "has(refs)"
message = "name the task this commit works on in a `Refs: <stem>` footer"
severity = "error"

# A fixup, squash or amend commit is fine while it is being written, since
# autosquash drops its message, but a range that still holds one has not been
# squashed. `in_range` is true only under `mt check --commits`, so the commit
# hook lets the fixup through and the merge or CI check refuses it.
[[commits.rules]]
name = "no-unsquashed-fixup"
scope = "commit"
when = "in_range"
assert = '!matches(subject, "^(fixup|squash|amend)! ")'
message = "squash this commit first: git rebase -i --autosquash <target>"
severity = "error"

# A status flip rides with the work it claims, checked per task rather than
# per commit (`scope = "task"`, see truth/tasks/evaluate-task-scope-commit-
# rules.typ): `into("s")` desugars to `staged(status == "s") &&
# !head(status == "s")`, so this fires only on the commit that actually moves
# the task into `wip` or `done`, not on every commit that merely touches it.
# `named` demands the `Refs:` trailer this same pack's `work-names-a-task`
# already requires; `!tasks_only` is the escape hatch for a task that closes
# with no code of its own — a pure decision, `has_tag("decision")` in the
# STAGED state, so the tag on the commit that does the closing is what is
# read, not a stale one from before. The extending layer's own tag vocabulary
# decides whether `"decision"` is ever a legal tag at all; where it is not, no
# task-only close can ever satisfy this half, which is a stricter policy, not
# a broken one — see `.mindtape/config.toml` for this repo's own call.
# `retires_other` is the second escape hatch: a close whose work is retiring
# other tasks (`mt rm`) touches nothing but task files, yet it is work. A
# flip beside mere edits to other tasks' files still counts as none. The third
# is a milestone: `staged(kind == "milestone")` reads the same `kind` this
# pack's section rules do, for a task that ends through its leaves and carries
# no work of its own.
[[commits.rules]]
name = "flip-with-work"
scope = "task"
when = 'into("wip") || into("done")'
assert = 'named && (!tasks_only || retires_other || staged(has_tag("decision")) || staged(kind == "milestone"))'
message = "start or close a task in a commit that carries its work"
severity = "error"

# A branch that works on a task finishes it: `scope = "tip"` runs once per task
# any commit of `mt check --commits <range>` names, over that task as the
# range's newest commit holds it (a task the tip lacks is skipped).
# `status` is a plain task field here, since a tip has one task state. Hang
# the check on the merge: a `wt merge` pre-merge hook running `mt check
# --commits {{ target }}..HEAD` refuses a branch that left a named task
# `wip`.
[[commits.rules]]
name = "named-tasks-finish-at-the-tip"
scope = "tip"
assert = '!(status == "wip")'
message = "run `mt done <stem>` and commit it with the task's last work"
severity = "error"
