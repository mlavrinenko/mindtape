# Baked-in priority scoring frameworks (the default config layer).
#
# This table is deep-merged under any user `[tasks.priority.frameworks.<name>]`
# before deserialization, so a project activates a built-in with just
# `[tasks.priority] framework = "<name>"` — and may override individual fields.
#
# Each framework declares typed, bounded `inputs` and either:
#   - a scalar `score` (an evalexpr formula over the inputs), feeding the
#     `[tasks.priority]` bands; or
#   - a `category` list (exhaustive + disjoint over boolean/enum inputs), each
#     with a `when` predicate, representative `score`, and display glyph/colour.
#
# An active framework's achievable score range must fit the priority scale; the
# built-ins below are normalised to the default 0..9 scale.

# ICE — impact x confidence x ease, normalised to 0..9.
[ice]
score = "round(impact * confidence * ease * 0.09)"
[ice.inputs.impact]
type = "number"
min = 1
max = 10
[ice.inputs.confidence]
type = "number"
min = 0
max = 1
[ice.inputs.ease]
type = "number"
min = 1
max = 10

# RICE — reach x impact x confidence / effort, normalised to 0..9.
[rice]
score = "round(reach * impact * confidence / effort * 0.18)"
[rice.inputs.reach]
type = "number"
min = 0
max = 10
[rice.inputs.impact]
type = "number"
min = 1
max = 5
[rice.inputs.confidence]
type = "number"
min = 0
max = 1
[rice.inputs.effort]
type = "number"
min = 1
max = 10

# WSJF — cost of delay / job size, normalised to 0..9.
[wsjf]
score = "round(cost_of_delay / job_size * 0.9)"
[wsjf.inputs.cost_of_delay]
type = "number"
min = 0
max = 10
[wsjf.inputs.job_size]
type = "number"
min = 1
max = 10

# Eisenhower — urgent x important quadrants (categorical).
[eisenhower]
[eisenhower.inputs.urgent]
type = "bool"
[eisenhower.inputs.important]
type = "bool"
[[eisenhower.category]]
when = "urgent && important"
score = 9
label = "do"
glyph = "🔥"
color = "red"
[[eisenhower.category]]
when = "important && !urgent"
score = 6
label = "schedule"
glyph = "📅"
color = "yellow"
[[eisenhower.category]]
when = "urgent && !important"
score = 3
label = "delegate"
glyph = "🤝"
color = "cyan"
[[eisenhower.category]]
when = "!urgent && !important"
score = 0
label = "delete"
glyph = "🗑"
color = "green"

# MoSCoW — must / should / could / won't (categorical).
[moscow]
[moscow.inputs.level]
type = "enum"
values = ["must", "should", "could", "wont"]
[[moscow.category]]
when = 'level == "must"'
score = 9
label = "must"
glyph = "🔴"
color = "red"
[[moscow.category]]
when = 'level == "should"'
score = 6
label = "should"
glyph = "🟠"
color = "yellow"
[[moscow.category]]
when = 'level == "could"'
score = 3
label = "could"
glyph = "🟡"
color = "cyan"
[[moscow.category]]
when = 'level == "wont"'
score = 0
label = "won't"
glyph = "⚪"
color = "green"
