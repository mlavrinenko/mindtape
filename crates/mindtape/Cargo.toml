[package]
name = "mindtape"
description = "A file-based task tracker using per-file Typst artifacts as the source of truth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "task-tracker", "productivity"]
categories = ["development-tools"]

[features]
# Expose shared task fixtures (`test_support`) to dependent crates' tests.
test-support = []

[dependencies]
# `default-features = false` + `std` only: NaiveDate/Months/Days arithmetic,
# no `clock` (that pulls in reading the OS timezone/`Local::now()`) — every
# recur date computation takes its reference date from the caller.
chrono = { version = "0.4", default-features = false, features = ["std"] }
typst-harvest = "0.1.0"
typst-cst = "0.1.0"
typst-edit = "0.1.0"
artifact-gate = "0.1.0"
swhid-mint = { version = "0.1.1", default-features = false }
serde = { version = "1", features = ["derive"] }
globset = "0.4"
toml = "0.8"
thiserror = "2"
evalexpr = "12"
uuid = { version = "1", features = ["v4", "v7"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
