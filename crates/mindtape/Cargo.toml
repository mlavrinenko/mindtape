[package]
name = "mindtape"
description = "A file-based task tracker using per-file Typst artifacts as the source of truth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "task-tracker", "productivity"]
categories = ["development-tools"]

[features]
# Expose shared task fixtures (`test_support`) to dependent crates' tests.
test-support = ["dep:tempfile"]

[dependencies]
# `default-features = false` + `std` for NaiveDate/Months/Days arithmetic
# (every recur date computation takes its reference date from the caller), plus
# `clock` for the one clock read in the tree: `crates/mindtape/src/date/mod.rs`
# resolves "today" as the machine's LOCAL calendar date (`Local::now()`), not
# UTC — see `truth/tasks/decide-whether-today-is-utc-or-local.typ`. `clock`
# adds `iana-time-zone`; chrono resolves the zone itself (no `localtime_r`), so
# there is no multithreaded-soundness hazard.
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
] }
# The `rrule(...)` escape hatch's expander (`crates/mindtape/src/recur/rrule.rs`).
# Every build carries it, so a calendar rule works in the binary a user
# installs. It adds chrono-tz to the build.
rrule = "0.14"
typst-harvest = "0.6.0"
# Already in the tree at this exact version, transitively under `typst-harvest`
# (which re-exports its `World` as `HarvestWorld`), so this edge adds no crate
# to the build. It is direct because `crates/mindtape/src/validate/candidate.rs` needs
# the two items the re-export does not carry — `DiskProvider` and
# `root_file_id` — to build a world whose main file is an UNWRITTEN source
# (`World::with_source_override`). Every disk-backed constructor canonicalizes
# its path, so validating a task before it exists has no other door.
typst-world = "0.5.6"
typst-cst = "0.2.0"
typst-edit = "0.1.0"
# Normalize the Typst source `mt` writes to typstyle's canonical form
# (`crates/mindtape/src/format.rs`). The library crate, not the CLI: in-process,
# deterministic, idempotent. Pins `typst-syntax` 0.15 — the exact version
# `typst-harvest` already resolves — so it adds no second `typst` crate.
typstyle-core = "0.15.0"
# Validates framework input names as Typst identifiers (`is_ident`) before they
# splice into generated `framework("f", input: …)` calls (`framework/validate.rs`).
# Same 0.15 already pinned via typstyle-core, so no second typst crate.
typst-syntax = "0.15"
artifact-gate = "0.1.0"
swhid-mint = { version = "0.1.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content-hashing task files for the persistent per-file harvest cache
# (`crates/mindtape/src/loader/cache.rs`): a file's SHA-1 keys its cache entry, and a
# per-file digest feeds the prelude/lib fingerprint in the build key.
sha1 = "0.10"
# The framed tree hash a `.mindtape/packs.lock` entry pins
# (`crates/mindtape/src/config/pack_sources/hash.rs`). SHA-256, since the
# hash names the cache directory a fetched source lands in. Shares `digest`
# 0.10 with `sha1`.
sha2 = "0.10"
# Derives the JSON Schema for `.mindtape/config.toml` straight off the config
# structs (single source of truth), so `mt install`/`mt init` can ship an
# editor-assist schema that never drifts from the types. Emits draft 2020-12.
schemars = "1"
globset = "0.4"
# The `regex` link-target validator's engine (`[[tasks.links.kinds]] validate =
# "regex"`, `crates/mindtape/src/config/links_validate.rs`). Already in the tree
# via `artifact-gate`'s header matchers, so this is a direct edge on a crate
# that is compiled either way.
regex = "1"
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
evalexpr = "12"
uuid = { version = "1", features = ["v4", "v7"] }
dirs = "5"
# `canonical` (`src/fs_canonical.rs`): `std::fs::canonicalize` returns a
# `\\?\` verbatim path on Windows, which dunce turns back into `C:\` when
# that is safe. Already in `Cargo.lock` transitively, at the same version.
dunce = "1"
# Nearest-name suggestion for an unknown view name (`crates/mindtape/src/
# suggest.rs`). Already in `Cargo.lock` transitively via clap's `Command`
# suggestion feature, at the same 0.11 line this pins, so promoting it to a
# direct dependency here adds no new crate to the build.
strsim = "0.11"
# The `test-support` fixtures hand out tempdirs. Already a dependency of the
# CLI, so enabling the feature adds no crate to its build.
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
# Already in the tree at these versions, under `typst-harvest`. The harvest
# evaluates and never lays out, so `loader/tests_prelude.rs` compiles a task
# file itself to prove the prelude's card lays a count estimate out.
typst = "0.15"
typst-layout = "0.15"

[lints]
workspace = true
