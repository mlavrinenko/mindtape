[package]
name = "mindtape"
description = "A file-based task tracker using per-file Typst artifacts as the source of truth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["typst", "task-tracker", "productivity"]
categories = ["development-tools"]

[dependencies]
typst-harvest = { path = "../typst-harvest", version = "0.4.0" }
typst-cst = { path = "../typst-cst", version = "0.4.0" }
artifact-gate = { path = "../artifact-gate", version = "0.4.0" }
swhid-mint = { path = "../swhid-mint", version = "0.4.0", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
evalexpr = "12"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
