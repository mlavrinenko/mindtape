<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="tape1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00fff7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tape2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tape3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="brain-clip">
      <circle cx="100" cy="100" r="62"/>
    </clipPath>
  </defs>

  <!-- Tape strips, clipped to a circle around the brain so they wrap tightly -->
  <g clip-path="url(#brain-clip)" filter="url(#glow)">
    <!-- Tape 1: diagonal upper-left to lower-right -->
    <g transform="rotate(-25, 100, 100)">
      <rect x="20" y="62" width="130" height="14" rx="2" fill="url(#tape1)"/>
      <!-- Tape track lines -->
      <line x1="20" y1="67" x2="150" y2="67" stroke="rgba(0,0,0,0.25)" stroke-width="0.7"/>
      <line x1="20" y1="71" x2="150" y2="71" stroke="rgba(0,0,0,0.25)" stroke-width="0.7"/>
    </g>

    <!-- Brain emoji -->
    <text x="100" y="99" font-size="96" text-anchor="middle" dominant-baseline="central">🧠</text>

    <!-- Tape 2: opposite diagonal -->
    <g transform="rotate(20, 100, 100)">
      <rect x="20" y="110" width="140" height="14" rx="2" fill="url(#tape2)"/>
      <line x1="20" y1="115" x2="180" y2="115" stroke="rgba(0,0,0,0.25)" stroke-width="0.7"/>
      <line x1="20" y1="119" x2="180" y2="119" stroke="rgba(0,0,0,0.25)" stroke-width="0.7"/>
    </g>
  </g>
</svg>
