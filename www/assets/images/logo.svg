<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="MindTape">
  <!-- MindTape mark: a tape strip laid over a cassette.
       Monochrome-first and a single evenodd path, on purpose. The site header
       renders this file as a flat CSS mask tinted with the accent token (see
       .brand-mark in www/assets/styles/main.css), so only the SILHOUETTE
       survives there. The two reel holes are negative space rather than a
       second colour, which is what keeps the mark readable at 16 to 26px in
       both the mask and the favicon. Any future edit must stay one colour and
       carry its meaning in the outline, never in a fill contrast.
       Note: XML comments cannot contain a double hyphen. -->
  <path fill="#12805a" fill-rule="evenodd" d="M3.5 4 H20.5 a1.1 1.1 0 0 1 0 2.2 H3.5 a1.1 1.1 0 0 1 0 -2.2 Z M4.5 8.4 H19.5 a2.5 2.5 0 0 1 2.5 2.5 V17 a2.5 2.5 0 0 1 -2.5 2.5 H4.5 a2.5 2.5 0 0 1 -2.5 -2.5 V10.9 a2.5 2.5 0 0 1 2.5 -2.5 Z M8.5 11.9 a2 2 0 1 0 0 4 a2 2 0 1 0 0 -4 Z M15.5 11.9 a2 2 0 1 0 0 4 a2 2 0 1 0 0 -4 Z"/>
</svg>
